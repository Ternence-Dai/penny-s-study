<body data-workspace="study"><a class="skip-link" href="#view">跳过导航，进入主要内容</a>
<canvas id="starsBg"></canvas>
<div class="app">
  <header class="navbar">
    <button class="back-btn hidden" id="backBtn">←</button>
    <h1 id="navTitle">星赛通 · 戴煜</h1>
  </header>
  
  
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><span class="ico"></span>首页</button>
    <button data-tab="learn"><span class="ico"></span>学习</button>
    <button data-tab="ai"><span class="ico">烙</span>知识库</button>
    <button data-tab="news"><span class="ico"></span>读报</button>
    <button data-tab="wrong"><span class="ico"></span>错题</button>
    <button data-tab="profile"><span class="ico"></span>我的</button>
  </nav>
</div>
<div class="reader-panel" id="readerPanel">
  <div class="reader-head"><div class="reader-title" id="readerTitle">未选择</div><div id="readerStatus">就绪</div></div>
  <div class="reader-text" id="readerText"></div>
  <div class="reader-row">
    <button class="main" id="readerPlay" onclick="Reader.toggle()">▶ 播放</button>
    <button onclick="Reader.stop()">■ 停止</button><button onclick="Reader.prev()">上一句</button><button onclick="Reader.next()">下一句</button>
  </div>
  <div class="reader-sliders">
    <div class="r-slider"><label>语速</label><input type="range" id="rSpeed" min="0.6" max="1.8" step="0.05" value="1" oninput="Reader.setSpeed(this.value)"><span class="r-val" id="rSpeedVal">1.0x</span></div>
    <div class="r-slider"><label>音量</label><input type="range" id="rVol" min="0.3" max="1" step="0.05" value="1" oninput="Reader.setVolume(this.value)"><span class="r-val" id="rVolVal">100%</span></div>
    <div class="r-slider"><label>音调</label><input type="range" id="rPitch" min="0.7" max="1.4" step="0.05" value="1.05" oninput="Reader.setPitch(this.value)"><span class="r-val" id="rPitchVal">1.05</span></div>
  </div>
</div>
<script src="./assets/js/question-bank.js"></script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
      console.warn('离线学习缓存注册失败，在线学习仍可继续。', error);
    });
  });
}
</script>
