<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星赛通 · 天文竞赛 · 戴煜</title>
<meta name="author" content="戴煜">
<meta name="email" content="18662613315@163.com">
<style>
:root{
  --bg:#0B1026;--bg2:#141C36;--bg3:#0F1730;
  --line:#1F2A4A;--text:#E8ECF7;--sub:#8A93B8;
  --blue:#4FA8FF;--blue-d:#2F7BFF;
  --green:#2ED47A;--red:#FF5B5B;--purple:#7B4FE0;
  --amber:#FFB84D;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;}
#starsBg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:rgba(11,16,38,.55);}
.navbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(11,16,38,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.navbar h1{font-size:16px;margin:0;font-weight:700;flex:1;}
.back-btn{background:none;border:none;color:var(--blue);font-size:22px;cursor:pointer;padding:0 6px;}
.view{flex:1;padding:18px 18px 96px;}
.hidden{display:none!important;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;display:flex;background:rgba(18,26,51,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
.tabbar button{flex:1;background:none;border:none;cursor:pointer;padding:9px 0 10px;color:var(--sub);font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tabbar button .ico{font-size:18px;line-height:1;}
.tabbar button.active{color:var(--blue);}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.title{font-size:22px;font-weight:800;margin:0 0 6px;}
.sub{color:var(--sub);font-size:13px;}
.sec-title{font-size:16px;font-weight:700;margin:24px 0 12px;}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-main{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}
.btn-ghost{background:transparent;color:var(--blue);border:1px solid var(--blue-d);}
.btn-amber{background:linear-gradient(135deg,#E08A1E,#FFB84D);color:#fff;}
.btn-sm{padding:9px 16px;font-size:14px;width:auto;border-radius:999px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-row{display:flex;gap:12px;}
.btn-row .btn{flex:1;}
.tag{display:inline-block;font-size:12px;color:var(--blue);background:rgba(79,168,255,.12);padding:2px 10px;border-radius:20px;margin-right:6px;}
.tag.err{color:var(--red);background:rgba(255,91,91,.12);}
.tag.ok{color:var(--green);background:rgba(46,212,122,.12);}
.tag.amber{color:var(--amber);background:rgba(255,184,77,.14);}
.tag.purple{color:#A78BFA;background:rgba(167,139,250,.15);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.hero{padding:6px 0 18px;}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:800;background:linear-gradient(135deg,#8FB4FF,#4FA8FF 60%,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sign{font-size:11.5px;color:var(--sub);margin-top:4px;}
.sign b{color:var(--blue);font-weight:600;}
.level-switch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;}
.level-switch button{flex:1;padding:11px 0;border:none;background:none;cursor:pointer;border-radius:999px;color:var(--sub);font-size:15px;font-family:inherit;font-weight:600;transition:.2s;}
.level-switch button.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}
.entry-row{display:flex;gap:12px;margin-bottom:6px;}
.entry-card{flex:1;border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;border:none;font-family:inherit;color:#fff;transition:transform .15s;}
.entry-card:active{transform:scale(.97);}
.entry-card.blue{background:linear-gradient(135deg,#1E4FA8,#2F7BFF);}
.entry-card.purple{background:linear-gradient(135deg,#4A2D8F,#7B4FE0);}
.entry-card.green{background:linear-gradient(135deg,#196B48,#2ED47A);}
.entry-card.amber{background:linear-gradient(135deg,#A66A15,#FFB84D);}
.entry-card .ico{font-size:28px;display:block;margin-bottom:8px;}
.entry-card .t{font-size:16px;font-weight:700;}
.entry-card .s{font-size:12px;opacity:.8;margin-top:3px;}
.chip-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:8px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:#B8C2DC;font-size:14px;font-family:inherit;}
.daily-stem{font-size:16px;line-height:1.6;margin:4px 0 12px;font-weight:500;}
.opt-line{color:#B8C2DC;font-size:14px;line-height:2;}
.answer-hint{margin-top:12px;color:var(--blue);font-size:14px;font-weight:600;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.counter{font-size:13px;color:var(--sub);}
.counter .ok{color:var(--green);}
.counter .no{color:var(--red);}
.progress{height:5px;background:#1A2340;border-radius:5px;overflow:hidden;margin-bottom:18px;}
.progress>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2F7BFF,#4FA8FF);transition:width .3s;}
.stem{font-size:17px;line-height:1.65;margin:4px 0 16px;font-weight:500;}
.q-image{background:rgba(15,23,48,.8);border-radius:14px;padding:12px;margin-bottom:16px;overflow:hidden;}
.q-image svg{display:block;width:100%;height:auto;max-height:220px;}
.option{display:flex;align-items:center;padding:14px 15px;margin-bottom:10px;background:var(--bg3);border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:all .18s;}
.option.selected{border-color:var(--blue);background:rgba(79,168,255,.12);}
.option.right{border-color:var(--green);background:rgba(46,212,122,.12);}
.option.wrong{border-color:var(--red);background:rgba(255,91,91,.12);}
.option.dim{opacity:.45;}
.opt-key{width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--line);font-size:13px;font-weight:700;margin-right:12px;flex-shrink:0;}
.option.selected .opt-key{background:var(--blue);color:#0B1026;}
.option.right .opt-key{background:var(--green);color:#0B1026;}
.option.wrong .opt-key{background:var(--red);color:#fff;}
.opt-text{flex:1;font-size:15px;line-height:1.5;}
.order-num{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;font-size:13px;font-weight:800;margin-right:12px;flex-shrink:0;}
.order-item.taken{opacity:.4;pointer-events:none;}
.fill-input{width:100%;padding:15px 16px;border-radius:14px;background:var(--bg3);border:2px solid var(--line);color:var(--text);font-size:16px;font-family:inherit;outline:none;}
.fill-input:focus{border-color:var(--blue);}
.explain{background:var(--bg2);border-left:4px solid var(--blue);border-radius:12px;padding:16px;margin-top:16px;}
.explain .head{font-size:16px;font-weight:700;margin-bottom:8px;}
.explain .head.ok{color:var(--green);}
.explain .head.no{color:var(--red);}
.explain .line{font-size:14px;line-height:1.75;color:#B8C2DC;margin-bottom:5px;}
.footer{margin-top:22px;}
.timer{font-size:19px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;}
.card-btn{font-size:12px;color:var(--blue);border:1px solid var(--blue-d);padding:4px 12px;border-radius:999px;background:none;cursor:pointer;font-family:inherit;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px 36px;transform:translateY(110%);transition:transform .28s;max-height:70vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet h3{margin:0 0 16px;font-size:17px;}
.sheet-grid{display:flex;flex-wrap:wrap;gap:10px;}
.sheet-item{width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;background:var(--line);color:var(--sub);font-size:14px;cursor:pointer;}
.sheet-item.done{background:rgba(79,168,255,.2);color:var(--blue);font-weight:700;}
.sheet-item.active{outline:2px solid var(--blue);color:#fff;}
.sheet-tip{margin-top:18px;font-size:12px;color:#5C6688;}
.score-card{background:linear-gradient(135deg,#1E4FA8,#2F7BFF 60%,#4FA8FF);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.score-card .lb{font-size:13px;opacity:.85;}
.score-card .num{font-size:60px;font-weight:900;line-height:1.15;}
.score-card .full{font-size:13px;opacity:.8;}
.score-card .rate{display:inline-block;margin-top:12px;font-size:13px;padding:5px 16px;background:rgba(255,255,255,.18);border-radius:999px;}
.stat-row{display:flex;background:var(--bg2);border-radius:var(--r);padding:18px 0;margin-bottom:22px;border:1px solid var(--line);}
.stat-row>div{flex:1;text-align:center;}
.stat-row .n{font-size:24px;font-weight:800;}
.stat-row .n.ok{color:var(--green);}
.stat-row .n.no{color:var(--red);}
.stat-row .n.gray{color:var(--sub);}
.stat-row .l{font-size:12px;color:var(--sub);margin-top:2px;}
.q-stem{font-size:15px;line-height:1.6;margin-bottom:12px;font-weight:500;}
.q-line{font-size:13.5px;line-height:1.95;color:#B8C2DC;}
.q-line .ok{color:var(--green);font-weight:700;}
.q-line .no{color:var(--red);text-decoration:line-through;}
.q-exp{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.75;}
.k-content{font-size:15px;line-height:2;color:#C8D2E8;white-space:pre-wrap;}
.learn-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;}
.learn-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.learn-ico{width:40px;height:40px;border-radius:12px;background:rgba(79,168,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.learn-name{font-size:16px;font-weight:700;flex:1;}
.learn-meta{font-size:12px;color:var(--sub);}
.mastery-bar{height:6px;background:#1A2340;border-radius:6px;overflow:hidden;margin:10px 0 6px;}
.mastery-bar>i{display:block;height:100%;border-radius:6px;transition:width .3s;}
.mastery-info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);}
.study-box{background:linear-gradient(135deg,rgba(47,123,255,.10),rgba(123,79,224,.10));border:1px solid rgba(79,168,255,.25);border-radius:var(--r);padding:18px;margin-bottom:14px;}
/* === 模拟器 === */
.sim-box{background:#06091a;border:1px solid rgba(79,168,255,.28);border-radius:14px;margin:12px 0;overflow:hidden;}
.sim-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(79,168,255,.08);border-bottom:1px solid rgba(79,168,255,.15);font-size:11.5px;color:var(--blue);}
.sim-head .sim-tag{font-weight:700;letter-spacing:.5px;}
.sim-head .sim-info{color:var(--sub);font-size:11px;}
.sim-canvas{display:block;width:100%;height:auto;background:#06091a;}
.sim-ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid rgba(79,168,255,.15);background:rgba(6,9,26,.9);}
.sim-ctrl button{background:none;border:1px solid var(--line);color:var(--blue);font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;min-width:52px;}
.sim-ctrl button:hover{background:rgba(79,168,255,.1);}
.sim-ctrl button.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.sim-ctrl .sim-speed{flex:1;display:flex;align-items:center;gap:6px;color:var(--sub);font-size:11px;}
.sim-ctrl input[type=range]{flex:1;-webkit-appearance:none;height:3px;border-radius:3px;background:var(--line);outline:none;}
.sim-ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
.sim-hint{font-size:11px;color:var(--sub);padding:4px 12px 8px;text-align:center;}
/* === 读报 === */
.news-list{display:flex;flex-direction:column;gap:12px;}
.news-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.2s;}
.news-card:hover{border-color:var(--blue);}
.news-card.active{border-color:var(--blue);background:linear-gradient(135deg,rgba(47,123,255,.12),rgba(123,79,224,.10));}
.news-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.news-date{font-size:11.5px;color:var(--sub);}
.news-title{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.4;}
.news-summary{font-size:13px;color:#B8C2DC;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.news-actions{display:flex;gap:8px;margin-top:12px;}
.news-actions button{flex:1;font-size:13px;padding:9px;border-radius:10px;border:1px solid var(--blue-d);background:none;color:var(--blue);cursor:pointer;font-family:inherit;}
.news-actions button.playing{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.reader-panel{position:fixed;left:0;right:0;bottom:64px;z-index:35;max-width:520px;margin:0 auto;background:rgba(15,23,48,.97);backdrop-filter:blur(14px);border-top:1px solid var(--blue-d);padding:12px 16px 14px;transform:translateY(120%);transition:transform .32s ease;box-shadow:0 -10px 30px rgba(0,0,0,.5);}
.reader-panel.show{transform:translateY(0);}
.reader-info{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px;}
.reader-title{font-size:13px;color:var(--blue);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;}
.reader-text{font-size:13.5px;color:#C8D2E8;line-height:1.65;max-height:120px;overflow-y:auto;padding:8px 10px;background:rgba(11,16,38,.7);border-radius:8px;margin-bottom:10px;}
.reader-text .hl{background:rgba(79,168,255,.28);color:#fff;border-radius:3px;padding:0 3px;transition:.2s;}
.reader-ctrl{display:flex;gap:8px;align-items:center;}
.reader-ctrl button{background:none;border:1px solid var(--line);color:var(--blue);font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;min-width:56px;}
.reader-ctrl button.main{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.reader-ctrl .rspd{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);}
.reader-ctrl .rspd input{flex:1;-webkit-appearance:none;height:3px;border-radius:3px;background:var(--line);outline:none;}
.reader-ctrl .rspd input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
/* === 其他 === */
.filter-bar{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-item{flex-shrink:0;padding:7px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:var(--sub);font-size:13.5px;font-family:inherit;white-space:nowrap;}
.filter-item.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.group-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:10px;}
.group-head .gh-l{display:flex;align-items:center;gap:10px;}
.group-head .gn{font-size:15.5px;font-weight:700;}
.group-head .gc{font-size:12px;color:var(--sub);}
.group-body{margin:-4px 0 14px;padding:0 4px;}
.row-item{display:flex;justify-content:space-between;align-items:center;font-size:15px;cursor:pointer;padding:16px 18px;}
.row-item .arrow{color:#5C6688;font-size:14px;}
.empty{text-align:center;padding:70px 0;}
.empty .ico{font-size:48px;margin-bottom:14px;}
.empty .txt{color:var(--sub);font-size:14px;}
.version{text-align:center;color:#3E4767;font-size:12px;margin:34px 0 10px;line-height:1.8;}
.grid2{display:flex;flex-wrap:wrap;background:var(--bg2);border-radius:var(--r);border:1px solid var(--line);padding:10px 0;margin-bottom:18px;}
.grid2>div{width:50%;text-align:center;padding:14px 0;}
.grid2 .n{font-size:24px;font-weight:800;color:var(--blue);}
.grid2 .l{font-size:12px;color:var(--sub);margin-top:3px;}
.profile-card{background:linear-gradient(135deg,#1A2A5A,#2F4FA8);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.profile-card .av{font-size:52px;margin-bottom:10px;}
.profile-card .nk{font-size:20px;font-weight:800;}
.type-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,184,77,.16);color:var(--amber);margin-left:6px;font-weight:600;}
.type-badge.blue{background:rgba(79,168,255,.16);color:var(--blue);}
.type-badge.purple{background:rgba(167,139,250,.16);color:#A78BFA;}
.type-badge.green{background:rgba(46,212,122,.16);color:var(--green);}
.ai-chat{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;}
.ai-msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.7;}
.ai-msg.user{align-self:flex-end;background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-bottom-right-radius:4px;}
.ai-msg.bot{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);color:#D0DAF0;border-bottom-left-radius:4px;white-space:pre-wrap;}
.ai-msg.bot b{color:var(--blue);}
.ai-typing{align-self:flex-start;color:var(--sub);font-size:13px;padding:8px 14px;}
.ai-input-row{position:fixed;left:0;right:0;bottom:64px;z-index:15;max-width:520px;margin:0 auto;display:flex;gap:8px;padding:10px 18px;background:rgba(11,16,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.ai-input{flex:1;padding:12px 16px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);color:var(--text);font-size:15px;font-family:inherit;outline:none;}
.ai-send{padding:0 20px;border-radius:999px;border:none;background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.ai-quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.ai-quick button{font-size:12.5px;padding:7px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:#B8C2DC;cursor:pointer;font-family:inherit;}
@media (max-width:360px){body{font-size:14px;}.stem{font-size:16px;}}
</style>
</head>
<body>

<canvas id="starsBg"></canvas>

<div class="app">
  <header class="navbar">
    <button class="back-btn hidden" id="backBtn">←</button>
    <h1 id="navTitle">星赛通 · 戴煜</h1>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><span class="ico"></span>首页</button>
    <button data-tab="learn"><span class="ico"></span>学习</button>
    <button data-tab="news"><span class="ico"></span>读报</button>
    <button data-tab="ai"><span class="ico">烙</span>AI</button>
    <button data-tab="wrong"><span class="ico"></span>错题</button>
    <button data-tab="profile"><span class="ico"></span>我的</button>
  </nav>
</div>

<div class="reader-panel" id="readerPanel">
  <div class="reader-info">
    <div class="reader-title" id="readerTitle">未选择</div>
    <div id="readerStatus">准备就绪</div>
  </div>
  <div class="reader-text" id="readerText"></div>
  <div class="reader-ctrl">
    <button class="main" id="readerPlay" onclick="Reader.toggle()">▶ 播放</button>
    <button onclick="Reader.stop()">■ 停止</button>

/* ======================================================
   动态星空背景
   ====================================================== */
(function(){
  var c = document.getElementById('starsBg'), x = c.getContext('2d');
  var stars = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    stars = [];
    var n = Math.floor(w * h / 6500);
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.7 + 0.2,
        da: (Math.random() - 0.5) * 0.015,
        vx: (Math.random() - 0.5) * 0.06, vy: (Math.random() - 0.5) * 0.06
      });
    }
  }
  function draw(){
    x.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.a += s.da;
      if (s.a < 0.1 || s.a > 0.95) s.da = -s.da;
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
      x.globalAlpha = s.a;
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      x.fillStyle = '#fff'; x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize', function(){ resize(); init(); });
})();

var $ = function(s){ return document.querySelector(s); };
var LETTERS = ['A','B','C','D','E','F'];

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rate(a,b){return b?Math.round(a/b*100):0;}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function norm(s){return String(s==null?'':s).trim().toLowerCase().replace(/[\s，,。.、；;：:！!？?"'"'（）()]/g,'').replace(/[°º]/g,'度').replace(/[′']/g,'分').replace(/[″"]/g,'秒');}

var KEY = { wrong:'a_w_v5', record:'a_r_v5', days:'a_d_v5', qstats:'a_q_v5', ai:'a_ai_v5' };
var Store = {
  getWrong:function(){try{return JSON.parse(localStorage.getItem(KEY.wrong))||[];}catch(e){return[];}},
  addWrong:function(id){var l=this.getWrong(),i=-1;for(var k=0;k<l.length;k++)if(l[k].id===id){i=k;break;}if(i>=0){l[i].count++;l[i].lastTime=Date.now();}else l.push({id:id,count:1,lastTime:Date.now()});localStorage.setItem(KEY.wrong,JSON.stringify(l));},
  removeWrong:function(id){localStorage.setItem(KEY.wrong,JSON.stringify(this.getWrong().filter(function(i){return i.id!==id;})));},
  clearWrong:function(){localStorage.removeItem(KEY.wrong);},
  getQStats:function(){try{return JSON.parse(localStorage.getItem(KEY.qstats))||{};}catch(e){return{};}},
  bumpQStat:function(id,ok){var s=this.getQStats();if(!s[id])s[id]={t:0,c:0};s[id].t++;if(ok)s[id].c++;s[id].last=Date.now();localStorage.setItem(KEY.qstats,JSON.stringify(s));},
  addRecord:function(r){var l=[];try{l=JSON.parse(localStorage.getItem(KEY.record))||[];}catch(e){}l.push(Object.assign({},r,{time:Date.now()}));if(l.length>500)l=l.slice(l.length-500);localStorage.setItem(KEY.record,JSON.stringify(l));var d=[];try{d=JSON.parse(localStorage.getItem(KEY.days))||[];}catch(e){}var td=new Date().toDateString();if(d.indexOf(td)<0){d.push(td);localStorage.setItem(KEY.days,JSON.stringify(d));}},
  getStats:function(){var r=[],d=[];try{r=JSON.parse(localStorage.getItem(KEY.record))||[];}catch(e){}try{d=JSON.parse(localStorage.getItem(KEY.days))||[];}catch(e){}var t=0,c=0;r.forEach(function(x){t+=(x.total||0);c+=(x.correct||0);});return{total:t,correct:c,rate:rate(c,t),sessions:r.length,days:d.length,wrongCount:this.getWrong().length};},
  clearAll:function(){['wrong','record','days','qstats'].forEach(function(k){localStorage.removeItem(KEY[k]);});},
  getAI:function(){try{return JSON.parse(localStorage.getItem(KEY.ai))||[];}catch(e){return[];}},
  saveAI:function(l){if(l.length>40)l=l.slice(l.length-40);localStorage.setItem(KEY.ai,JSON.stringify(l));},
  clearAI:function(){localStorage.removeItem(KEY.ai);}
};

/* ======================================================
   模拟器引擎（Canvas 动态模型）
   ====================================================== */
var SimEngine = {
  active: {},
  running: false,
  lastTime: 0,
  raf: null,
  sims: {},
  init: function(canvas, id){
    var sim = this.sims[id];
    if (!sim) return null;
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 480;
    var cssH = sim.height || 220;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return {
      sim: sim, ctx: ctx, w: cssW, h: cssH,
      t: 0, speed: 1, playing: true
    };
  },
  startAll: function(){
    var self = this;
    this.stopAll();
    var canvases = document.querySelectorAll('.sim-canvas');
    canvases.forEach(function(cv){
      var id = cv.dataset.sim;
      if (!id || !self.sims[id]) return;
      var inst = self.init(cv, id);
      if (!inst) return;
      self.active[cv.id] = inst;
      // 绑定控制按钮
      var box = cv.closest('.sim-box');
      if (box){
        var pb = box.querySelector('.sim-play');
        var rb = box.querySelector('.sim-reset');
        var sp = box.querySelector('.sim-speed');
        if (pb){
          pb.onclick = function(){
            inst.playing = !inst.playing;
            pb.textContent = inst.playing ? '⏸ 暂停' : '▶ 播放';
            pb.classList.toggle('active', inst.playing);
          };
        }
        if (rb){
          rb.onclick = function(){
            inst.t = 0;
            if (inst.sim.reset) inst.sim.reset(inst);
          };
        }
        if (sp){
          sp.oninput = function(){
            inst.speed = parseFloat(sp.value);
            var v = box.querySelector('.sim-speed-val');
            if (v) v.textContent = inst.speed.toFixed(1) + 'x';
          };
        }
      }
    });
    if (!this.running){
      this.running = true;
      this.lastTime = performance.now();
      this.loop();
    }
  },
  stopAll: function(){
    this.running = false;
    this.active = {};
    if (this.raf){ cancelAnimationFrame(this.raf); this.raf = null; }
  },
  loop: function(){
    if (!this.running) return;
    var now = performance.now();
    var dt = Math.min((now - this.lastTime) / 1000, 0.1);
    this.lastTime = now;
    var self = this;
    Object.keys(this.active).forEach(function(k){
      var inst = self.active[k];
      if (!inst || !inst.playing) return;
      inst.t += dt * inst.speed;
      try {
        inst.sim.draw(inst.ctx, inst.w, inst.h, inst.t, inst);
      } catch(err){ console.error('sim draw error', k, err); }
    });
    this.raf = requestAnimationFrame(function(){ self.loop(); });
  }
};

SimEngine.sims.solar = {
  height: 220,
  planets: [
    {n:'水星',a:32,peri:8,c:'#B8C2DC',r:2.5},
    {n:'金星',a:48,peri:12,c:'#FFB84D',r:3.5},
    {n:'地球',a:66,peri:16,c:'#4FA8FF',r:3.8},
    {n:'火星',a:86,peri:20,c:'#FF5B5B',r:3},
    {n:'木星',a:110,peri:26,c:'#E08A1E',r:6},
    {n:'土星',a:134,peri:32,c:'#FFD84D',r:5.2},
    {n:'天王星',a:156,peri:38,c:'#A78BFA',r:4},
    {n:'海王星',a:176,peri:44,c:'#2F7BFF',r:3.8}
  ],
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    // 星空
    for (var i = 0; i < 40; i++){
      var sx = (i * 73) % w, sy = (i * 41) % h;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + (i % 3) * 0.15) + ')';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var cx = w / 2, cy = h / 2;
    var maxR = Math.min(w / 2 - 12, h / 2 - 12) / 180;
    // 轨道
    this.planets.forEach(function(p){
      ctx.beginPath();
      ctx.ellipse(cx, cy, p.a * maxR, p.peri * maxR * 0.42, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(79,168,255,0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
    // 太阳
    var sunR = 12;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 2.6);
    grad.addColorStop(0, 'rgba(255,245,180,1)');
    grad.addColorStop(0.4, 'rgba(255,216,77,0.8)');
    grad.addColorStop(1, 'rgba(224,138,30,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, sunR * 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD84D';
    ctx.beginPath();
    ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
    ctx.fill();
    // 行星
    this.planets.forEach(function(p, i){
      var speed = 1.2 / Math.pow(i + 1, 0.65);
      var angle = t * speed + i * 0.7;
      var x = cx + Math.cos(angle) * p.a * maxR;
      var y = cy + Math.sin(angle) * p.peri * maxR * 0.42;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(x, y, p.r, 0, Math.PI * 2);
      ctx.fill();
      // 地球加一点光晕
      if (p.n === '地球'){
        ctx.strokeStyle = 'rgba(79,168,255,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, p.r + 2.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      // 标签
      if (w > 380){
        ctx.fillStyle = 'rgba(184,194,220,0.85)';
        ctx.font = '9px sans-serif';
        ctx.fillText(p.n, x + p.r + 2, y + 3);
      }
    });
    // 标题
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('太阳系八大行星轨道（按真实相对周期运动）', w / 2, h - 6);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.moonPhase = {
  height: 230,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 30; i++){
      var sx = (i * 97) % w, sy = (i * 53) % h;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var phase = (t * 0.15) % 1; // 0-1
    var cx = w / 2, cy = h / 2 + 5;
    var r = Math.min(w, h) / 4.5;
    // 月球本体（暗面）
    ctx.fillStyle = '#1a2340';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    // 计算亮面
    // phase=0 新月; 0.25 上弦; 0.5 满月; 0.75 下弦
    var angle = phase * Math.PI * 2;
    var k = Math.cos(angle); // -1到1
    // 亮面路径：用椭圆模拟
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    // 亮部
    ctx.fillStyle = '#E8ECF7';
    if (phase < 0.5){
      // 新月到满月：右侧亮
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.arc(cx, cy, r * Math.abs(k), 0, Math.PI * 2, k > 0 ? true : false);
      ctx.fill('evenodd');
    } else {
      // 满月到下弦：左侧亮
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.arc(cx, cy, r * Math.abs(k), 0, Math.PI * 2, k > 0 ? false : true);
      ctx.fill('evenodd');
    }
    ctx.restore();
    // 环形山
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = 'rgba(120,130,160,0.35)';
    [[-0.3,-0.2,0.15],[0.25,0.1,0.12],[-0.1,0.35,0.08],[0.1,-0.4,0.1]].forEach(function(cr){
      ctx.beginPath();
      ctx.arc(cx + cr[0] * r, cy + cr[1] * r, cr[2] * r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
    // 描边
    ctx.strokeStyle = 'rgba(79,168,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // 名称与日期
    var day = Math.round(phase * 29.5) + 1;
    var names = ['新月（朔）','蛾眉月','上弦月','盈凸月','满月（望）','亏凸月','下弦月','残月'];
    var idx = Math.floor(phase * 8) % 8;
    ctx.fillStyle = '#4FA8FF';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(names[idx], cx, cy + r + 30);
    ctx.fillStyle = '#8A93B8';
    ctx.font = '11px sans-serif';
    ctx.fillText('农历约 ' + day + ' 日', cx, cy + r + 48);
    ctx.textAlign = 'left';

    // 上方时间条
    var barW = w - 40;
    var barX = 20;
    var barY = 18;

SimEngine.sims.eclipse = {
  height: 200,
  draw: function(ctx, w, h, t){

    for (var i = 0; i < 30; i++){

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    // 太阳（左）
    var sunX = 60, sunY = h / 2, sunR = 32;
    var sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 1.4);
    sg.addColorStop(0, '#FFF5B0');
    sg.addColorStop(0.5, '#FFD84D');
    sg.addColorStop(1, 'rgba(224,138,30,0.5)');
    ctx.fillStyle = sg;
    ctx.beginPath();

    ctx.arc(earthX - 5, earthY - 3, 8, 0, Math.PI * 2);
    ctx.fill();
    // 月球（从右往左运动）
    var progress = (t * 0.2) % 1;
    var moonX = earthX - 40 - (earthX - 40 - (sunX + sunR + 8)) * progress;
    var moonY = sunY;
    var moonR = 8;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.moveTo(moonX, moonY - moonR);
    ctx.lineTo(moonX + (earthX - moonX) * 0.7, earthY - moonR * 1.5);

    ctx.lineTo(moonX, moonY + moonR);

    ctx.fill();

    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);

    ctx.fillText('地球', earthX, earthY + earthR + 16);
    ctx.textAlign = 'left';
    // 状态文字

};

SimEngine.sims.evolution = {
  height: 220,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 35; i++){
      var sx = (i * 67) % w, sy = (i * 43) % h;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var cy = h / 2 + 10;
    var stages = [
      {n:'分子云', c:'#4FA8FF', r:24, alpha:0.35},
      {n:'主序星', c:'#FFD84D', r:18, alpha:0.95},
      {n:'红巨星', c:'#FF5B5B', r:34, alpha:0.7},
      {n:'行星状星云', c:'#A78BFA', r:38, alpha:0.35},
      {n:'白矮星', c:'#E8ECF7', r:6, alpha:0.95}
    ];
    var total = stages.length;
    var p = (t * 0.16) % total;
    var idx = Math.floor(p);
    var frac = p - idx;

    // 时间轴
    var axisY = h - 22;
    ctx.strokeStyle = 'rgba(79,168,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, axisY);
    ctx.lineTo(w - 30, axisY);
    ctx.stroke();
    var step = (w - 60) / (total - 1);
    stages.forEach(function(s, i){
      var x = 30 + step * i;
      ctx.fillStyle = i <= idx ? '#4FA8FF' : '#3A4A78';
      ctx.beginPath();
      ctx.arc(x, axisY, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = i <= idx ? '#B8C2DC' : '#5C6688';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.n, x, axisY + 14);
    });
    ctx.textAlign = 'left';

    // 中心显示当前和过渡的恒星
    var cx = w / 2;
    var s1 = stages[idx];
    var s2 = stages[(idx + 1) % total];
    // 光晕
    var r1 = s1.r;
    var r2 = s2.r;
    var r = r1 + (r2 - r1) * frac;
    var a1 = s1.alpha;
    var a2 = s2.alpha;
    var a = a1 + (a2 - a1) * frac;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.2);
    grad.addColorStop(0, s1.c);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = s1.c;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // 中心标注
    ctx.fillStyle = 'rgba(232,236,247,0.9)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s1.n, cx, cy - r - 12);
    ctx.textAlign = 'left';

    // 标题
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('小质量恒星演化路径（循环演示）', w / 2, 16);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.telescope = {
  height: 200,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 25; i++){
      var sx = (i * 91) % w, sy = (i * 57) % h;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var cy = h / 2;
    // 望远镜镜筒
    ctx.fillStyle = 'rgba(42,58,102,0.9)';
    ctx.fillRect(80, cy - 14, w - 200, 28);
    ctx.strokeStyle = 'rgba(79,168,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(80, cy - 14, w - 200, 28);
    // 物镜（凸透镜）
    ctx.fillStyle = '#4FA8FF';
    ctx.beginPath();
    ctx.ellipse(90, cy, 6, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    // 目镜
    ctx.fillStyle = '#FFB84D';
    ctx.beginPath();
    ctx.ellipse(w - 120, cy, 5, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // 探测屏
    ctx.fillStyle = 'rgba(46,212,122,0.2)';
    ctx.fillRect(w - 90, cy - 30, 60, 60);
    ctx.strokeStyle = 'rgba(46,212,122,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(w - 90, cy - 30, 60, 60);

    // 光线追踪
    var rays = 5;
    for (var k = 0; k < rays; k++){
      var offset = (k - (rays - 1) / 2) * 6;
      ctx.strokeStyle = 'rgba(255,216,77,0.7)';
      ctx.lineWidth = 1;
      // 平行光入射到物镜
      ctx.beginPath();
      ctx.moveTo(20, cy + offset);
      ctx.lineTo(90, cy + offset);
      ctx.stroke();
      // 物镜折射到焦点
      var focusX = w - 150;
      var focusY = cy;
      ctx.beginPath();
      ctx.moveTo(90, cy + offset);
      ctx.lineTo(focusX, focusY + offset * 0.1);
      ctx.stroke();
      // 焦点到目镜
      ctx.beginPath();
      ctx.moveTo(focusX, focusY + offset * 0.1);
      ctx.lineTo(w - 120, cy + offset * 0.3);
      ctx.stroke();
      // 目镜到屏
      ctx.beginPath();
      ctx.moveTo(w - 120, cy + offset * 0.3);
      ctx.lineTo(w - 80, cy + offset * 1.5);
      ctx.stroke();
    }
    // 焦点闪烁
    var flash = 0.4 + 0.6 * Math.abs(Math.sin(t * 3));
    ctx.fillStyle = 'rgba(255,216,77,' + flash + ')';
    ctx.beginPath();
    ctx.arc(w - 150, cy, 3, 0, Math.PI * 2);
    ctx.fill();

    var imgSize = 6 + 2 * Math.sin(t * 2);
    ctx.beginPath();
    ctx.ellipse(w - 60, cy, imgSize, imgSize * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 标注
    ctx.fillStyle = '#8A93B8';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('平行光', 40, cy - 30);
    ctx.fillStyle = '#4FA8FF';
    ctx.fillText('物镜', 90, cy + 34);
    ctx.fillStyle = '#FFB84D';
    ctx.fillText('目镜', w - 120, cy + 30);
    ctx.fillStyle = '#2ED47A';
    ctx.fillText('成像', w - 60, cy + 40);
    ctx.textAlign = 'left';

    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('折射式望远镜光路（光线追踪）', w / 2, h - 6);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.galaxy = {

SimEngine.sims.earth = {
  height: 240,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 40; i++){
      var sx = (i * 83) % w, sy = (i * 47) % h;
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var cx = w / 2, cy = h / 2 + 5;
    // 公转轨道
    var orbitR = Math.min(w / 2 - 30, h / 2 - 30);
    ctx.strokeStyle = 'rgba(79,168,255,0.25)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, orbitR, orbitR * 0.55, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 太阳
    var sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 24);
    sg.addColorStop(0, '#FFF5B0');
    sg.addColorStop(0.6, '#FFD84D');
    sg.addColorStop(1, 'rgba(224,138,30,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI * 2);
    ctx.fill();
    // 地球
    var angle = t * 0.25;
    var ex = cx + Math.cos(angle) * orbitR;
    var ey = cy + Math.sin(angle) * orbitR * 0.55;
    // 地球本体
    ctx.fillStyle = '#2F7BFF';
    ctx.beginPath();
    ctx.arc(ex, ey, 12, 0, Math.PI * 2);
    ctx.fill();
    // 大陆
    ctx.fillStyle = 'rgba(46,212,122,0.75)';
    ctx.beginPath();
    ctx.ellipse(ex - 3, ey - 2, 5, 4, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex + 3, ey + 3, 4, 3, -0.2, 0, Math.PI * 2);
    ctx.fill();
    // 地轴（倾斜约23.5°）
    var tilt = -23.5 * Math.PI / 180;
    var axisLen = 18;
    ctx.strokeStyle = 'rgba(255,216,77,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ex - Math.sin(tilt) * axisLen, ey - Math.cos(tilt) * axisLen);
    ctx.lineTo(ex + Math.sin(tilt) * axisLen, ey + Math.cos(tilt) * axisLen);
    ctx.stroke();
    // 昼夜分界（简化：朝向太阳的一侧亮）
    ctx.save();
    ctx.beginPath();
    ctx.arc(ex, ey, 12, 0, Math.PI * 2);
    ctx.clip();
    var sunAngle = Math.atan2(cy - ey, cx - ex);
    var lg = ctx.createLinearGradient(ex - Math.cos(sunAngle) * 12, ey - Math.sin(sunAngle) * 12, ex + Math.cos(sunAngle) * 12, ey + Math.sin(sunAngle) * 12);
    lg.addColorStop(0, 'rgba(0,0,0,0)');
    lg.addColorStop(0.5, 'rgba(0,0,0,0.3)');
    lg.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = lg;
    ctx.fillRect(ex - 12, ey - 12, 24, 24);
    ctx.restore();

    // 四季标注
    var labels = ['春分','夏至','秋分','冬至'];
    for (var k = 0; k < 4; k++){
      var a = k * Math.PI / 2;
      var lx = cx + Math.cos(a) * (orbitR + 14);
      var ly = cy + Math.sin(a) * (orbitR + 14) * 0.55 + 4;
      ctx.fillStyle = 'rgba(138,147,184,0.7)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(labels[k], lx, ly);
    }
    ctx.textAlign = 'left';
    // 标题
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('地球公转与四季（地轴倾斜约23.5°）', w / 2, h - 6);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.spectrum = {

      {n:'A',c:'#FFFFFF',temp:'7500-10000K'},
      {n:'F',c:'#FFE8B0',temp:'6000-7500K'},
      {n:'G',c:'#FFD84D',temp:'5200-6000K'},

      {n:'M',c:'#FF5B5B',temp:'<3700K'}
    ];
    var bw = (w - 40) / colors.length;
    var by = h / 2 - 40;
    var bh = 60;

      var x = 20 + i * bw;

SimEngine.sims.hr = {

    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + plotH);
    ctx.lineTo(pad.l + plotW, pad.t + plotH);

    ctx.rotate(-Math.PI / 2);

    ctx.stroke();

    var py = pad.t + 15 + 0.55 * (plotH - 55);

    ctx.fillStyle = 'rgba(255,216,77,' + flash + ')';
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFD84D';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#FFD84D';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('太阳', px + 14, py + 3);
    // 巨星区域

SimEngine.sims.starMap = {
  height: 220,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 60; i++){
      var sx = (i * 67) % w, sy = (i * 43) % h;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + (i % 5) * 0.1) + ')';
      ctx.fillRect(sx, sy, 1, 1);
    }
    // 北斗七星
    var beidou = [
      {x:0.15,y:0.65},{x:0.28,y:0.55},{x:0.4,y:0.45},
      {x:0.55,y:0.4},{x:0.7,y:0.35},{x:0.82,y:0.5},{x:0.68,y:0.62}
    ];
    // 连线
    ctx.strokeStyle = 'rgba(79,168,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    beidou.forEach(function(p, i){
      var x = p.x * w, y = p.y * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 星点
    var flash = 0.7 + 0.3 * Math.sin(t * 2);
    beidou.forEach(function(p, i){
      var x = p.x * w, y = p.y * h;
      ctx.fillStyle = 'rgba(255,255,255,' + (i === 0 ? flash : 1) + ')';
      ctx.beginPath();
      ctx.arc(x, y, i === 0 ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
    });
    // 勺头两星延长线
    var x1 = beidou[0].x * w, y1 = beidou[0].y * h;
    var x2 = beidou[1].x * w, y2 = beidou[1].y * h;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len;
    // 延长线
    ctx.strokeStyle = 'rgba(255,216,77,0.6)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + ux * w * 0.6, y1 + uy * w * 0.35);
    ctx.stroke();
    ctx.setLineDash([]);
    // 北极星
    var px = x1 + ux * w * 0.55;
    var py = y1 + uy * w * 0.32;
    if (px > 0 && px < w && py > 0 && py < h){
      var pulse = 0.6 + 0.4 * Math.abs(Math.sin(t * 1.5));
      ctx.fillStyle = 'rgba(255,216,77,' + pulse + ')';
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFD84D';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText('北极星', px + 10, py + 4);
    }
    // 标注
    ctx.fillStyle = '#8A93B8';
    ctx.font = '10px sans-serif';
    ctx.fillText('北斗七星', beidou[0].x * w - 20, beidou[0].y * h + 16);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.fillText('北斗七星勺头延长5倍可找到北极星', w / 2, h - 8);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.meteor = {
  height: 220,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 70; i++){

      ctx.fillRect(sx, sy, 1, 1);
    }
    // 多颗流星
    var meteors = [
      {x0: 0.1, y0: 0.2, len: 0.15, sp: 0.6, delay: 0},
      {x0: 0.5, y0: 0.1, len: 0.2, sp: 0.45, delay: 1.5},
      {x0: 0.8, y0: 0.25, len: 0.12, sp: 0.7, delay: 0.7},
      {x0: 0.3, y0: 0.15, len: 0.18, sp: 0.5, delay: 2.3}
    ];
    meteors.forEach(function(m, i){
      var p = ((t * m.sp + m.delay) % 3) / 3;
      if (p > 0.7) return;
      var x = m.x0 * w + p * w * 0.6;
      var y = m.y0 * h + p * h * 0.4;
      var x2 = x - m.len * w;
      var y2 = y - m.len * h * 0.6;
      var g = ctx.createLinearGradient(x, y, x2, y2);
      g.addColorStop(0, 'rgba(255,216,77,0.9)');
      g.addColorStop(0.5, 'rgba(255,184,77,0.5)');
      g.addColorStop(1, 'rgba(255,91,91,0)');

      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);

      var flash = 0.6 + 0.4 * Math.sin(t * 8 + i);
      ctx.fillStyle = 'rgba(255,255,255,' + flash + ')';

      ctx.arc(x, y, 2.5, 0, Math.PI * 2);

SimEngine.sims.sunStruct = {
  height: 220,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    var cx = w / 2, cy = h / 2;
    var maxR = Math.min(w, h) / 2 - 20;
    // 层：日冕、色球、光球、对流区、辐射区、核心
    var layers = [
      {r: maxR, c1: 'rgba(167,139,250,0.15)', c2: 'rgba(167,139,250,0.35)', n:'日冕'},
      {r: maxR * 0.82, c1: 'rgba(79,168,255,0.2)', c2: 'rgba(79,168,255,0.4)', n:'色球'},
      {r: maxR * 0.65, c1: 'rgba(255,216,77,0.5)', c2: 'rgba(255,184,77,0.7)', n:'光球'},
      {r: maxR * 0.45, c1: 'rgba(255,184,77,0.6)', c2: 'rgba(224,138,30,0.8)', n:'对流层'},
      {r: maxR * 0.25, c1: 'rgba(255,216,77,0.8)', c2: 'rgba(255,245,180,0.95)', n:'辐射层'},
      {r: maxR * 0.1, c1: '#FFF5B0', c2: '#FFFFFF', n:'核心'}
    ];
    // 脉动效果
    var pulse = 1 + 0.03 * Math.sin(t * 2);
    layers.forEach(function(L, i){
      var r = L.r * pulse;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, L.c1);
      g.addColorStop(1, L.c2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    });
    // 黑子（动态移动）
    ctx.fillStyle = 'rgba(11,16,38,0.7)';
    for (var i = 0; i < 3; i++){
      var a = t * 0.4 + i * 2.1;
      var sx = cx + Math.cos(a) * maxR * 0.55;
      var sy = cy + Math.sin(a) * maxR * 0.55;
      ctx.beginPath();
      ctx.arc(sx, sy, 4 + i * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // 日珥（顶部）
    var prom = 6 + 3 * Math.sin(t * 1.5);
    ctx.fillStyle = 'rgba(255,91,91,0.7)';
    ctx.beginPath();
    ctx.arc(cx, cy - maxR * 0.75, prom, 0, Math.PI * 2);
    ctx.fill();
    // 层标签
    ctx.fillStyle = '#8A93B8';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    layers.forEach(function(L, i){
      var y = cy - L.r * pulse + 8;
      if (y > 12 && y < h - 10){
        ctx.fillStyle = 'rgba(232,236,247,0.85)';
        ctx.font = '9px sans-serif';
        ctx.fillText(L.n, cx, y + (i === 5 ? 3 : 0));
      }
    });
    ctx.textAlign = 'left';
    // 标题
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('太阳分层结构（黑子与日珥动态）', w / 2, h - 6);
    ctx.textAlign = 'left';
  }
};

SimEngine.sims.blackhole = {
  height: 220,
  draw: function(ctx, w, h, t){
    ctx.fillStyle = '#06091a';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 50; i++){
      var sx = (i * 67) % w, sy = (i * 47) % h;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + (i % 4) * 0.08) + ')';
      ctx.fillRect(sx, sy, 1, 1);
    }
    var cx = w / 2, cy = h / 2;
    var bhR = 26;
    // 吸积盘（椭圆旋转）
    for (var k = 0; k < 3; k++){
      var rr = bhR + 14 + k * 16;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * (0.6 - k * 0.15) + k * 0.6);
      var g = ctx.createLinearGradient(-rr, 0, rr, 0);
      g.addColorStop(0, 'rgba(255,184,77,0)');
      g.addColorStop(0.3, 'rgba(255,184,77,0.7)');
      g.addColorStop(0.5, 'rgba(255,216,77,0.95)');
      g.addColorStop(0.7, 'rgba(255,184,77,0.7)');
      g.addColorStop(1, 'rgba(255,184,77,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 4 - k;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * 0.35, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // 事件视界
    var bhG = ctx.createRadialGradient(cx, cy, 0, cx, cy, bhR);
    bhG.addColorStop(0, '#000');
    bhG.addColorStop(0.85, '#000');
    bhG.addColorStop(1, 'rgba(255,216,77,0.9)');
    ctx.fillStyle = bhG;
    ctx.beginPath();
    ctx.arc(cx, cy, bhR, 0, Math.PI * 2);
    ctx.fill();
    // 光子环
    var pulse = 0.5 + 0.5 * Math.abs(Math.sin(t * 1.5));
    ctx.strokeStyle = 'rgba(255,216,77,' + pulse + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, bhR + 2, 0, Math.PI * 2);
    ctx.stroke();
    // 落入物质
    for (var i = 0; i < 8; i++){
      var a = t * 0.8 + i * Math.PI / 4;
      var rr2 = 60 - (t * 20 + i * 6) % 50;
      if (rr2 < bhR + 4) continue;
      var px = cx + Math.cos(a) * rr2;
      var py = cy + Math.sin(a) * rr2 * 0.4;
      ctx.fillStyle = 'rgba(255,245,180,' + (rr2 / 80) + ')';
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // 标题
    ctx.fillStyle = 'rgba(138,147,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('黑洞与吸积盘（事件视界 + 光子环）', w / 2, h - 8);
    ctx.textAlign = 'left';
  }
};

function simHTML(id, title, hint){

    '<div class="sim-head"><span class="sim-tag"> ' + title + '</span><span class="sim-info">动态模拟</span></div>' +
    '<canvas class="sim-canvas" data-sim="' + id + '" id="sim_' + id + '_' + Math.random().toString(36).slice(2, 7) + '"></canvas>' +
    '<div class="sim-ctrl">' +
    '<button class="sim-play active">⏸ 暂停</button>' +
    '<button class="sim-reset">↺ 重置</button>' +

    '</div>' +
    (hint ? '<div class="sim-hint">' + hint + '</div>' : '') +
    '</div>';
}

/* ======================================================
   读报器（Web Speech API）
   ====================================================== */
var Reader = {
  synth: window.speechSynthesis,
  utterance: null,
  sentences: [],
  idx: 0,
  playing: false,
  speed: 1,
  current: null,
  voices: [],
  init: function(){
    var self = this;
    if (!this.synth){
      console.warn('浏览器不支持语音合成');
      return;
    }
    var loadVoices = function(){
      self.voices = self.synth.getVoices();
    };
    loadVoices();
    if (this.synth.onvoiceschanged !== undefined){
      this.synth.onvoiceschanged = loadVoices;
    }
  },
  getVoice: function(){
    // 优先中文语音
    for (var i = 0; i < this.voices.length; i++){
      if (this.voices[i].lang && this.voices[i].lang.indexOf('zh') === 0) return this.voices[i];
    }
    return this.voices[0] || null;
  },
  read: function(news){
    this.stop();
    if (!this.synth){ alert('当前浏览器不支持语音朗读，请用 Chrome / Edge / Safari 打开'); return; }
    this.current = news;
    this.sentences = [];
    // 按句号、问号、叹号分割
    var parts = news.body.split(/(?<=[。！？\n])/g).filter(function(s){ return s.trim(); });
    // 长句再按逗号分
    var self = this;
    parts.forEach(function(p){
      if (p.length > 60){
        p.split(/(?<=[，；：])/g).forEach(function(s){ if (s.trim()) self.sentences.push(s.trim()); });
      } else {
        self.sentences.push(p.trim());
      }
    });
    if (!this.sentences.length){ alert('无法解析文本'); return; }
    this.idx = 0;
    this.playing = true;
    this.updatePanel(news, '', 0);
    this.speakNext();
  },
  speakNext: function(){
    var self = this;
    if (!this.playing || this.idx >= this.sentences.length){
      this.playing = false;
      this.updatePlayBtn();
      if (this.idx >= this.sentences.length){
        $('#readerStatus').textContent = '朗读完毕';
      }
      return;
    }
    var text = this.sentences[this.idx];
    var u = new SpeechSynthesisUtterance(text);
    var v = this.getVoice();
    if (v) u.voice = v;
    u.lang = 'zh-CN';
    u.rate = this.speed;
    u.pitch = 1;
    u.onboundary = function(e){
      // 词/字级别高亮：这里简化为当前句整体高亮
    };
    u.onend = function(){
      if (!self.playing) return;
      self.idx++;
      self.speakNext();
    };
    u.onerror = function(){
      if (!self.playing) return;
      self.idx++;
      self.speakNext();
    };
    this.utterance = u;
    // 更新面板高亮
    this.highlightCurrent();
    this.synth.speak(u);
  },
  highlightCurrent: function(){
    var container = $('#readerText');
    if (!container || !this.current) return;
    var html = '';
    this.sentences.forEach(function(s, i){
      var cls = i === this.idx ? 'hl' : '';
      html += '<span class="' + cls + '" data-i="' + i + '">' + esc(s) + '</span>';
    }, this);
    container.innerHTML = html;
    $('#readerStatus').textContent = (this.idx + 1) + ' / ' + this.sentences.length + ' 句';
    // 滚动到高亮
    var el = container.querySelector('.hl');
    if (el) el.scrollIntoView({ block: 'nearest' });
  },
  updatePanel: function(news, status, idx){
    var panel = $('#readerPanel');
    if (!panel) return;
    $('#readerTitle').textContent = news.title;
    var container = $('#readerText');
    var html = '';
    this.sentences.forEach(function(s, i){
      html += '<span class="' + (i === idx ? 'hl' : '') + '">' + esc(s) + '</span>';
    });
    container.innerHTML = html;
    panel.classList.add('show');
    this.updatePlayBtn();
  },
  updatePlayBtn: function(){
    var btn = $('#readerPlay');
    if (!btn) return;
    if (this.playing){
      btn.textContent = '⏸ 暂停';
      btn.classList.add('playing');
    } else {
      btn.textContent = '▶ 播放';
      btn.classList.remove('playing');
    }
    // 更新卡片状态
    document.querySelectorAll('.news-card').forEach(function(c){
      c.classList.toggle('active', Reader.current && c.dataset.id === Reader.current.id);
    });
  },
  toggle: function(){
    if (!this.current){ alert('请先选择一条天文资讯'); return; }
    if (this.playing){
      this.playing = false;
      this.synth.cancel();
      this.updatePlayBtn();
      $('#readerStatus').textContent = '已暂停（' + (this.idx + 1) + '/' + this.sentences.length + '）';
    } else {
      if (this.idx >= this.sentences.length) this.idx = 0;
      this.playing = true;
      this.updatePlayBtn();
      this.speakNext();
    }
  },
  stop: function(){
    if (this.synth) this.synth.cancel();
    this.playing = false;
    this.idx = 0;
    this.updatePlayBtn();
    $('#readerPanel').classList.remove('show');
    document.querySelectorAll('.news-card').forEach(function(c){ c.classList.remove('active'); });
  },
  setSpeed: function(v){
    this.speed = parseFloat(v);
    $('#readerSpeedVal').textContent = this.speed.toFixed(1) + 'x';
    if (this.playing){
      // 重启当前句以应用新语速
      this.synth.cancel();
      this.speakNext();
    }
  }
};
Reader.init();

/* ======================================================
   题型工具
   ====================================================== */
function isCorrect(q, ua){
  if (ua === undefined || ua === null) return false;
  if (q.type === 'single' || q.type === 'judge' || q.type === 'image') return ua === q.answer;
  if (q.type === 'multi'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    var a = ua.slice().sort(function(x,y){return x-y;});
    var b = q.answer.slice().sort(function(x,y){return x-y;});
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  if (q.type === 'fill'){
    var u = norm(ua);
    if (!u) return false;
    for (var j = 0; j < q.answer.length; j++) if (norm(q.answer[j]) === u) return true;
    return false;
  }
  if (q.type === 'order'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    for (var k = 0; k < q.answer.length; k++) if (ua[k] !== q.answer[k]) return false;
    return true;
  }
  return false;
}
function isAnswered(q, ua){
  if (q.type === 'multi' || q.type === 'order') return Array.isArray(ua) && ua.length > 0;
  if (q.type === 'fill') return String(ua == null ? '' : ua).trim() !== '';
  return ua !== undefined && ua !== null && ua !== -1;
}
function answerText(q){
  if (q.type === 'single' || q.type === 'image') return LETTERS[q.answer];
  if (q.type === 'judge') return q.answer === 0 ? '正确' : '错误';
  if (q.type === 'multi') return q.answer.map(function(i){return LETTERS[i];}).join('、');
  if (q.type === 'fill') return q.answer[0];
  if (q.type === 'order') return q.answer.map(function(i){return q.options[i];}).join(' → ');
  return '';
}
function typeLabel(t){return {single:'单选',multi:'多选',judge:'判断',fill:'填空',order:'排序',image:'图片'}[t]||'题目';}
function typeBadge(t){return {single:'blue',multi:'purple',judge:'green',fill:'amber',order:'purple',image:'blue'}[t]||'';}

/* ======================================================
   数据查询
   ====================================================== */
function getQuestions(level, category){
  return Q.filter(function(q){return (!level||q.level===level)&&(!category||q.category===category);});
}
function getCategories(level){
  var s = {};
  Q.forEach(function(q){if(q.level===level)s[q.category]=1;});
  return Object.keys(s);
}
function getKnowledge(level, category){
  for (var i = 0; i < KNOWLEDGE.length; i++){
    if (KNOWLEDGE[i].level===level && KNOWLEDGE[i].category===category) return KNOWLEDGE[i];
  }
  return null;
}
function getDaily(level){
  var p = getQuestions(level);
  if (!p.length) return null;
  var d = Math.floor(Date.now()/86400000);
  return p[d % p.length];
}
function getMastery(level, category){
  var qs = getQuestions(level, category);
  var st = Store.getQStats();
  var t=0,c=0;
  qs.forEach(function(q){var s=st[q.id];if(s){t+=s.t;c+=s.c;}});
  var wid = Store.getWrong().map(function(w){return w.id;});
  var wc = qs.filter(function(q){return wid.indexOf(q.id)>=0;}).length;
  return {total:qs.length,answered:t,correct:c,rate:t?Math.round(c/t*100):0,wrongCount:wc};
}

  // 页面切换前停止模拟器和朗读

  state.page = p;

  render();

function render(){
  clearTimers();
  navTitle.textContent = TITLES[state.page] || '星赛通';
  if (TABS.indexOf(state.page) >= 0){
    backBtn.classList.add('hidden');
    tabbar.classList.remove('hidden');
    document.querySelectorAll('.tabbar button').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === state.page);
    });
  } else {
    backBtn.classList.remove('hidden');
    tabbar.classList.add('hidden');
  }
  var map = {
    home: renderHome, practice: renderPractice, exam: renderExam, result: renderResult,
    wrong: renderWrong, learn: renderLearn, learnDetail: renderLearnDetail,
    ai: renderAI, profile: renderProfile, news: renderNews
  };
  var fn = map[state.page] || renderHome;
  view.innerHTML = fn();
  if (state.page === 'exam' && state.exam && state.exam.running) startExamTimer();
  // 启动模拟器
  if (state.page === 'learnDetail') SimEngine.startAll();
}

/* ============ 练习 ============ */
function startPractice(level, category){
  var list = shuffle(getQuestions(level, category));
  if (!list.length){ alert('该知识点暂无题目'); return; }
  startWith(list, level, category || '综合练习');
}
function startWith(list, level, label){
  state.practice = {
    list: list, index: 0,
    userAnswers: new Array(list.length).fill(null),
    showAnswer: false, correct: 0, wrong: 0,
    level: level, label: label
  };
  go('practice');
}
function renderPractice(){
  var p = state.practice;
  if (!p) return '<div class="empty"><div class="ico"></div><div class="txt">数据丢失</div></div>';
  var q = p.list[p.index];
  var ua = p.userAnswers[p.index];
  var total = p.list.length;
  var answered = isAnswered(q, ua);
  var h = '<div class="topbar">' +
    '<div class="counter">第 ' + (p.index+1) + ' / ' + total + ' 题</div>' +
    '<div class="counter"><span class="ok">✓ ' + p.correct + '</span>　<span class="no">✗ ' + p.wrong + '</span></div></div>';
  h += '<div class="progress"><i style="width:' + rate(p.index,total) + '%;"></i></div>';
  h += '<div class="card"><div class="tags">' +
    '<span class="tag">' + esc(q.level) + '</span>' +
    '<span class="tag">' + esc(q.category) + '</span>' +
    '<span class="tag amber">' + typeLabel(q.type) + '</span></div>';
  if (q.type === 'image' && q.image && SVG[q.image]){
    h += '<div class="q-image">' + SVG[q.image] + '</div>';
  }
  h += '<div class="stem">' + esc(q.stem) + '</div>';
  h += renderInput(q, ua, p.showAnswer, 'pChoose');
  h += '</div>';
  if (p.showAnswer){
    var ok = isCorrect(q, ua);
    h += '<div class="explain"><div class="head ' + (ok?'ok':'no') + '">' +
      (ok?'✓ 回答正确':'✗ 回答错误') + '</div>' +
      '<div class="line">正确答案：' + esc(answerText(q)) + '</div>' +
      '<div class="line">' + esc(q.explanation) + '</div></div>';
  }
  h += '<div class="footer">';
  if (!p.showAnswer){
    h += '<button class="btn btn-main" ' + (!answered?'disabled':'') + ' onclick="pSubmit()">提交答案</button>';
  } else if (p.index < total - 1){
    h += '<button class="btn btn-main" onclick="pNext()">下一题</button>';
  } else {
    h += '<button class="btn btn-main" onclick="pFinish()">完成练习</button>';
  }
  h += '</div>';
  return h;
}
function renderInput(q, ua, show, fn){
  if (q.type === 'fill'){
    var v = esc(ua==null?'':ua);
    var h = '<input class="fill-input" id="fillInput" type="text" value="' + v + '" placeholder="请输入答案" ' +
      (show?'disabled':'') + ' oninput="onFill(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    if (show){
      var ok = isCorrect(q, ua);
      h += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你填写的是：<b style="color:' + (ok?'var(--green)':'var(--red)') + ';">' + esc(ua || '（空）') + '</b></div>';
    }
    return h;
  }
  if (q.type === 'order'){
    var arr = Array.isArray(ua)?ua:[];
    var h2 = '<div style="font-size:13px;color:var(--sub);margin-bottom:10px;">点击选项，按正确顺序依次排列</div>';
    q.options.forEach(function(t,i){
      var pos = arr.indexOf(i);
      var taken = pos >= 0;
      var cls = 'option order-item' + (taken?' taken':'');
      if (show){
        var isRight = q.answer.indexOf(i) === pos;
        cls += isRight ? ' right' : ' wrong';
      }
      h2 += '<div class="' + cls + '" onclick="' + fn + '(' + i + ')">' +
        (taken ? '<span class="order-num">' + (pos+1) + '</span>' : '<span class="opt-key">?</span>') +
        '<span class="opt-text">' + esc(t) + '</span></div>';
    });
    if (arr.length && !show){
      h2 += '<div style="margin-top:8px;font-size:12px;color:var(--sub);">已排：' + arr.map(function(i){return q.options[i];}).join(' → ') + '</div>';
    }
    if (show){
      h2 += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你的排序：' + (arr.length?arr.map(function(i){return q.options[i];}).join(' → '):'（空）') + '</div>';
    }
    return h2;
  }
  var isMulti = q.type === 'multi';
  var am = Array.isArray(ua)?ua:[];
  return q.options.map(function(t,i){
    var cls = 'option';
    var sel = isMulti ? am.indexOf(i) >= 0 : (ua === i);
    var right = isMulti ? q.answer.indexOf(i) >= 0 : (q.answer === i);
    if (show){
      if (right) cls += ' right';
      else if (sel) cls += ' wrong';
      else cls += ' dim';
    } else if (sel){
      cls += ' selected';
    }
    var key = q.type === 'judge' ? (i===0?'✓':'✗') : LETTERS[i];
    return '<div class="' + cls + '" onclick="' + fn + '(' + i + ')">' +
      '<span class="opt-key">' + key + '</span>' +
      '<span class="opt-text">' + esc(t) + '</span></div>';
  }).join('');
}
function onFill(v){
  var p = state.practice;
  if (!p) return;
  p.userAnswers[p.index] = v;
  var b = document.querySelector('.footer .btn-main');
  if (b && !p.showAnswer) b.disabled = !v.trim();
}
function pChoose(i){
  var p = state.practice;
  if (!p || p.showAnswer) return;
  var q = p.list[p.index];
  if (q.type === 'multi'){
    var arr = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var k = arr.indexOf(i);
    if (k >= 0) arr.splice(k,1); else arr.push(i);
    p.userAnswers[p.index] = arr;
    document.querySelectorAll('.option').forEach(function(n,j){
      n.className = 'option' + (arr.indexOf(j)>=0?' selected':'');
    });
    var b = document.querySelector('.footer .btn-main');
    if (b) b.disabled = arr.length === 0;
    return;
  }
  if (q.type === 'order'){
    var a2 = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var k2 = a2.indexOf(i);
    if (k2 >= 0) a2.splice(k2,1); else a2.push(i);
    p.userAnswers[p.index] = a2;
    render();
    return;
  }
  p.userAnswers[p.index] = i;
  document.querySelectorAll('.option').forEach(function(n,j){
    n.className = 'option' + (j===i?' selected':'');
  });
  var b2 = document.querySelector('.footer .btn-main');
  if (b2) b2.disabled = false;
}
function pSubmit(){
  var p = state.practice;
  if (!p) return;
  var q = p.list[p.index];
  var ua = p.userAnswers[p.index];
  if (!isAnswered(q, ua)) return;
  var ok = isCorrect(q, ua);
  if (ok) p.correct++; else { p.wrong++; Store.addWrong(q.id); }
  Store.bumpQStat(q.id, ok);
  p.showAnswer = true;
  render();
}
function pNext(){state.practice.index++;state.practice.showAnswer=false;render();}
function pFinish(){
  var p = state.practice;
  var total = p.list.length, correct = p.correct;
  Store.addRecord({mode:'practice',total:total,correct:correct});
  if (confirm('共 ' + total + ' 题\n答对 ' + correct + ' 题\n正确率 ' + rate(correct,total) + '%\n\n点击「确定」再来一组，点击「取消」返回')){
    var list = shuffle(p.list);
    state.practice = {
      list: list, index: 0,
      userAnswers: new Array(list.length).fill(null),
      showAnswer: false, correct: 0, wrong: 0,
      level: p.level, label: p.label
    };
    render();
  } else go('home');
}

  var list = shuffle(pool).slice(0, Math.min(EXAM_N, pool.length));
  state.exam = {

function startExamTimer(){
  var t = setInterval(function(){
    if (!state.exam || state.page !== 'exam'){clearInterval(t);return;}
    state.exam.remain--;
    if (state.exam.remain <= 0){
      state.exam.remain = 0; updateTimer();
      clearInterval(t); state.exam.running = false;
      alert('时间到，自动交卷！'); submitExam();
      return;
    }
    updateTimer();
  },1000);
  timers.push(t);
}
function updateTimer(){
  var el = document.getElementById('timerText');
  if (el && state.exam){
    el.textContent = fmtTime(state.exam.remain);
    el.style.color = state.exam.remain <= 60 ? 'var(--red)' : 'var(--blue)';
  }

function eChoose(i){
  var e = state.exam;
  if (!e) return;
  var q = e.list[e.index];
  if (q.type === 'multi'){
    var arr = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var k = arr.indexOf(i);
    if (k >= 0) arr.splice(k,1); else arr.push(i);
    e.answers[e.index] = arr;
    document.querySelectorAll('.option').forEach(function(n,j){
      n.className = 'option' + (arr.indexOf(j)>=0?' selected':'');
    });
  } else if (q.type === 'order'){
    var a2 = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var k2 = a2.indexOf(i);
    if (k2 >= 0) a2.splice(k2,1); else a2.push(i);
    e.answers[e.index] = a2;
    render(); return;
  } else {
    e.answers[e.index] = i;
    document.querySelectorAll('.option').forEach(function(n,j){
      n.className = 'option' + (j===i?' selected':'');
    });
  }
  var c = document.querySelector('.topbar .counter');
  if (c){
    var an = e.answers.filter(function(a,k){return isAnswered(e.list[k],a);}).length;
    c.textContent = '已答 ' + an + ' / ' + e.list.length;
  }
}
function ePrev(){if(state.exam.index>0){state.exam.index--;render();}}
function eNext(){if(state.exam.index<state.exam.list.length-1){state.exam.index++;render();}}
function eJump(i){state.exam.index=i;state.exam.showCard=false;render();}
function toggleCard(){state.exam.showCard=!state.exam.showCard;render();}
function eConfirm(){
  var e = state.exam;
  var un = e.list.filter(function(q,i){return !isAnswered(q,e.answers[i]);}).length;
  if (confirm(un>0?'还有 ' + un + ' 题未作答，确定交卷吗？':'确定交卷吗？')) submitExam();
}
function submitExam(){
  var e = state.exam;
  if (!e) return;
  clearTimers(); e.running = false;
  var score=0,right=0,wrong=0,blank=0;
  var det = [];
  e.list.forEach(function(q,i){
    var ua = e.answers[i];
    var ok = isCorrect(q,ua);
    var done = isAnswered(q,ua);
    if (!done) blank++;
    else if (ok){right++;score+=2;}
    else {wrong++;score-=1;Store.addWrong(q.id);}
    Store.bumpQStat(q.id, ok&&done);
    det.push({id:q.id,type:q.type,stem:q.stem,options:q.options||null,image:q.image||null,
      your:ua,correct:q.answer,explanation:q.explanation,isCorrect:ok,isBlank:!done});
  });
  var r = {
    level:e.list[0].level,total:e.list.length,
    score:score,fullScore:e.list.length*2,
    right:right,wrong:wrong,blank:blank,
    rate:rate(right,e.list.length),used:e.total-e.remain,details:det
  };
  Store.addRecord({mode:'exam',total:e.list.length,correct:right});
  state.result = r; state.exam = null; go('result');
}

function reAsk(level, category){
  var pool = getQuestions(level, category);
  if (!pool.length){alert('该知识点暂无题目');return;}
  var wid = Store.getWrong().map(function(w){return w.id;});
  var wrongOnes = pool.filter(function(q){return wid.indexOf(q.id)>=0;});
  var others = pool.filter(function(q){return wid.indexOf(q.id)<0;});
  var picked = shuffle(wrongOnes);
  if (picked.length < 5) picked = picked.concat(shuffle(others).slice(0, 5-picked.length));
  picked = shuffle(picked).slice(0, Math.min(6, pool.length));
  if (!confirm('针对「' + category + '」再提问\n\n本次共 ' + picked.length + ' 题\n（优先抽取你答错过的题目）\n\n点击「确定」开始练习')) return;
  startWith(picked, level, category + ' · 强化练习');
}

    '题库 ' + Q.length + ' 题（小学 ' + Q.filter(function(q){return q.level==='小学';}).length +
    ' · 初中 ' + Q.filter(function(q){return q.level==='初中';}).length + '）<br>' +
    '知识卡 ' + KNOWLEDGE.length + ' 张 · 动态模拟 ' + Object.keys(SimEngine.sims).length + ' 个 · 读报 ' + NEWS.length + ' 条</div>';
  return h;
}
function clearAI(){if(confirm('清除所有 AI 对话记录？')){Store.clearAI();state.aiMsgs=[];render();alert('已清除');}}
function clearAll(){if(confirm('所有数据都会被清空，不可恢复。确定吗？')){Store.clearAll();state.aiMsgs=[];render();alert('已清除');}}

/* ============ 事件 ============ */
backBtn.addEventListener('click', function(){
  if (state.page === 'result') return go('home');
  if (state.page === 'learnDetail') return go('learn');
  if (state.page === 'practice' || state.page === 'exam'){
    if (state.page === 'exam' && state.exam){
      if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
      clearTimers(); state.exam = null;
    }
    return go('home');
  }
  go('home');
});
tabbar.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  var t = b.dataset.tab;
  if (!t || t === state.page) return;
  if (state.page === 'exam' && state.exam){
    if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
    clearTimers(); state.exam = null;
  }
  go(t);
});
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  var isI = tag === 'input' || tag === 'textarea';
  if (state.page === 'practice'){
    var p = state.practice;
    if (!p) return;
    var q = p.list[p.index];
    if (!isI && !p.showAnswer && q.type !== 'fill'){
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length){pChoose(n-1);e.preventDefault();}
    }
    if (e.key === 'Enter'){
      if (!p.showAnswer && isAnswered(q, p.userAnswers[p.index])){pSubmit();e.preventDefault();}
      else if (p.showAnswer && p.index < p.list.length - 1){pNext();e.preventDefault();}
    }
  }
  if (state.page === 'exam'){
    var ex = state.exam;
    if (!ex) return;
    var q2 = ex.list[ex.index];
    if (!isI && q2.type !== 'fill'){
      var n2 = parseInt(e.key, 10);
      if (n2 >= 1 && n2 <= q2.options.length){eChoose(n2-1);e.preventDefault();}
    }
    if (!isI && e.key === 'ArrowLeft') ePrev();
    if (!isI && e.key === 'ArrowRight') eNext();
  }
});

/* ============ 启动 ============ */
try { render(); } catch(err){
  console.error(err);
  view.innerHTML = '<div class="card"><div class="title">加载出错了</div><div class="sub">' + esc(err.message) + '</div></div>';
}
</script>
