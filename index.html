<script>
/* ============ 全局错误保护 ============ */
window.addEventListener('error', function(e){
  console.error('[星赛通]', e.message);
  var v = document.getElementById('view');
  if (v && (!v.innerHTML || v.innerHTML.trim() === '')){
    v.innerHTML = '<div class="card"><div class="title">加载出错了</div><div class="sub">' + e.message + '</div></div>';
  }
});

/* ============ 动态星空 ============ */
(function(){
  var c = document.getElementById('starsBg'), x = c.getContext('2d');
  var stars = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    stars = [];
    var n = Math.floor(w * h / 6500);
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.7 + 0.2,
        da: (Math.random() - 0.5) * 0.015,
        vx: (Math.random() - 0.5) * 0.06, vy: (Math.random() - 0.5) * 0.06
      });
    }
  }
  function draw(){
    x.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.a += s.da;
      if (s.a < 0.1 || s.a > 0.95) s.da = -s.da;
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
      x.globalAlpha = s.a;
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      x.fillStyle = '#ffffff'; x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize', function(){ resize(); init(); });
})();

/* ============ 工具 ============ */
var $ = function(s){ return document.querySelector(s); };
var LETTERS = ['A','B','C','D','E','F'];
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function rate(a, b){ return b ? Math.round(a / b * 100) : 0; }
function fmtTime(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function norm(s){
  return String(s == null ? '' : s).trim().toLowerCase()
    .replace(/[\s，,。.、；;：:！!？?"'"'（）()]/g, '')
    .replace(/[°º]/g, '度').replace(/[′']/g, '分').replace(/[″"]/g, '秒');
}

/* ============ 存储 ============ */
var KEY = { wrong:'astro_w_v4', record:'astro_r_v4', days:'astro_d_v4', qstats:'astro_q_v4', ai:'astro_ai_v4' };
var Store = {
  getWrong:function(){ try { return JSON.parse(localStorage.getItem(KEY.wrong)) || []; } catch(e){ return []; } },
  addWrong:function(id){
    var l = this.getWrong(), i = -1;
    for (var k = 0; k < l.length; k++) if (l[k].id === id) { i = k; break; }
    if (i >= 0){ l[i].count += 1; l[i].lastTime = Date.now(); }
    else l.push({ id: id, count: 1, lastTime: Date.now() });
    localStorage.setItem(KEY.wrong, JSON.stringify(l));
  },
  removeWrong:function(id){
    localStorage.setItem(KEY.wrong, JSON.stringify(this.getWrong().filter(function(i){ return i.id !== id; })));
  },
  clearWrong:function(){ localStorage.removeItem(KEY.wrong); },
  getQStats:function(){ try { return JSON.parse(localStorage.getItem(KEY.qstats)) || {}; } catch(e){ return {}; } },
  bumpQStat:function(id, ok){
    var s = this.getQStats();
    if (!s[id]) s[id] = { t:0, c:0 };
    s[id].t += 1; if (ok) s[id].c += 1; s[id].last = Date.now();
    localStorage.setItem(KEY.qstats, JSON.stringify(s));
  },
  addRecord:function(r){
    var l = [];
    try { l = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    l.push(Object.assign({}, r, { time: Date.now() }));
    if (l.length > 500) l = l.slice(l.length - 500);
    localStorage.setItem(KEY.record, JSON.stringify(l));
    var d = [];
    try { d = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}
    var td = new Date().toDateString();
    if (d.indexOf(td) < 0){ d.push(td); localStorage.setItem(KEY.days, JSON.stringify(d)); }
  },
  getStats:function(){
    var recs = [], d = [];
    try { recs = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    try { d = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}
    var t = 0, c = 0;
    recs.forEach(function(r){ t += (r.total || 0); c += (r.correct || 0); });
    return { total: t, correct: c, rate: rate(c, t), sessions: recs.length, days: d.length, wrongCount: this.getWrong().length };
  },
  clearAll:function(){
    localStorage.removeItem(KEY.wrong);
    localStorage.removeItem(KEY.record);
    localStorage.removeItem(KEY.days);
    localStorage.removeItem(KEY.qstats);
  },
  getAI:function(){ try { return JSON.parse(localStorage.getItem(KEY.ai)) || []; } catch(e){ return []; } },
  saveAI:function(l){ if (l.length > 40) l = l.slice(l.length - 40); localStorage.setItem(KEY.ai, JSON.stringify(l)); },
  clearAI:function(){ localStorage.removeItem(KEY.ai); }
};

content:'【日食】太阳 → 月球 → 地球（月球在中间）\n· 发生在农历初一（朔）\n· 类型：日全食、日偏食、日环食\n\n【月食】太阳 → 地球 → 月球（地球在中间）\n· 发生在农历十五前后（望）\n· 类型：月全食、月偏食、半影月食\n· 没有"月环食"\n\n【为什么不是每月都有？】\n白道与黄道有约5°09′夹角，大多数月份月球从太阳上方或下方经过。'},
{id:'k_motion',level:'小学',category:'天体运动',icon:'🌍',title:'地球的运动',figure:'earth',
content:'【自转】\n· 绕地轴旋转，方向自西向东\n· 周期约24小时（太阳日）\n· 产生：昼夜交替、天体东升西落\n\n【公转】\n· 绕太阳运行，方向自西向东\n· 周期约365.2422天（回归年）\n· 产生：四季变化、昼夜长短变化\n\n【重要节气】\n· 春分（3月21日前后）：直射赤道，昼夜等长\n· 夏至（6月22日前后）：直射北回归线\n· 秋分（9月23日前后）：直射赤道\n· 冬至（12月22日前后）：直射南回归线'},
{id:'k_moon',level:'小学',category:'月球',icon:'🌕',title:'月球小档案',figure:'moonPhase',
content:'【基本数据】\n· 地球唯一的天然卫星\n· 平均距离约38.4万千米\n· 直径约3476千米\n· 表面重力约为地球的1/6\n\n【表面特征】\n· 没有大气层 → 昼夜温差极大（+120℃~-180℃）\n· 没有大气 → 没有声音、没有天气、天空漆黑\n· 环形山：陨石撞击形成\n· 月海：古代火山熔岩填充的平原\n\n【人类探月】\n· 1969年阿姆斯特朗首次登月\n· 中国嫦娥工程：绕、落、回三步走'},
{id:'k_galaxy',level:'小学',category:'星系',icon:'🌌',title:'银河系与宇宙',figure:'galaxy',
content:'【银河系】\n· 类型：棒旋星系\n· 直径：约10万光年\n· 恒星数量：约1000~4000亿颗\n· 太阳位置：距银心约2.6万光年\n\n【河外星系】\n· 仙女座星系（M31）：距我们约254万光年\n· 大麦哲伦云、小麦哲伦云：银河系伴星系\n\n【宇宙尺度】\n· 太阳系直径约0.001光年（含奥尔特云约2光年）\n· 本星系群直径约1000万光年\n· 可观测宇宙直径约930亿光年'},
{id:'k_tele',level:'小学',category:'望远镜',icon:'🔭',title:'天文望远镜入门',figure:'refractor',
content:'【核心作用】\n不是放大，而是"聚光"！\n口径越大 → 聚光能力越强 → 能看到越暗的天体\n\n【两种基本类型】\n· 折射式：用凸透镜作物镜\n　优点：成像清晰稳定\n　缺点：大口径难制造、有色差\n· 反射式：用凹面镜作物镜\n　优点：无色差、可做大口径\n　缺点：需定期校准光轴\n\n【放大倍率】\n放大倍率 = 物镜焦距 ÷ 目镜焦距\n有效倍率上限 ≈ 口径(mm) × 2\n\n【安全提示】观测太阳必须使用专用滤光片！'},
{id:'k_meteor',level:'小学',category:'流星',icon:'☄️',title:'流星与流星雨',figure:'eclipse',
content:'【流星】\n流星体（尘埃或小石块）高速进入地球大气层，\n与大气摩擦生热发光，形成流星。\n\n【火流星】特别明亮的流星\n【陨石】未烧尽落到地面的流星体残骸\n\n【流星雨】\n当地球穿过彗星轨道遗留的尘埃带时，\n大量流星体同时进入大气层，形成流星雨。\n\n【著名流星雨】\n· 英仙座流星雨（8月）\n· 双子座流星雨（12月）\n· 象限仪座流星雨（1月）'},
{id:'k_sun',level:'小学',category:'太阳',icon:'☀️',title:'太阳活动',figure:'sunStruct',
content:'【太阳黑子】\n· 太阳活动最基本的标志\n· 温度比周围低约1500℃，所以显得暗\n· 数量变化周期约11年\n\n【其他活动】\n· 耀斑：太阳大气突然释放巨大能量\n· 日珥：太阳边缘喷出的巨大气体\n· 太阳风：太阳向外吹出的带电粒子流\n\n【影响】\n· 极光（太阳风与地磁场作用）\n· 干扰无线电通信、卫星运行\n· 影响地球气候和电网'},
{id:'k_unit',level:'小学',category:'天文单位',icon:'📏',title:'天文距离单位',figure:'lightyear',
content:'【天文单位 AU】\n1 AU ≈ 1.496亿千米\n= 地球到太阳的平均距离\n用于太阳系内距离\n\n【光年 ly】\n1 光年 ≈ 9.46万亿千米\n= 光在真空中一年走过的距离\n用于恒星距离\n\n【秒差距 pc】\n1 秒差距 ≈ 3.26光年 ≈ 206265 AU\n天文学最常用的距离单位\n\n【对比】秒差距 > 光年 > 天文单位'},
{id:'k_history',level:'小学',category:'天文史',icon:'🚀',title:'航天与天文史',figure:'solar',
content:'【世界航天】\n· 1961年 加加林：第一位进入太空的人\n· 1969年 阿姆斯特朗：第一个踏上月球的人\n· 1971年 苏联礼炮1号：第一个空间站\n\n【中国航天】\n· 2003年 杨利伟乘神舟五号首次进入太空\n· 2008年 翟志刚完成中国首次太空行走\n· 2016年 FAST"中国天眼"落成（贵州平塘）\n· 2020年 嫦娥五号月球采样返回\n· 2021年 天问一号着陆火星\n· 2022年 中国空间站全面建成'},
{id:'k_j_coord',level:'初中',category:'天球坐标',icon:'🧭',title:'天球坐标系统',figure:'coord',
content:'【天球】以观测者为球心，任意长为半径的假想球面。\n\n【地平坐标】\n· 基圈：地平圈\n· 分量：方位角A + 地平高度h\n· 特点：随观测地点和时间变化\n\n【赤道坐标】\n· 基圈：天赤道\n· 分量：赤经α + 赤纬δ\n· 特点：与观测地点、时间无关\n\n【赤经 α】自春分点起算，沿天赤道向东度量，单位时、分、秒，1h=15°\n\n【赤纬 δ】自天赤道起算，向北为正（0°~+90°），向南为负（0°~-90°）\n\n【北天极的地平高度】= 观测者地理纬度。'},
{id:'k_j_evo',level:'初中',category:'恒星演化',icon:'💫',title:'恒星演化路径',figure:'evolution',
content:'【小质量恒星（< 8 倍太阳质量）】\n分子云 → 主序星 → 红巨星 → 行星状星云 → 白矮星\n例：太阳最终将成为白矮星\n\n【大质量恒星（> 8 倍太阳质量）】\n分子云 → 主序星 → 红超巨星 → 超新星爆发\n　　　→ 中子星（1.4~3 倍太阳质量）\n　　　→ 黑洞（> 3 倍太阳质量）\n\n【主序星阶段】\n恒星一生中停留时间最长的阶段（约占寿命90%）\n\n【赫罗图】\n横轴：光谱型/温度（左高右低）\n纵轴：光度/绝对星等'},
{id:'k_j_mag',level:'初中',category:'星等',icon:'📊',title:'星等与光度',figure:'hr',
content:'【视星等 m】\n肉眼看到的亮度，数值越小越亮\n· 太阳：-26.7\n· 满月：-12.7\n· 天狼星：-1.46\n· 肉眼极限：约+6\n\n【绝对星等 M】\n把恒星放到10秒差距（32.6光年）处的视星等\n\n【距离模数公式】\nM = m + 5 − 5·lg d（d 单位为秒差距）\n\n【星等差与亮度比】\n每差1等，亮度相差约2.512倍\n每差5等，亮度相差100倍'},
{id:'k_j_motion',level:'初中',category:'天体运动',icon:'🌐',title:'视运动与坐标系',figure:'earth',
content:'【周日视运动】\n由地球自转引起，天体东升西落\n周期：1恒星日 = 23h56m4s\n\n【周年视运动】\n由地球公转引起\n太阳在天球上沿黄道自西向东移动，周期一年\n\n【黄道与黄赤交角】\n· 黄道：太阳周年视运动的轨迹\n· 黄赤交角：约23°26′\n· 是四季变化和昼夜长短变化的根本原因\n\n【拱极星】\n天极附近永不落下的星\n在北纬φ处，赤纬δ > 90°−φ 的星为拱极星'},
{id:'k_j_tele',level:'初中',category:'望远镜',icon:'🔭',title:'望远镜原理与参数',figure:'reflector',
content:'【核心参数】\n· 口径D：物镜直径，决定聚光能力和分辨率\n· 焦距f：影响放大倍率和视场\n· 分辨率 ≈ 1.22 λ / D（角秒）\n\n【放大倍率】\n放大倍率 = 物镜焦距 ÷ 目镜焦距\n有效倍率上限 ≈ 口径(mm) × 2\n\n【望远镜类型】\n· 折射式：凸透镜物镜，有色差\n· 反射式（牛顿式）：凹面镜物镜，无色差\n· 折反射式（施密特-卡塞格林）：兼顾两者\n\n【极限星等】口径越大，能看到越暗的星。'},
{id:'k_j_phase',level:'初中',category:'月相',icon:'🌙',title:'月相与月球运动',figure:'moonPhase',
content:'【两个周期】\n· 恒星月：27.32天，月球绕地球公转一周\n· 朔望月：29.53天，月相变化周期\n\n为什么朔望月更长？\n因为地球同时在绕太阳公转，月球需要多走约2.2天。\n\n【月相判定】\n· 上弦月：正午升起，午夜落下，亮面朝西\n· 下弦月：午夜升起，正午落下，亮面朝东\n\n【月球同步自转】\n月球自转周期 = 公转周期 = 27.32天\n所以地球上永远只能看到月球同一面。'},
{id:'k_j_eclipse',level:'初中',category:'日食月食',icon:'🌑',title:'日月食机制',figure:'eclipse',
content:'【日食】太阳 → 月球 → 地球\n· 只在朔（农历初一）发生\n· 类型：日全食、日偏食、日环食\n\n【月食】太阳 → 地球 → 月球\n· 只在望（农历十五前后）发生\n· 类型：月全食、月偏食、半影月食\n· 没有月环食\n\n【为什么不是每月都发生？】\n白道与黄道有约5°09′的交角，\n只有当朔/望发生在"黄白交点"附近时才会发生食。\n\n【沙罗周期】约18年11天8小时。'},
{id:'k_j_galaxy',level:'初中',category:'星系',icon:'🌌',title:'星系与宇宙膨胀',figure:'galaxy',
content:'【银河系】\n· 棒旋星系，直径约10万光年\n· 恒星约1000~4000亿颗\n· 太阳距银心约2.6万光年\n· 中心有人马座A*（超大质量黑洞）\n\n【河外星系】\n· 仙女座星系M31：约254万光年\n· 大麦哲伦云、小麦哲伦云：银河系伴星系\n\n【哈勃定律】\nv = H₀ × d\n· v：星系退行速度\n· d：星系距离\n· H₀：哈勃常数，约70 km/s/Mpc\n说明宇宙在膨胀\n\n【宇宙年龄】约138亿年\n【可观测宇宙直径】约930亿光年'},
{id:'k_j_history',level:'初中',category:'天文史',icon:'📜',title:'中外天文简史',figure:'coord',
content:'【中国古代】\n· 张衡（东汉）：浑天仪、地动仪、《灵宪》\n· 祖冲之（南朝）：编制《大明历》\n· 一行（唐）：编制《大衍历》\n· 郭守敬（元）：建登封观星台，编《授时历》\n　回归年长365.2425天\n\n【西方天文】\n· 托勒密：地心说\n· 哥白尼：日心说\n· 第谷：精密天文观测\n· 开普勒：行星运动三定律\n· 伽利略：首次用望远镜观测天体\n· 牛顿：万有引力定律\n\n【现代中国】\n· 南仁东：FAST首席科学家'},
{id:'k_j_sun',level:'初中',category:'太阳',icon:'☀️',title:'太阳的结构与活动',figure:'sunStruct',
content:'【结构（由内到外）】\n核心 → 辐射层 → 对流层 → 光球 → 色球 → 日冕\n\n【各层温度】\n· 核心：约1500万℃，进行氢核聚变\n· 光球：约5500℃\n· 色球：约4000~几万℃\n· 日冕：最外层，温度高达百万℃\n\n【太阳活动】\n· 太阳黑子：光球上的低温暗区，周期约11年\n· 耀斑：色球上的突然爆发\n· 日珥：色球喷出的巨大气体环\n· 太阳风：日冕向外吹出的带电粒子流\n\n【影响】极光、磁暴、影响卫星与通信。'},
{id:'k_j_star',level:'初中',category:'恒星',icon:'⭐',title:'恒星的光谱与分类',figure:'spectrum',
content:'【光谱型（按温度由高到低）】\nO → B → A → F → G → K → M\n· O型：>30000K，蓝白色\n· G型：约5800K，黄色（太阳是G2V）\n· M型：<3500K，红色\n\n【赫罗图】\n横轴：光谱型/有效温度（左高右低）\n纵轴：光度/绝对星等\n· 主序星：左上到右下的对角带\n· 巨星、超巨星：右上\n· 白矮星：左下\n\n【恒星质量】\n大部分在0.1~10倍太阳质量\n质量越大，光度越高，寿命越短。'},
{id:'k_j_unit',level:'初中',category:'天文单位',icon:'📐',title:'距离单位与视差',figure:'lightyear',
content:'【三种距离单位】\n· 天文单位 AU ≈ 1.496亿千米\n· 光年 ly ≈ 9.46万亿千米\n· 秒差距 pc ≈ 3.26光年 ≈ 206265 AU\n\n【周年视差】\n地球绕日公转导致近距离恒星在背景上产生的微小位移。\n\n定义：若恒星周年视差为1角秒，\n则该恒星距离为1秒差距。\n\n公式：d(秒差距) = 1 / p(角秒)\n\n【换算关系】\n1 pc = 3.26 ly = 206265 AU\n1 ly ≈ 63241 AU\n\n【比邻星】视差约0.77角秒 → 距离约1.3 pc ≈ 4.22 ly'},
{id:'k_j_dso',level:'初中',category:'深空天体',icon:'🌠',title:'深空天体与宇宙学',figure:'blackhole',
content:'【深空天体】\n· 星云：猎户座大星云M42、蟹状星云M1\n· 星团：昴星团M45（疏散）、M13（球状）\n· 星系：M31仙女座、M33三角座\n\n【特殊天体】\n· 类星体：极亮的活跃星系核\n· 脉冲星：快速自转的中子星\n· 黑洞：人马座A*、M87*\n\n【宇宙学】\n· 大爆炸：138亿年前\n· 微波背景辐射：2.725K\n· 暗物质约27%，暗能量约68%\n· 普通物质仅约5%'}
];

var AI_KB = [
{keys:['黑洞'],a:'黑洞是引力极强的天体，连光都无法逃脱。\n\n【形成】大质量恒星（>25倍太阳质量）超新星爆发后，核心坍缩形成。\n\n【结构】\n· 事件视界：有去无回的边界\n· 奇点：中心无限密度的点\n· 吸积盘：周围高速旋转的物质\n\n【著名黑洞】\n· 人马座A*：银河系中心，约430万倍太阳质量\n· M87*：2019年首张黑洞照片的主角'},
{keys:['中子星','脉冲星'],a:'中子星是恒星演化的终点之一。\n\n【特点】\n· 直径仅约20千米，质量是太阳的1.4~3倍\n· 密度极大：1立方厘米约重10亿吨\n· 自转极快，磁场极强\n\n【脉冲星】快速自转的中子星，发出周期性脉冲信号。\n\n【形成】大质量恒星超新星爆发后核心坍缩而成。'},
{keys:['太阳系','八大行星','行星'],a:'太阳系由太阳和围绕它运动的天体组成。\n\n【八大行星（由近到远）】\n水星 → 金星 → 地球 → 火星 → 木星 → 土星 → 天王星 → 海王星\n\n【分类】\n· 类地行星：水、金、地、火（岩石）\n· 巨行星：木星、土星（气态）\n· 远日行星：天王星、海王星（冰质）\n\n【其他成员】\n· 矮行星：冥王星、谷神星\n· 小行星带：火星与木星之间'},

/* ============ 题型判定 ============ */
function isCorrect(q, ua){
  if (ua === undefined || ua === null) return false;
  if (q.type === 'single' || q.type === 'judge' || q.type === 'image') return ua === q.answer;
  if (q.type === 'multi'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    var a = ua.slice().sort(function(x, y){ return x - y; });
    var b = q.answer.slice().sort(function(x, y){ return x - y; });
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  if (q.type === 'fill'){
    var u = norm(ua);
    if (!u) return false;
    for (var j = 0; j < q.answer.length; j++) if (norm(q.answer[j]) === u) return true;
    return false;
  }
  if (q.type === 'order'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    for (var k = 0; k < q.answer.length; k++) if (ua[k] !== q.answer[k]) return false;
    return true;
  }
  return false;
}
function isAnswered(q, ua){
  if (q.type === 'multi' || q.type === 'order') return Array.isArray(ua) && ua.length > 0;
  if (q.type === 'fill') return String(ua == null ? '' : ua).trim() !== '';
  return ua !== undefined && ua !== null && ua !== -1;
}
function answerText(q){
  if (q.type === 'single' || q.type === 'image') return LETTERS[q.answer];
  if (q.type === 'judge') return q.answer === 0 ? '正确' : '错误';
  if (q.type === 'multi') return q.answer.map(function(i){ return LETTERS[i]; }).join('、');
  if (q.type === 'fill') return q.answer[0];
  if (q.type === 'order') return q.answer.map(function(i){ return q.options[i]; }).join(' → ');
  return '';
}
function typeLabel(t){
  return {single:'单选',multi:'多选',judge:'判断',fill:'填空',order:'排序',image:'图片'}[t] || '题目';
}
function typeBadge(t){
  return {single:'blue',multi:'purple',judge:'green',fill:'amber',order:'purple',image:'blue'}[t] || '';
}

/* ============ 数据查询 ============ */
function getQuestions(level, category){
  return Q.filter(function(q){ return (!level || q.level === level) && (!category || q.category === category); });
}
function getCategories(level){
  var s = {};
  Q.forEach(function(q){ if (q.level === level) s[q.category] = 1; });
  return Object.keys(s);
}
function getKnowledge(level, category){
  for (var i = 0; i < KNOWLEDGE.length; i++){
    if (KNOWLEDGE[i].level === level && KNOWLEDGE[i].category === category) return KNOWLEDGE[i];
  }
  return null;
}
function getDaily(level){
  var p = getQuestions(level);
  if (!p.length) return null;
  var d = Math.floor(Date.now() / 86400000);
  return p[d % p.length];
}
function getMastery(level, category){
  var qs = getQuestions(level, category);
  var st = Store.getQStats();
  var t = 0, c = 0;
  qs.forEach(function(q){ var s = st[q.id]; if (s){ t += s.t; c += s.c; } });
  var wid = Store.getWrong().map(function(w){ return w.id; });
  var wc = qs.filter(function(q){ return wid.indexOf(q.id) >= 0; }).length;
  return { total: qs.length, answered: t, correct: c, rate: t ? Math.round(c / t * 100) : 0, wrongCount: wc };
}

      '<span style="font-size:13px;color:var(--sub);width:22px;">' + (i + 1) + '</span>' +
      '<span class="type-badge ' + typeBadge(q.type) + '" style="margin:0;">' + typeLabel(q.type) + '</span>' +
      '<span style="flex:1;font-size:13.5px;color:#B8C2DC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(q.stem) + '</span></div>';
  });
  h += '</div>';

  h += '<div class="btn-row" style="margin-top:22px;">' +
    '<button class="btn btn-ghost" onclick="go(\'learn\')">返回列表</button>' +
    '<button class="btn btn-main" onclick="startPractice(\'' + state.level + '\',\'' + c.replace(/'/g, "\\'") + '\')">开始练习</button>' +
    '</div>';

  if (m.wrongCount){
    h += '<button class="btn btn-amber" style="margin-top:12px;" onclick="reAsk(\'' + state.level + '\',\'' + c.replace(/'/g, "\\'") + '\')">🔁 针对错题再提问（' + m.wrongCount + ' 道）</button>';
  }
  return h;
}

/* ============ 练习 ============ */
function startPractice(level, category){
  var list = shuffle(getQuestions(level, category));
  if (!list.length){ alert('该知识点暂无题目'); return; }
  startWith(list, level, category || '综合练习');
}
function startWith(list, level, label){
  state.practice = {
    list: list, index: 0,
    userAnswers: new Array(list.length).fill(null),
    showAnswer: false, correct: 0, wrong: 0,
    level: level, label: label
  };
  go('practice');
}
function renderPractice(){
  var p = state.practice;
  if (!p) return '<div class="empty"><div class="ico">😕</div><div class="txt">数据丢失</div></div>';
  var q = p.list[p.index];
  var ua = p.userAnswers[p.index];
  var total = p.list.length;
  var answered = isAnswered(q, ua);

  var h = '<div class="topbar">' +
    '<div class="counter">第 ' + (p.index + 1) + ' / ' + total + ' 题</div>' +
    '<div class="counter"><span class="ok">✓ ' + p.correct + '</span>　<span class="no">✗ ' + p.wrong + '</span></div></div>';
  h += '<div class="progress"><i style="width:' + rate(p.index, total) + '%;"></i></div>';

  h += '<div class="card"><div class="tags">' +
    '<span class="tag">' + esc(q.level) + '</span>' +
    '<span class="tag">' + esc(q.category) + '</span>' +
    '<span class="tag amber">' + typeLabel(q.type) + '</span></div>';

  if (q.type === 'image' && q.image && SVG[q.image]){
    h += '<div class="q-image">' + SVG[q.image] + '</div>';
  }
  h += '<div class="stem">' + esc(q.stem) + '</div>';
  h += renderInput(q, ua, p.showAnswer, 'pChoose');
  h += '</div>';

  if (p.showAnswer){
    var ok = isCorrect(q, ua);
    h += '<div class="explain"><div class="head ' + (ok ? 'ok' : 'no') + '">' +
      (ok ? '✓ 回答正确' : '✗ 回答错误') + '</div>' +
      '<div class="line">正确答案：' + esc(answerText(q)) + '</div>' +
      '<div class="line">' + esc(q.explanation) + '</div></div>';
  }

  h += '<div class="footer">';
  if (!p.showAnswer){
    h += '<button class="btn btn-main" ' + (!answered ? 'disabled' : '') + ' onclick="pSubmit()">提交答案</button>';
  } else if (p.index < total - 1){
    h += '<button class="btn btn-main" onclick="pNext()">下一题</button>';
  } else {
    h += '<button class="btn btn-main" onclick="pFinish()">完成练习</button>';
  }
  h += '</div>';
  return h;
}
function renderInput(q, ua, show, fn){
  if (q.type === 'fill'){
    var v = esc(ua == null ? '' : ua);
    var h = '<input class="fill-input" id="fillInput" type="text" value="' + v + '" placeholder="请输入答案" ' +
      (show ? 'disabled' : '') + ' oninput="onFill(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    if (show){
      var ok = isCorrect(q, ua);
      h += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你填写的是：<b style="color:' + (ok ? 'var(--green)' : 'var(--red)') + ';">' + esc(ua || '（空）') + '</b></div>';
    }
    return h;
  }
  if (q.type === 'order'){
    var arr = Array.isArray(ua) ? ua : [];
    var h2 = '<div style="font-size:13px;color:var(--sub);margin-bottom:10px;">点击选项，按正确顺序依次排列</div>';
    q.options.forEach(function(t, i){
      var pos = arr.indexOf(i);
      var taken = pos >= 0;
      var cls = 'option order-item' + (taken ? ' taken' : '');
      if (show){
        var isRight = q.answer.indexOf(i) === pos;
        cls += isRight ? ' right' : ' wrong';
      }
      h2 += '<div class="' + cls + '" onclick="' + fn + '(' + i + ')">' +
        (taken ? '<span class="order-num">' + (pos + 1) + '</span>' : '<span class="opt-key">?</span>') +
        '<span class="opt-text">' + esc(t) + '</span></div>';
    });
    if (arr.length && !show){
      h2 += '<div style="margin-top:8px;font-size:12px;color:var(--sub);">已排：' + arr.map(function(i){ return q.options[i]; }).join(' → ') + '</div>';
    }
    if (show){
      h2 += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你的排序：' + (arr.length ? arr.map(function(i){ return q.options[i]; }).join(' → ') : '（空）') + '</div>';
    }
    return h2;
  }
  var isMulti = q.type === 'multi';
  var am = Array.isArray(ua) ? ua : [];
  return q.options.map(function(t, i){
    var cls = 'option';
    var sel = isMulti ? am.indexOf(i) >= 0 : (ua === i);
    var right = isMulti ? q.answer.indexOf(i) >= 0 : (q.answer === i);
    if (show){
      if (right) cls += ' right';
      else if (sel) cls += ' wrong';
      else cls += ' dim';
    } else if (sel){
      cls += ' selected';
    }
    var key = q.type === 'judge' ? (i === 0 ? '✓' : '✗') : LETTERS[i];
    return '<div class="' + cls + '" onclick="' + fn + '(' + i + ')">' +
      '<span class="opt-key">' + key + '</span>' +
      '<span class="opt-text">' + esc(t) + '</span></div>';
  }).join('');
}
function onFill(v){
  var p = state.practice;
  if (!p) return;
  p.userAnswers[p.index] = v;
  var b = document.querySelector('.footer .btn-main');
  if (b && !p.showAnswer) b.disabled = !v.trim();
}
function pChoose(i){
  var p = state.practice;
  if (!p || p.showAnswer) return;
  var q = p.list[p.index];
  if (q.type === 'multi'){
    var arr = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var k = arr.indexOf(i);
    if (k >= 0) arr.splice(k, 1); else arr.push(i);
    p.userAnswers[p.index] = arr;
    document.querySelectorAll('.option').forEach(function(n, j){
      n.className = 'option' + (arr.indexOf(j) >= 0 ? ' selected' : '');
    });
    var b = document.querySelector('.footer .btn-main');
    if (b) b.disabled = arr.length === 0;
    return;
  }
  if (q.type === 'order'){
    var a2 = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var k2 = a2.indexOf(i);
    if (k2 >= 0) a2.splice(k2, 1); else a2.push(i);
    p.userAnswers[p.index] = a2;
    render();
    return;
  }
  p.userAnswers[p.index] = i;
  document.querySelectorAll('.option').forEach(function(n, j){
    n.className = 'option' + (j === i ? ' selected' : '');
  });
  var b2 = document.querySelector('.footer .btn-main');
  if (b2) b2.disabled = false;
}
function pSubmit(){
  var p = state.practice;
  if (!p) return;
  var q = p.list[p.index];
  var ua = p.userAnswers[p.index];
  if (!isAnswered(q, ua)) return;
  var ok = isCorrect(q, ua);
  if (ok) p.correct++; else { p.wrong++; Store.addWrong(q.id); }
  Store.bumpQStat(q.id, ok);
  p.showAnswer = true;
  render();
}
function pNext(){ state.practice.index++; state.practice.showAnswer = false; render(); }
function pFinish(){
  var p = state.practice;
  var total = p.list.length, correct = p.correct;
  Store.addRecord({ mode:'practice', total: total, correct: correct });
  if (confirm('共 ' + total + ' 题\n答对 ' + correct + ' 题\n正确率 ' + rate(correct, total) + '%\n\n点击「确定」再来一组，点击「取消」返回')){
    var list = shuffle(p.list);
    state.practice = {
      list: list, index: 0,
      userAnswers: new Array(list.length).fill(null),
      showAnswer: false, correct: 0, wrong: 0,
      level: p.level, label: p.label
    };
    render();
  } else go('home');
}

/* ============ 竞赛 ============ */
var EXAM_N = 20, EXAM_MIN = 20;
function startExam(level){
  var pool = getQuestions(level);
  if (!pool.length){ alert('题库为空'); return; }
  var list = shuffle(pool).slice(0, Math.min(EXAM_N, pool.length));
  state.exam = {
    list: list, index: 0,
    answers: new Array(list.length).fill(null),
    remain: EXAM_MIN * 60, total: EXAM_MIN * 60,
    showCard: false, running: true
  };
  go('exam');
}
function renderExam(){
  var e = state.exam;
  if (!e) return '<div class="empty"><div class="ico">😕</div><div class="txt">数据丢失</div></div>';
  var q = e.list[e.index];
  var ua = e.answers[e.index];
  var answered = e.answers.filter(function(a, i){ return isAnswered(e.list[i], a); }).length;

  var h = '<div class="topbar">' +
    '<div class="timer" id="timerText">' + fmtTime(e.remain) + '</div>' +
    '<div class="counter">已答 ' + answered + ' / ' + e.list.length + '</div>' +
    '<button class="card-btn" onclick="toggleCard()">答题卡</button></div>';
  h += '<div class="progress"><i style="width:' + rate(e.index + 1, e.list.length) + '%;"></i></div>';

  h += '<div class="card"><div class="tags">' +
    '<span class="tag">' + esc(q.level) + '</span>' +
    '<span class="tag">' + esc(q.category) + '</span>' +
    '<span class="tag">' + typeLabel(q.type) + '</span>' +
    '<span class="tag">第 ' + (e.index + 1) + ' 题</span></div>';
  if (q.type === 'image' && q.image && SVG[q.image]){
    h += '<div class="q-image">' + SVG[q.image] + '</div>';
  }
  h += '<div class="stem">' + esc(q.stem) + '</div>';
  h += renderInput(q, ua, false, 'eChoose');
  h += '</div>';

  h += '<div class="btn-row" style="margin-top:6px;">' +
    '<button class="btn btn-ghost" ' + (e.index === 0 ? 'disabled' : '') + ' onclick="ePrev()">上一题</button>' +
    '<button class="btn btn-ghost" ' + (e.index === e.list.length - 1 ? 'disabled' : '') + ' onclick="eNext()">下一题</button>' +
    '</div>';
  h += '<button class="btn btn-main" style="margin-top:16px;" onclick="eConfirm()">交卷</button>';

  if (e.showCard){
    h += '<div class="mask" onclick="toggleCard()"></div><div class="sheet show"><h3>答题卡</h3><div class="sheet-grid">';
    e.list.forEach(function(qq, i){
      h += '<div class="sheet-item ' + (isAnswered(qq, e.answers[i]) ? 'done' : '') + ' ' + (i === e.index ? 'active' : '') + '" onclick="eJump(' + i + ')">' + (i + 1) + '</div>';
    });
    h += '</div><div class="sheet-tip">蓝色 = 已作答　灰色 = 未作答</div></div>';
  }
  return h;
}
function startExamTimer(){
  var t = setInterval(function(){
    if (!state.exam || state.page !== 'exam'){ clearInterval(t); return; }
    state.exam.remain--;
    if (state.exam.remain <= 0){
      state.exam.remain = 0; updateTimer();
      clearInterval(t); state.exam.running = false;
      alert('时间到，自动交卷！'); submitExam();
      return;
    }
    updateTimer();
  }, 1000);
  timers.push(t);
}
function updateTimer(){
  var el = document.getElementById('timerText');
  if (el && state.exam){
    el.textContent = fmtTime(state.exam.remain);
    el.style.color = state.exam.remain <= 60 ? 'var(--red)' : 'var(--blue)';
  }
}
function eChoose(i){
  var e = state.exam;
  if (!e) return;
  var q = e.list[e.index];
  if (q.type === 'multi'){
    var arr = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var k = arr.indexOf(i);
    if (k >= 0) arr.splice(k, 1); else arr.push(i);
    e.answers[e.index] = arr;
    document.querySelectorAll('.option').forEach(function(n, j){
      n.className = 'option' + (arr.indexOf(j) >= 0 ? ' selected' : '');
    });
  } else if (q.type === 'order'){
    var a2 = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var k2 = a2.indexOf(i);
    if (k2 >= 0) a2.splice(k2, 1); else a2.push(i);
    e.answers[e.index] = a2;
    render();
    return;
  } else {
    e.answers[e.index] = i;
    document.querySelectorAll('.option').forEach(function(n, j){
      n.className = 'option' + (j === i ? ' selected' : '');
    });
  }
  var c = document.querySelector('.topbar .counter');
  if (c){
    var an = e.answers.filter(function(a, k){ return isAnswered(e.list[k], a); }).length;
    c.textContent = '已答 ' + an + ' / ' + e.list.length;
  }
}
function ePrev(){ if (state.exam.index > 0){ state.exam.index--; render(); } }
function eNext(){ if (state.exam.index < state.exam.list.length - 1){ state.exam.index++; render(); } }
function eJump(i){ state.exam.index = i; state.exam.showCard = false; render(); }
function toggleCard(){ state.exam.showCard = !state.exam.showCard; render(); }
function eConfirm(){
  var e = state.exam;
  var un = e.list.filter(function(q, i){ return !isAnswered(q, e.answers[i]); }).length;
  if (confirm(un > 0 ? '还有 ' + un + ' 题未作答，确定交卷吗？' : '确定交卷吗？')) submitExam();
}
function submitExam(){
  var e = state.exam;
  if (!e) return;
  clearTimers(); e.running = false;
  var score = 0, right = 0, wrong = 0, blank = 0;
  var det = [];
  e.list.forEach(function(q, i){
    var ua = e.answers[i];
    var ok = isCorrect(q, ua);
    var done = isAnswered(q, ua);
    if (!done) blank++;
    else if (ok){ right++; score += 2; }
    else { wrong++; score -= 1; Store.addWrong(q.id); }
    Store.bumpQStat(q.id, ok && done);
    det.push({
      id: q.id, type: q.type, stem: q.stem, options: q.options || null,
      image: q.image || null, your: ua, correct: q.answer,
      explanation: q.explanation, isCorrect: ok, isBlank: !done
    });
  });
  var r = {
    level: e.list[0].level, total: e.list.length,
    score: score, fullScore: e.list.length * 2,
    right: right, wrong: wrong, blank: blank,
    rate: rate(right, e.list.length), used: e.total - e.remain, details: det
  };
  Store.addRecord({ mode:'exam', total: e.list.length, correct: right });
  state.result = r; state.exam = null; go('result');
}

        } else if (it.q.options){
          it.q.options.forEach(function(t, i){
            var isR = Array.isArray(it.q.answer) ? it.q.answer.indexOf(i) >= 0 : it.q.answer === i;
            h += '<span class="' + (isR ? 'ok' : '') + '">' + LETTERS[i] + '. ' + esc(t) + '</span><br>';
          });
        }
        h += '</div><div class="q-exp">' + esc(it.q.explanation) + '</div>' +
          '<div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">' +
          '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();removeW(\'' + it.q.id + '\')">移除</button></div></div>';
      });
      h += '<button class="btn btn-amber" style="margin-bottom:16px;" onclick="reAsk(\'' + gr.level + '\',\'' + gr.category.replace(/'/g, "\\'") + '\')">🔁 针对「' + esc(gr.category) + '」再提问</button></div>';
    }
  });
  h += '<button class="btn btn-ghost" style="margin:10px 0 40px;" onclick="clearW()">清空错题本</button>';
  return h;
}
function toggleG(k){ state.expanded[k] = !state.expanded[k]; render(); }
function reAsk(level, category){
  var pool = getQuestions(level, category);
  if (!pool.length){ alert('该知识点暂无题目'); return; }
  var wid = Store.getWrong().map(function(w){ return w.id; });
  var wrongOnes = pool.filter(function(q){ return wid.indexOf(q.id) >= 0; });
  var others = pool.filter(function(q){ return wid.indexOf(q.id) < 0; });
  var picked = shuffle(wrongOnes);
  if (picked.length < 5) picked = picked.concat(shuffle(others).slice(0, 5 - picked.length));
  picked = shuffle(picked).slice(0, Math.min(6, pool.length));
  if (!confirm('针对「' + category + '」再提问\n\n本次共 ' + picked.length + ' 题\n（优先抽取你答错过的题目）\n\n点击「确定」开始练习')) return;
  startWith(picked, level, category + ' · 强化练习');
}
function removeW(id){ if (confirm('确定从错题本移除这道题吗？')){ Store.removeWrong(id); render(); } }
function clearW(){ if (confirm('所有错题记录将被删除，不可恢复。确定吗？')){ Store.clearWrong(); render(); } }

/* ============ AI 助手 ============ */
function renderAI(){
  if (state.aiMsgs.length === 0){
    state.aiMsgs = [{ role:'bot', text:'你好，我是星赛通 AI 天文助手 🤖\n\n可以回答天文竞赛相关问题，也可以让我随机出题考你。\n\n试试下面的快捷提问，或直接在输入框输入问题。' }];
  }
  var h = '<div class="title">AI 天文助手</div>' +
    '<div class="sub" style="margin-bottom:14px;">基于本地知识库，随时解答天文疑问</div>' +
    '<div class="ai-quick">' +
    '<button onclick="aiAsk(\'黑洞是怎么形成的？\')">黑洞怎么形成？</button>' +
    '<button onclick="aiAsk(\'如何找到北极星？\')">如何找北极星？</button>' +
    '<button onclick="aiAsk(\'日食和月食有什么区别？\')">日食与月食</button>' +
    '<button onclick="aiAsk(\'望远镜怎么选？\')">望远镜怎么选？</button>' +
    '<button onclick="aiAsk(\'星等是什么意思？\')">星等是什么？</button>' +
    '<button onclick="aiAsk(\'深空天体有哪些？\')">深空天体</button>' +
    '<button onclick="aiAsk(\'出题考考我\')">随机出题</button>' +
    '</div><div class="ai-chat" id="aiChat">';
  state.aiMsgs.forEach(function(m){
    h += '<div class="ai-msg ' + m.role + '">' + fmtAI(m.text) + '</div>';
  });
  if (state.aiTyping) h += '<div class="ai-typing">AI 正在思考</div>';
  h += '</div><div style="height:60px;"></div>';
  h += '<div class="ai-input-row">' +
    '<input class="ai-input" id="aiInput" type="text" placeholder="输入你的天文问题..." onkeydown="if(event.key===\'Enter\')aiSend()">' +
    '<button class="ai-send" onclick="aiSend()">发送</button></div>';
  return h;
}
function fmtAI(t){
  return esc(t).replace(/\n/g, '<br>').replace(/【(.+?)】/g, '<b>【$1】</b>');
}
function aiAsk(t){
  var i = document.getElementById('aiInput');
  if (i) i.value = t;
  aiSend();
}
function aiSend(){
  var i = document.getElementById('aiInput');
  if (!i) return;
  var t = i.value.trim();
  if (!t) return;
  i.value = '';
  state.aiMsgs.push({ role:'user', text: t });
  state.aiTyping = true;
  render();
  setTimeout(function(){
    var r = aiRespond(t);
    state.aiMsgs.push({ role:'bot', text: r });
    state.aiTyping = false;
    Store.saveAI(state.aiMsgs);
    render();
    setTimeout(function(){ window.scrollTo(0, document.body.scrollHeight); }, 50);
  }, 400 + Math.random() * 400);
}
function aiRespond(text){
  var q = String(text || '').toLowerCase();
  var best = null, bs = 0;
  AI_KB.forEach(function(item){
    var s = 0;
    item.keys.forEach(function(k){ if (q.indexOf(k.toLowerCase()) >= 0) s += k.length; });
    if (s > bs){ bs = s; best = item; }
  });
  if (best) return best.a;
  if (q.indexOf('出题') >= 0 || q.indexOf('考考') >= 0){
    var p = getQuestions(state.level);
    var q1 = p[Math.floor(Math.random() * p.length)];
    return '📝 为你随机出一道' + state.level + '组的题目：\n\n【' + typeLabel(q1.type) + '】' + q1.stem +
      (q1.options ? '\n\n' + q1.options.map(function(t, i){ return LETTERS[i] + '. ' + t; }).join('\n') : '') +
      '\n\n（点击底部"练习"标签可进入答题模式）';
  }
  return '我是星赛通 AI 助手，可以回答天文竞赛相关问题。\n\n试试问我：\n· 黑洞是怎么形成的？\n· 如何找到北极星？\n· 日食和月食有什么区别？\n· 望远镜怎么选？\n· 星等是什么意思？\n· 月相变化有什么规律？\n· 深空天体有哪些？';
}

    '<div class="sign" style="margin-top:10px;color:rgba(255,255,255,.75);">作者：<b style="color:#fff;">戴煜</b> · 18662613315@163.com</div>' +
    '</div>';
  h += '<div class="grid2">' +
    '<div><div class="n">' + s.total + '</div><div class="l">累计答题</div></div>' +

      '<div style="font-size:13px;color:var(--sub);margin-bottom:6px;">📌 薄弱知识点</div>' +

  }

    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="go(\'home\')"><span>🏠 返回首页</span><span class="arrow">›</span></div></div>';
  h += '<div class="card" style="padding:0;">' +
    '<div class="row-item" onclick="clearAI()"><span style="color:var(--sub);">🧹 清除 AI 对话记录</span><span class="arrow">›</span></div>' +
    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="clearAll()"><span style="color:var(--red);">🗑 清除所有数据</span><span class="arrow">›</span></div></div>';
  h += '<div class="version">星赛通 v4.0 · 网页版<br>' +
    '作者：戴煜 · 邮箱：18662613315@163.com<br>' +
    '题库 ' + Q.length + ' 题（小学 ' + Q.filter(function(q){ return q.level === '小学'; }).length +
    ' · 初中 ' + Q.filter(function(q){ return q.level === '初中'; }).length + '）<br>' +
    '知识卡 ' + KNOWLEDGE.length + ' 张 · 六种题型 · 动态模型</div>';
  return h;
}
function clearAI(){ if (confirm('清除所有 AI 对话记录？')){ Store.clearAI(); state.aiMsgs = []; render(); alert('已清除'); } }
function clearAll(){ if (confirm('所有数据都会被清空，不可恢复。确定吗？')){ Store.clearAll(); state.aiMsgs = []; render(); alert('已清除'); } }

/* ============ 事件 ============ */
backBtn.addEventListener('click', function(){
  if (state.page === 'result') return go('home');
  if (state.page === 'learnDetail') return go('learn');
  if (state.page === 'practice' || state.page === 'exam'){
    if (state.page === 'exam' && state.exam){
      if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
      clearTimers(); state.exam = null;
    }
    return go('home');
  }
  go('home');
});
tabbar.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  var t = b.dataset.tab;
  if (!t || t === state.page) return;
  if (state.page === 'exam' && state.exam){
    if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
    clearTimers(); state.exam = null;
  }
  go(t);
});
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  var isI = tag === 'input' || tag === 'textarea';
  if (state.page === 'practice'){
    var p = state.practice;
    if (!p) return;
    var q = p.list[p.index];
    if (!isI && !p.showAnswer && q.type !== 'fill'){
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length){ pChoose(n - 1); e.preventDefault(); }
    }
    if (e.key === 'Enter'){
      if (!p.showAnswer && isAnswered(q, p.userAnswers[p.index])){ pSubmit(); e.preventDefault(); }
      else if (p.showAnswer && p.index < p.list.length - 1){ pNext(); e.preventDefault(); }
    }
  }
  if (state.page === 'exam'){
    var ex = state.exam;
    if (!ex) return;
    var q2 = ex.list[ex.index];
    if (!isI && q2.type !== 'fill'){
      var n2 = parseInt(e.key, 10);
      if (n2 >= 1 && n2 <= q2.options.length){ eChoose(n2 - 1); e.preventDefault(); }
    }
    if (!isI && e.key === 'ArrowLeft') ePrev();
    if (!isI && e.key === 'ArrowRight') eNext();
  }
});

/* ============ 启动 ============ */
try { render(); } catch(err){
  console.error(err);
  view.innerHTML = '<div class="card"><div class="title">加载出错了</div><div class="sub">' + esc(err.message) + '</div></div>';
}
