<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星赛通 · 天文知识竞赛</title>
<style>
:root{
  --bg:#0B1026; --bg2:#141C36; --bg3:#0F1730;
  --line:#1F2A4A; --text:#E8ECF7; --sub:#8A93B8;
  --blue:#4FA8FF; --blue-d:#2F7BFF;
  --green:#2ED47A; --red:#FF5B5B; --purple:#7B4FE0;
  --amber:#FFB84D; --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;
}
#starsBg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{
  position:relative;z-index:1;
  max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  background:rgba(11,16,38,.55);
}
.navbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;
  background:rgba(11,16,38,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.navbar h1{font-size:17px;margin:0;font-weight:700;flex:1;}
.back-btn{background:none;border:none;color:var(--blue);font-size:22px;cursor:pointer;padding:0 6px;}
.view{flex:1;padding:18px 18px 90px;}
.hidden{display:none !important;}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:520px;margin:0 auto;display:flex;
  background:rgba(18,26,51,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;background:none;border:none;cursor:pointer;
  padding:10px 0 12px;color:var(--sub);font-size:12px;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tabbar button .ico{font-size:19px;line-height:1;}
.tabbar button.active{color:var(--blue);}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.title{font-size:22px;font-weight:800;margin:0 0 6px;}
.sub{color:var(--sub);font-size:13px;}
.sec-title{font-size:16px;font-weight:700;margin:24px 0 12px;}

.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-main{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}
.btn-ghost{background:transparent;color:var(--blue);border:1px solid var(--blue-d);}
.btn-amber{background:linear-gradient(135deg,#E08A1E,#FFB84D);color:#fff;}
.btn-green{background:linear-gradient(135deg,#199E56,#2ED47A);color:#fff;}
.btn-sm{padding:9px 16px;font-size:14px;width:auto;border-radius:999px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-row{display:flex;gap:12px;}
.btn-row .btn{flex:1;}

.tag{display:inline-block;font-size:12px;color:var(--blue);background:rgba(79,168,255,.12);padding:2px 10px;border-radius:20px;margin-right:6px;}
.tag.err{color:var(--red);background:rgba(255,91,91,.12);}
.tag.ok{color:var(--green);background:rgba(46,212,122,.12);}
.tag.amber{color:var(--amber);background:rgba(255,184,77,.14);}
.tag.purple{color:#A78BFA;background:rgba(167,139,250,.15);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}

.hero{padding:6px 0 18px;}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#8FB4FF,#4FA8FF 60%,#A78BFA);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.level-switch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;}
.level-switch button{flex:1;padding:11px 0;border:none;background:none;cursor:pointer;border-radius:999px;color:var(--sub);font-size:15px;font-family:inherit;font-weight:600;transition:.2s;}
.level-switch button.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}

/* 太阳系动画 */
.solar-wrap{
  background:linear-gradient(135deg,rgba(47,123,255,.08),rgba(123,79,224,.08));
  border:1px solid rgba(79,168,255,.22);
  border-radius:var(--r);padding:14px;margin-bottom:14px;
  overflow:hidden;
}
.solar-wrap svg{display:block;width:100%;height:auto;}

.entry-row{display:flex;gap:12px;margin-bottom:6px;}
.entry-card{flex:1;border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;border:none;font-family:inherit;color:#fff;transition:transform .15s;}
.entry-card:active{transform:scale(.97);}
.entry-card.blue{background:linear-gradient(135deg,#1E4FA8,#2F7BFF);}
.entry-card.purple{background:linear-gradient(135deg,#4A2D8F,#7B4FE0);}
.entry-card .ico{font-size:28px;display:block;margin-bottom:8px;}
.entry-card .t{font-size:16px;font-weight:700;}
.entry-card .s{font-size:12px;opacity:.8;margin-top:3px;}

.chip-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:8px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:#B8C2DC;font-size:14px;font-family:inherit;}
.chip:active{background:#1D2745;}

.daily-stem{font-size:16px;line-height:1.6;margin:4px 0 12px;font-weight:500;}
.opt-line{color:#B8C2DC;font-size:14px;line-height:2;}
.answer-hint{margin-top:12px;color:var(--blue);font-size:14px;font-weight:600;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.counter{font-size:13px;color:var(--sub);}
.counter .ok{color:var(--green);}
.counter .no{color:var(--red);}
.progress{height:5px;background:#1A2340;border-radius:5px;overflow:hidden;margin-bottom:18px;}
.progress > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2F7BFF,#4FA8FF);transition:width .3s;}

.stem{font-size:17px;line-height:1.65;margin:4px 0 16px;font-weight:500;}
.q-image{
  background:rgba(15,23,48,.8);border-radius:14px;
  padding:12px;margin-bottom:16px;overflow:hidden;
}
.q-image svg{display:block;width:100%;height:auto;max-height:220px;}

.option{display:flex;align-items:center;padding:14px 15px;margin-bottom:10px;background:var(--bg3);border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:all .18s;}
.option:active{transform:scale(.99);}
.option.selected{border-color:var(--blue);background:rgba(79,168,255,.12);}
.option.right{border-color:var(--green);background:rgba(46,212,122,.12);}
.option.wrong{border-color:var(--red);background:rgba(255,91,91,.12);}
.option.dim{opacity:.45;}
.opt-key{width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--line);font-size:13px;font-weight:700;margin-right:12px;flex-shrink:0;}
.option.selected .opt-key{background:var(--blue);color:#0B1026;}
.option.right .opt-key{background:var(--green);color:#0B1026;}
.option.wrong .opt-key{background:var(--red);color:#fff;}
.opt-text{flex:1;font-size:15px;line-height:1.5;}

.order-num{
  display:inline-block;width:26px;height:26px;line-height:26px;
  text-align:center;border-radius:50%;
  background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;
  font-size:13px;font-weight:800;margin-right:12px;flex-shrink:0;
}
.order-item.taken{opacity:.4;pointer-events:none;}

.fill-input{
  width:100%;padding:15px 16px;border-radius:14px;
  background:var(--bg3);border:2px solid var(--line);
  color:var(--text);font-size:16px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.fill-input:focus{border-color:var(--blue);}

.explain{background:var(--bg2);border-left:4px solid var(--blue);border-radius:12px;padding:16px;margin-top:16px;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.explain .head{font-size:16px;font-weight:700;margin-bottom:8px;}
.explain .head.ok{color:var(--green);}
.explain .head.no{color:var(--red);}
.explain .line{font-size:14px;line-height:1.75;color:#B8C2DC;margin-bottom:5px;}

.footer{margin-top:22px;}

.timer{font-size:19px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;}
.card-btn{font-size:12px;color:var(--blue);border:1px solid var(--blue-d);padding:4px 12px;border-radius:999px;background:none;cursor:pointer;font-family:inherit;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px 36px;transform:translateY(110%);transition:transform .28s;max-height:70vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet h3{margin:0 0 16px;font-size:17px;}
.sheet-grid{display:flex;flex-wrap:wrap;gap:10px;}
.sheet-item{width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;background:var(--line);color:var(--sub);font-size:14px;cursor:pointer;}
.sheet-item.done{background:rgba(79,168,255,.2);color:var(--blue);font-weight:700;}
.sheet-item.active{outline:2px solid var(--blue);color:#fff;}
.sheet-tip{margin-top:18px;font-size:12px;color:#5C6688;}

.score-card{background:linear-gradient(135deg,#1E4FA8,#2F7BFF 60%,#4FA8FF);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.score-card .lb{font-size:13px;opacity:.85;}
.score-card .num{font-size:60px;font-weight:900;line-height:1.15;}
.score-card .full{font-size:13px;opacity:.8;}
.score-card .rate{display:inline-block;margin-top:12px;font-size:13px;padding:5px 16px;background:rgba(255,255,255,.18);border-radius:999px;}
.stat-row{display:flex;background:var(--bg2);border-radius:var(--r);padding:18px 0;margin-bottom:22px;border:1px solid var(--line);}
.stat-row > div{flex:1;text-align:center;}
.stat-row .n{font-size:24px;font-weight:800;}
.stat-row .n.ok{color:var(--green);}
.stat-row .n.no{color:var(--red);}
.stat-row .n.gray{color:var(--sub);}
.stat-row .l{font-size:12px;color:var(--sub);margin-top:2px;}

.q-stem{font-size:15px;line-height:1.6;margin-bottom:12px;font-weight:500;}
.q-line{font-size:13.5px;line-height:1.95;color:#B8C2DC;}
.q-line .ok{color:var(--green);font-weight:700;}
.q-line .no{color:var(--red);text-decoration:line-through;}
.q-exp{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.75;}

.filter-bar{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-item{flex-shrink:0;padding:7px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:var(--sub);font-size:13.5px;font-family:inherit;white-space:nowrap;}
.filter-item.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.k-title{font-size:16.5px;font-weight:700;margin-bottom:8px;}
.k-preview{font-size:13.5px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.k-content{font-size:15px;line-height:2;color:#C8D2E8;white-space:pre-wrap;}

.learn-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;}
.learn-card:active{transform:scale(.985);}
.learn-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.learn-ico{width:40px;height:40px;border-radius:12px;background:rgba(79,168,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.learn-name{font-size:16px;font-weight:700;flex:1;}
.learn-meta{font-size:12px;color:var(--sub);}
.mastery-bar{height:6px;background:#1A2340;border-radius:6px;overflow:hidden;margin:10px 0 6px;}
.mastery-bar > i{display:block;height:100%;border-radius:6px;transition:width .3s;}
.mastery-info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);}

.study-box{background:linear-gradient(135deg,rgba(47,123,255,.10),rgba(123,79,224,.10));border:1px solid rgba(79,168,255,.25);border-radius:var(--r);padding:18px;margin-bottom:14px;}

.group-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:10px;}
.group-head .gh-l{display:flex;align-items:center;gap:10px;}
.group-head .gn{font-size:15.5px;font-weight:700;}
.group-head .gc{font-size:12px;color:var(--sub);}
.group-body{margin:-4px 0 14px;padding:0 4px;}

.row-item{display:flex;justify-content:space-between;align-items:center;font-size:15px;cursor:pointer;padding:16px 18px;}
.row-item .arrow{color:#5C6688;font-size:14px;}

.empty{text-align:center;padding:70px 0;}
.empty .ico{font-size:48px;margin-bottom:14px;}
.empty .txt{color:var(--sub);font-size:14px;}
.version{text-align:center;color:#3E4767;font-size:12px;margin:34px 0 10px;}

.grid2{display:flex;flex-wrap:wrap;background:var(--bg2);border-radius:var(--r);border:1px solid var(--line);padding:10px 0;margin-bottom:18px;}
.grid2 > div{width:50%;text-align:center;padding:14px 0;}
.grid2 .n{font-size:24px;font-weight:800;color:var(--blue);}
.grid2 .l{font-size:12px;color:var(--sub);margin-top:3px;}
.profile-card{background:linear-gradient(135deg,#1A2A5A,#2F4FA8);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.profile-card .av{font-size:52px;margin-bottom:10px;}
.profile-card .nk{font-size:20px;font-weight:800;}
.type-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,184,77,.16);color:var(--amber);margin-left:6px;font-weight:600;}
.type-badge.blue{background:rgba(79,168,255,.16);color:var(--blue);}
.type-badge.purple{background:rgba(167,139,250,.16);color:#A78BFA;}
.type-badge.green{background:rgba(46,212,122,.16);color:var(--green);}

/* AI 助手 */
.ai-chat{
  display:flex;flex-direction:column;gap:12px;
  padding-bottom:20px;
}
.ai-msg{
  max-width:85%;padding:12px 16px;border-radius:16px;
  font-size:14.5px;line-height:1.7;
  animation:fadeIn .3s ease;
}
.ai-msg.user{align-self:flex-end;background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-bottom-right-radius:4px;}
.ai-msg.bot{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);color:#D0DAF0;border-bottom-left-radius:4px;white-space:pre-wrap;}
.ai-msg.bot b{color:var(--blue);}
.ai-typing{align-self:flex-start;color:var(--sub);font-size:13px;padding:8px 14px;}
.ai-typing::after{content:'...';animation:dots 1.4s infinite;}
@keyframes dots{0%,20%{content:'.';}40%{content:'..';}60%,100%{content:'...';}}
.ai-input-row{
  position:fixed;left:0;right:0;bottom:64px;z-index:15;
  max-width:520px;margin:0 auto;
  display:flex;gap:8px;padding:10px 18px;
  background:rgba(11,16,38,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
.ai-input{
  flex:1;padding:12px 16px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:inherit;outline:none;
}
.ai-input:focus{border-color:var(--blue);}
.ai-send{
  padding:0 20px;border-radius:999px;border:none;
  background:linear-gradient(135deg,#2F7BFF,#4FA8FF);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
}
.ai-quick{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;
}
.ai-quick button{
  font-size:12.5px;padding:7px 14px;border-radius:999px;
  background:var(--bg2);border:1px solid var(--line);
  color:#B8C2DC;cursor:pointer;font-family:inherit;
}
.ai-quick button:active{background:#1D2745;}

@media (max-width:360px){
  body{font-size:14px;}
  .stem{font-size:16px;}
}
</style>
</head>
<body>

<canvas id="starsBg"></canvas>

<div class="app">
  <header class="navbar">
    <button class="back-btn hidden" id="backBtn">←</button>
    <h1 id="navTitle">星赛通</h1>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><span class="ico">🏠</span>首页</button>
    <button data-tab="learn"><span class="ico">📚</span>学习</button>
    <button data-tab="ai"><span class="ico">🤖</span>AI</button>
    <button data-tab="wrong"><span class="ico">📕</span>错题</button>
    <button data-tab="profile"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<script>
/* =========================================================
   0. 全局错误捕获 —— 保证首页不会因为错误而空白
   ========================================================= */
window.addEventListener('error', function(e){
  console.error('[星赛通] 运行错误:', e.message);
  var v = document.getElementById('view');
  if (v && (!v.innerHTML || v.innerHTML.trim() === '')){
    v.innerHTML = '<div class="card"><div class="title">加载出错了</div><div class="sub">' + (e.message || '未知错误') + '</div></div>';
  }
});

/* =========================================================
   1. 动态星空背景（Canvas）
   ========================================================= */
(function(){
  var cvs = document.getElementById('starsBg');
  var ctx = cvs.getContext('2d');
  var stars = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    cvs.width = w * dpr; cvs.height = h * dpr;
    cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    stars = [];
    var n = Math.floor(w * h / 6000);
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        a: Math.random() * 0.7 + 0.2,
        da: (Math.random() - 0.5) * 0.015,
        vx: (Math.random() - 0.5) * 0.06,
        vy: (Math.random() - 0.5) * 0.06
      });
    }
  }
  var t = 0;
  function draw(){
    t += 0.016;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.a += s.da;
      if (s.a < 0.1 || s.a > 0.95) s.da = -s.da;
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
      ctx.globalAlpha = s.a;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize', function(){ resize(); init(); });
})();

/* =========================================================
   2. 工具函数
   ========================================================= */
var $ = function(s){ return document.querySelector(s); };
var LETTERS = ['A','B','C','D','E','F'];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function rate(a, b){ return b ? Math.round(a / b * 100) : 0; }
function fmtTime(sec){
  var m = String(Math.floor(sec / 60)).padStart(2, '0');
  var s = String(sec % 60).padStart(2, '0');
  return m + ':' + s;
}
function normalizeText(s){
  return String(s == null ? '' : s).trim().toLowerCase()
    .replace(/[\s，,。.、；;：:！!？?"'""''（）()]/g, '')
    .replace(/[°º]/g, '度').replace(/[′']/g, '分').replace(/[″"]/g, '秒');
}

/* =========================================================
   3. 本地存储
   ========================================================= */
var KEY = {
  wrong:'astro_wrong_v3',
  record:'astro_record_v3',
  days:'astro_days_v3',
  qstats:'astro_qstats_v3',

var Store = {
  getWrong:function(){
    try { return JSON.parse(localStorage.getItem(KEY.wrong)) || []; } catch(e){ return []; }
  },
  addWrong:function(id){
    var list = this.getWrong();
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
    if (idx >= 0){ list[idx].count += 1; list[idx].lastTime = Date.now(); }
    else list.push({ id: id, count: 1, lastTime: Date.now() });
    localStorage.setItem(KEY.wrong, JSON.stringify(list));
  },
  removeWrong:function(id){
    var list = this.getWrong().filter(function(i){ return i.id !== id; });
    localStorage.setItem(KEY.wrong, JSON.stringify(list));
  },
  clearWrong:function(){ localStorage.removeItem(KEY.wrong); },

  getQStats:function(){
    try { return JSON.parse(localStorage.getItem(KEY.qstats)) || {}; } catch(e){ return {}; }
  },
  bumpQStat:function(id, correct){
    var s = this.getQStats();
    if (!s[id]) s[id] = { t:0, c:0 };
    s[id].t += 1;
    if (correct) s[id].c += 1;
    s[id].last = Date.now();
    localStorage.setItem(KEY.qstats, JSON.stringify(s));
  },

  addRecord:function(rec){
    var list = [];
    try { list = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    list.push(Object.assign({}, rec, { time: Date.now() }));
    if (list.length > 400) list = list.slice(list.length - 400);
    localStorage.setItem(KEY.record, JSON.stringify(list));
    var days = [];
    try { days = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}
    var today = new Date().toDateString();
    if (days.indexOf(today) < 0){ days.push(today); localStorage.setItem(KEY.days, JSON.stringify(days)); }
  },
  getStats:function(){
    var records = [], days = [];
    try { records = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    try { days = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}
    var total = 0, correct = 0;
    records.forEach(function(r){ total += (r.total || 0); correct += (r.correct || 0); });
    return {
      total: total, correct: correct, rate: rate(correct, total),
      sessions: records.length, days: days.length, wrongCount: this.getWrong().length
    };
  },
  clearAll:function(){
    localStorage.removeItem(KEY.wrong);
    localStorage.removeItem(KEY.record);
    localStorage.removeItem(KEY.days);
    localStorage.removeItem(KEY.qstats);
  },

  getAIHistory:function(){
    try { return JSON.parse(localStorage.getItem(KEY.aiHistory)) || []; } catch(e){ return []; }
  },
  saveAIHistory:function(list){
    if (list.length > 40) list = list.slice(list.length - 40);
    localStorage.setItem(KEY.aiHistory, JSON.stringify(list));
  },
  clearAIHistory:function(){ localStorage.removeItem(KEY.aiHistory); }
};

function aiRespond(text){
  var q = String(text || '').toLowerCase();
  var best = null, bestScore = 0;
  AI_KB.forEach(function(item){
    var score = 0;
    item.keys.forEach(function(k){
      if (q.indexOf(k.toLowerCase()) >= 0) score += k.length;
    });
    if (score > bestScore){ bestScore = score; best = item; }
  });
  if (best) return best.a;

  if (q.indexOf('出题') >= 0 || q.indexOf('考考') >= 0){
    var pool = getQuestions(state.level);
    var q1 = pool[Math.floor(Math.random() * pool.length)];
    return '📝 为你随机出一道' + state.level + '组的题目：\n\n【' + typeLabel(q1.type) + '】' + q1.stem +
      (q1.options ? '\n\n' + q1.options.map(function(t, i){ return LETTERS[i] + '. ' + t; }).join('\n') : '') +
      '\n\n（点击底部"练习"标签可进入答题模式）';
  }

  return '我是星赛通 AI 助手，可以回答天文竞赛相关问题。\n\n试试问我：\n· 黑洞是怎么形成的？\n· 如何找到北极星？\n· 日食和月食有什么区别？\n· 望远镜怎么选？\n· 星等是什么意思？\n· 月相变化有什么规律？';
}

/* =========================================================
   8. 题型工具
   ========================================================= */
function isAnswerCorrect(q, ua){
  if (ua === undefined || ua === null) return false;
  if (q.type === 'single' || q.type === 'judge') return ua === q.answer;
  if (q.type === 'multi'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    var a = ua.slice().sort(function(x, y){ return x - y; });
    var b = q.answer.slice().sort(function(x, y){ return x - y; });
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  if (q.type === 'fill'){
    var u = normalizeText(ua);
    if (!u) return false;
    for (var j = 0; j < q.answer.length; j++){
      if (normalizeText(q.answer[j]) === u) return true;
    }
    return false;
  }
  if (q.type === 'order'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    for (var k = 0; k < q.answer.length; k++){
      if (ua[k] !== q.answer[k]) return false;
    }
    return true;
  }
  if (q.type === 'image'){
    return ua === q.answer;
  }
  return false;
}

function isAnswered(q, ua){
  if (q.type === 'multi' || q.type === 'order') return Array.isArray(ua) && ua.length > 0;
  if (q.type === 'fill') return String(ua == null ? '' : ua).trim() !== '';
  return ua !== undefined && ua !== null && ua !== -1;
}

function answerText(q){
  if (q.type === 'single') return LETTERS[q.answer];
  if (q.type === 'judge') return q.answer === 0 ? '正确' : '错误';
  if (q.type === 'multi') return q.answer.map(function(i){ return LETTERS[i]; }).join('、');
  if (q.type === 'fill') return q.answer[0];
  if (q.type === 'image') return LETTERS[q.answer];
  if (q.type === 'order'){
    return q.answer.map(function(i){ return q.options[i]; }).join(' → ');
  }
  return '';
}

function typeLabel(t){
  return { single:'单选', multi:'多选', judge:'判断', fill:'填空', order:'排序', image:'图片' }[t] || '题目';
}
function typeBadgeClass(t){
  return { single:'blue', multi:'purple', judge:'green', fill:'amber', order:'purple', image:'blue' }[t] || '';
}

/* =========================================================
   9. 数据查询
   ========================================================= */
function getQuestions(level, category){
  return QUESTIONS.filter(function(q){
    return (!level || q.level === level) && (!category || q.category === category);
  });
}
function getCategories(level){
  var set = {};
  QUESTIONS.forEach(function(q){ if (q.level === level) set[q.category] = 1; });
  return Object.keys(set);
}
function getKnowledge(level, category){
  for (var i = 0; i < KNOWLEDGE.length; i++){
    if (KNOWLEDGE[i].level === level && KNOWLEDGE[i].category === category) return KNOWLEDGE[i];
  }
  return null;
}
function getDaily(level){
  var pool = getQuestions(level);
  if (!pool.length) return null;
  var day = Math.floor(Date.now() / 86400000);
  return pool[day % pool.length];
}
function getCategoryMastery(level, category){
  var qs = getQuestions(level, category);
  var stats = Store.getQStats();
  var t = 0, c = 0;
  qs.forEach(function(q){
    var s = stats[q.id];
    if (s){ t += s.t; c += s.c; }
  });
  var wrongIds = Store.getWrong().map(function(w){ return w.id; });
  var wrongCount = qs.filter(function(q){ return wrongIds.indexOf(q.id) >= 0; }).length;
  return {
    total: qs.length, answered: t, correct: c,
    rate: t ? Math.round(c / t * 100) : 0, wrongCount: wrongCount
  };
}

function renderQuestionInput(q, ua, showAnswer, clickFn){
  if (q.type === 'fill'){
    var val = esc(ua == null ? '' : ua);
    var html = '<input class="fill-input" id="fillInput" type="text" value="' + val + '" placeholder="请输入答案" ' +
      (showAnswer ? 'disabled' : '') +
      ' oninput="onFillInput(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    if (showAnswer){
      var ok = isAnswerCorrect(q, ua);
      html += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你填写的是：<b style="color:' + (ok ? 'var(--green)' : 'var(--red)') + ';">' + esc(ua || '（空）') + '</b></div>';
    }
    return html;
  }

  if (q.type === 'order'){
    var arr = Array.isArray(ua) ? ua : [];
    var html2 = '<div style="font-size:13px;color:var(--sub);margin-bottom:10px;">点击选项，按正确顺序依次排列</div>';
    q.options.forEach(function(text, i){
      var pos = arr.indexOf(i);
      var taken = pos >= 0;
      var cls = 'option order-item' + (taken ? ' taken' : '');
      var rightCls = '';
      if (showAnswer){
        var isRightPos = q.answer.indexOf(i) === pos;
        cls += isRightPos ? ' right' : ' wrong';
      }
      html2 += '<div class="' + cls + '" onclick="' + clickFn + '(' + i + ')">' +
        (taken ? '<span class="order-num">' + (pos + 1) + '</span>' : '<span class="opt-key">?</span>') +
        '<span class="opt-text">' + esc(text) + '</span></div>';
    });
    if (arr.length > 0 && !showAnswer){
      html2 += '<div style="margin-top:8px;font-size:12px;color:var(--sub);">已排：' + arr.map(function(i){ return q.options[i]; }).join(' → ') + '</div>';
    }
    if (showAnswer){
      html2 += '<div style="margin-top:12px;font-size:13px;color:var(--sub);">你的排序：' + (arr.length ? arr.map(function(i){ return q.options[i]; }).join(' → ') : '（空）') + '</div>';
    }
    return html2;
  }

  var isMulti = q.type === 'multi';
  var arrMulti = Array.isArray(ua) ? ua : [];

  return q.options.map(function(text, i){
    var cls = 'option';
    var isSelected = isMulti ? arrMulti.indexOf(i) >= 0 : (ua === i);
    var isRight = isMulti ? q.answer.indexOf(i) >= 0 : (q.answer === i);
    if (showAnswer){
      if (isRight) cls += ' right';
      else if (isSelected) cls += ' wrong';
      else cls += ' dim';
    } else if (isSelected){
      cls += ' selected';
    }
    var key = q.type === 'judge' ? (i === 0 ? '✓' : '✗') : LETTERS[i];
    return '<div class="' + cls + '" onclick="' + clickFn + '(' + i + ')">' +
      '<span class="opt-key">' + key + '</span>' +
      '<span class="opt-text">' + esc(text) + '</span></div>';
  }).join('');
}

function onFillInput(v){
  var p = state.practice;
  if (!p) return;
  p.userAnswers[p.index] = v;
  var btn = document.querySelector('.footer .btn-main');
  if (btn && !p.showAnswer) btn.disabled = !v.trim();
}

function practiceChoose(i){
  var p = state.practice;
  if (!p || p.showAnswer) return;
  var q = p.list[p.index];

  if (q.type === 'multi'){
    var arr = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(i);
    p.userAnswers[p.index] = arr;
    document.querySelectorAll('.option').forEach(function(n, k){
      n.className = 'option' + (arr.indexOf(k) >= 0 ? ' selected' : '');
    });
    var btn = document.querySelector('.footer .btn-main');
    if (btn) btn.disabled = arr.length === 0;
    return;
  }

  if (q.type === 'order'){
    var arr2 = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    var idx2 = arr2.indexOf(i);
    if (idx2 >= 0){
      arr2.splice(idx2, 1); // 移除
    } else {
      arr2.push(i); // 追加
    }
    p.userAnswers[p.index] = arr2;
    render();
    return;
  }

  p.userAnswers[p.index] = i;
  document.querySelectorAll('.option').forEach(function(n, k){
    n.className = 'option' + (k === i ? ' selected' : '');
  });
  var btn2 = document.querySelector('.footer .btn-main');
  if (btn2) btn2.disabled = false;
}

function practiceSubmit(){
  var p = state.practice;
  if (!p) return;
  var q = p.list[p.index];
  var ua = p.userAnswers[p.index];
  if (!isAnswered(q, ua)) return;

  var ok = isAnswerCorrect(q, ua);
  if (ok) p.correct++;
  else { p.wrong++; Store.addWrong(q.id); }
  Store.bumpQStat(q.id, ok);
  p.showAnswer = true;
  render();
}

function practiceNext(){
  var p = state.practice;
  p.index++;
  p.showAnswer = false;
  render();
}

function practiceFinish(){
  var p = state.practice;
  var total = p.list.length;
  var correct = p.correct;
  Store.addRecord({ mode: 'practice', total: total, correct: correct });

  var msg = '共 ' + total + ' 题\n答对 ' + correct + ' 题\n正确率 ' + rate(correct, total) + '%\n\n点击「确定」再来一组，点击「取消」返回';
  if (confirm(msg)){
    var list = shuffle(p.list);
    state.practice = {
      list: list, index: 0,
      userAnswers: new Array(list.length).fill(null),
      showAnswer: false, correct: 0, wrong: 0,
      level: p.level, label: p.label, orderBuffer: []
    };
    render();
  } else {
    go('home');
  }
}

var EXAM_COUNT = 20;
var EXAM_MINUTES = 20;

function startExam(level){
  var pool = getQuestions(level);
  if (!pool.length){ alert('题库为空'); return; }
  var list = shuffle(pool).slice(0, Math.min(EXAM_COUNT, pool.length));
  state.exam = {
    list: list, index: 0,
    answers: new Array(list.length).fill(null),
    remain: EXAM_MINUTES * 60,
    total: EXAM_MINUTES * 60,
    showCard: false, running: true
  };
  go('exam');
}

function renderExam(){
  var e = state.exam;
  if (!e) return '<div class="empty"><div class="ico">😕</div><div class="txt">数据丢失</div></div>';

  var q = e.list[e.index];
  var ua = e.answers[e.index];
  var answered = e.answers.filter(function(a, i){ return isAnswered(e.list[i], a); }).length;

  var html = '';
  html += '<div class="topbar">' +
    '<div class="timer" id="timerText">' + fmtTime(e.remain) + '</div>' +
    '<div class="counter">已答 ' + answered + ' / ' + e.list.length + '</div>' +
    '<button class="card-btn" onclick="toggleCard()">答题卡</button>' +
    '</div>';
  html += '<div class="progress"><i style="width:' + rate(e.index + 1, e.list.length) + '%;"></i></div>';

  html += '<div class="card">' +
    '<div class="tags">' +
    '<span class="tag">' + esc(q.level) + '</span>' +
    '<span class="tag">' + esc(q.category) + '</span>' +
    '<span class="tag">' + typeLabel(q.type) + '</span>' +
    '<span class="tag">第 ' + (e.index + 1) + ' 题</span>' +
    '</div>';

  if (q.type === 'image' && q.image && SVG[q.image]){
    html += '<div class="q-image">' + SVG[q.image] + '</div>';

    '</div>';

  if (e.showCard){
    html += '<div class="mask" onclick="toggleCard()"></div>' +
      '<div class="sheet show"><h3>答题卡</h3><div class="sheet-grid">';
    e.list.forEach(function(qq, i){
      html += '<div class="sheet-item ' + (isAnswered(qq, e.answers[i]) ? 'done' : '') + ' ' + (i === e.index ? 'active' : '') + '" onclick="examJump(' + i + ')">' + (i + 1) + '</div>';
    });
    html += '</div><div class="sheet-tip">蓝色 = 已作答　灰色 = 未作答</div></div>';
  }

  return html;
}

function startExamTimer(){
  var t = setInterval(function(){
    if (!state.exam || state.page !== 'exam'){ clearInterval(t); return; }
    state.exam.remain--;
    if (state.exam.remain <= 0){
      state.exam.remain = 0;
      updateTimerText();
      clearInterval(t);
      state.exam.running = false;
      alert('时间到，自动交卷！');
      submitExam();
      return;
    }
    updateTimerText();
  }, 1000);
  timers.push(t);
}

function updateTimerText(){
  var el = document.getElementById('timerText');
  if (el && state.exam){
    el.textContent = fmtTime(state.exam.remain);
    el.style.color = state.exam.remain <= 60 ? 'var(--red)' : 'var(--blue)';
  }
}

function examChoose(i){
  var e = state.exam;
  if (!e) return;
  var q = e.list[e.index];

  if (q.type === 'multi'){
    var arr = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(i);
    e.answers[e.index] = arr;
    document.querySelectorAll('.option').forEach(function(n, k){
      n.className = 'option' + (arr.indexOf(k) >= 0 ? ' selected' : '');
    });
  } else if (q.type === 'order'){
    var arr2 = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    var idx2 = arr2.indexOf(i);
    if (idx2 >= 0) arr2.splice(idx2, 1); else arr2.push(i);
    e.answers[e.index] = arr2;
    render();
    return;
  } else {
    e.answers[e.index] = i;
    document.querySelectorAll('.option').forEach(function(n, k){
      n.className = 'option' + (k === i ? ' selected' : '');
    });
  }

  var counter = document.querySelector('.topbar .counter');
  if (counter){
    var answered = e.answers.filter(function(a, k){ return isAnswered(e.list[k], a); }).length;
    counter.textContent = '已答 ' + answered + ' / ' + e.list.length;

function onFillInputExam(v){
  var e = state.exam;
  if (!e) return;
  e.answers[e.index] = v;
  var counter = document.querySelector('.topbar .counter');
  if (counter){
    var answered = e.answers.filter(function(a, k){ return isAnswered(e.list[k], a); }).length;
    counter.textContent = '已答 ' + answered + ' / ' + e.list.length;
  }
}

function examPrev(){ var e = state.exam; if (e.index === 0) return; e.index--; render(); }
function examNext(){ var e = state.exam; if (e.index >= e.list.length - 1) return; e.index++; render(); }
function examJump(i){ state.exam.index = i; state.exam.showCard = false; render(); }
function toggleCard(){ state.exam.showCard = !state.exam.showCard; render(); }

function examConfirmSubmit(){
  var e = state.exam;
  var unanswered = e.list.filter(function(q, i){ return !isAnswered(q, e.answers[i]); }).length;
  var msg = unanswered > 0 ? '还有 ' + unanswered + ' 题未作答，确定交卷吗？' : '确定交卷吗？';
  if (confirm(msg)) submitExam();
}

function submitExam(){
  var e = state.exam;
  if (!e) return;
  clearTimers();
  e.running = false;

  var score = 0, right = 0, wrong = 0, blank = 0;
  var details = [];

  e.list.forEach(function(q, i){
    var ua = e.answers[i];
    var ok = isAnswerCorrect(q, ua);
    var done = isAnswered(q, ua);
    if (!done) blank++;
    else if (ok){ right++; score += 2; }
    else { wrong++; score -= 1; Store.addWrong(q.id); }
    Store.bumpQStat(q.id, ok && done);
    details.push({
      id: q.id, type: q.type, stem: q.stem,
      options: q.options || null, image: q.image || null,
      your: ua, correct: q.answer,
      explanation: q.explanation,
      isCorrect: ok, isBlank: !done
    });
  });

  var result = {
    level: e.list[0].level, total: e.list.length,
    score: score, fullScore: e.list.length * 2,
    right: right, wrong: wrong, blank: blank,
    rate: rate(right, e.list.length),
    used: e.total - e.remain,
    details: details
  };

  Store.addRecord({ mode: 'exam', total: e.list.length, correct: right });
  state.result = result;
  state.exam = null;
  go('result');
}

function renderWrong(){
  var wrongIds = Store.getWrong();
  if (!wrongIds.length){
    return '<div class="title">错题归纳</div><div class="sub" style="margin-bottom:20px;">按知识点归纳，支持再提问</div>' +
      '<div class="empty"><div class="ico">✨</div><div class="txt">还没有错题，继续保持！</div></div>';
  }

  var groups = {};
  wrongIds.forEach(function(w){
    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === w.id){ q = QUESTIONS[i]; break; }
    if (!q) return;
    var key = q.level + '|' + q.category;
    if (!groups[key]) groups[key] = { level: q.level, category: q.category, items: [] };
    groups[key].items.push({ q: q, count: w.count, lastTime: w.lastTime });
  });

  var groupList = Object.keys(groups).map(function(k){ return groups[k]; });
  groupList.sort(function(a, b){ return b.items.length - a.items.length; });

  var html = '';
  html += '<div class="title">错题归纳</div>';
  html += '<div class="sub" style="margin-bottom:16px;">共 ' + wrongIds.length + ' 道错题，分布在 ' + groupList.length + ' 个知识点</div>';
  html += '<div class="card" style="background:linear-gradient(135deg,rgba(255,184,77,.10),rgba(255,91,91,.08));border-color:rgba(255,184,77,.25);">' +
    '<div style="font-size:13px;line-height:1.8;color:#C8D2E8;">💡 <b style="color:var(--amber);">再提问</b>：点开知识点，点击「再提问」按钮，系统会从该知识点重新抽题，优先抽取你答错过的题。</div></div>';

  groupList.forEach(function(g){
    var key = g.level + '|' + g.category;
    var expanded = !!state.expandedGroups[key];
    var k = getKnowledge(g.level, g.category);
    var icon = k ? k.icon : '📖';

    html += '<div class="group-head" onclick="toggleGroup(\'' + esc(key).replace(/'/g, "\\'") + '\')">' +
      '<div class="gh-l">' +
      '<div class="learn-ico" style="width:36px;height:36px;font-size:18px;">' + icon + '</div>' +
      '<div><div class="gn">' + esc(g.category) + '</div>' +
      '<div class="gc">' + esc(g.level) + ' · ' + g.items.length + ' 道错题</div></div>' +
      '</div>' +
      '<div style="color:var(--sub);font-size:18px;">' + (expanded ? '▾' : '▸') + '</div>' +
      '</div>';

    if (expanded){
      html += '<div class="group-body">';
      g.items.forEach(function(it){
        html += '<div class="card" style="padding:15px;">';
        html += '<div class="tags">' +
          '<span class="tag amber">' + typeLabel(it.q.type) + '</span>' +
          '<span class="tag err">错 ' + it.count + ' 次</span></div>';
        if (it.q.image && SVG[it.q.image]){
          html += '<div class="q-image">' + SVG[it.q.image] + '</div>';
        }
        html += '<div class="q-stem" style="font-size:14.5px;">' + esc(it.q.stem) + '</div>';
        html += '<div class="q-line">';
        if (it.q.type === 'fill'){
          html += '<span class="ok">正确答案：' + esc(answerText(it.q)) + '</span>';
        } else if (it.q.type === 'order'){
          html += '<span class="ok">正确顺序：' + it.q.answer.map(function(i){ return it.q.options[i]; }).join(' → ') + '</span>';
        } else if (it.q.options){
          it.q.options.forEach(function(t, i){
            var isRight = Array.isArray(it.q.answer) ? it.q.answer.indexOf(i) >= 0 : it.q.answer === i;
            html += '<span class="' + (isRight ? 'ok' : '') + '">' + LETTERS[i] + '. ' + esc(t) + '</span><br>';
          });
        }
        html += '</div>';
        html += '<div class="q-exp">' + esc(it.q.explanation) + '</div>';
        html += '<div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">' +

        html += '</div>';
      });
      html += '<button class="btn btn-amber" style="margin-bottom:16px;" onclick="reAsk(\'' + esc(g.level) + '\',\'' + esc(g.category).replace(/'/g, "\\'") + '\')">🔁 针对「' + esc(g.category) + '」再提问</button>';
      html += '</div>';
    }
  });

  html += '<button class="btn btn-ghost" style="margin:10px 0 40px;" onclick="clearWrong()">清空错题本</button>';
  return html;
}

function toggleGroup(key){
  state.expandedGroups[key] = !state.expandedGroups[key];
  render();
}

function reAsk(level, category){
  var pool = getQuestions(level, category);
  if (!pool.length){ alert('该知识点暂无题目'); return; }

  var wrongIds = Store.getWrong().map(function(w){ return w.id; });
  var wrongOnes = pool.filter(function(q){ return wrongIds.indexOf(q.id) >= 0; });
  var others = pool.filter(function(q){ return wrongIds.indexOf(q.id) < 0; });

  var picked = shuffle(wrongOnes);
  if (picked.length < 5){
    picked = picked.concat(shuffle(others).slice(0, 5 - picked.length));
  }
  picked = shuffle(picked).slice(0, Math.min(6, pool.length));

  var ok = confirm('针对「' + category + '」再提问\n\n本次共 ' + picked.length + ' 题\n（优先抽取你答错过的题目）\n\n点击「确定」开始练习');
  if (!ok) return;

  startPracticeWithList(picked, level, category + ' · 强化练习');
}

function removeWrong(id){
  if (!confirm('确定从错题本移除这道题吗？')) return;
  Store.removeWrong(id);
  render();
}
function clearWrong(){
  if (!confirm('所有错题记录将被删除，不可恢复。确定吗？')) return;
  Store.clearWrong();
  render();
}

function aiAsk(text){
  var input = document.getElementById('aiInput');
  if (input) input.value = text;
  aiSend();
}

function aiSend(){
  var input = document.getElementById('aiInput');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';

  state.aiMessages.push({ role: 'user', text: text });
  state.aiTyping = true;
  render();

  setTimeout(function(){
    var reply = aiRespond(text);
    state.aiMessages.push({ role: 'bot', text: reply });
    state.aiTyping = false;
    Store.saveAIHistory(state.aiMessages);
    render();
  }, 400 + Math.random() * 400);
}

/* =========================================================
   20. 我的
   ========================================================= */
function renderProfile(){
  var s = Store.getStats();
  var cats = getCategories(state.level);

  var weakest = null;
  cats.forEach(function(c){
    var m = getCategoryMastery(state.level, c);
    if (m.answered >= 3){
      if (!weakest || m.rate < weakest.rate) weakest = { category: c, rate: m.rate };
    }
  });

  var html = '';
  html += '<div class="profile-card">' +
    '<div class="av">🔭</div>' +
    '<div class="nk">天文小达人</div>' +
    '<div class="sub" style="margin-top:6px;">坚持每天学一点，竞赛更从容</div>' +
    '</div>';

  html += '<div class="grid2">' +
    '<div><div class="n">' + s.total + '</div><div class="l">累计答题</div></div>' +
    '<div><div class="n">' + s.rate + '%</div><div class="l">正确率</div></div>' +
    '<div><div class="n">' + s.days + '</div><div class="l">学习天数</div></div>' +
    '<div><div class="n">' + s.wrongCount + '</div><div class="l">错题数</div></div>' +
    '</div>';

  if (weakest){
    html += '<div class="card" style="background:linear-gradient(135deg,rgba(255,184,77,.12),rgba(255,91,91,.08));border-color:rgba(255,184,77,.25);">' +
      '<div style="font-size:13px;color:var(--sub);margin-bottom:6px;">📌 薄弱知识点</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-size:17px;font-weight:700;">' + esc(weakest.category) + '</div>' +
      '<div style="font-size:20px;font-weight:800;color:var(--red);">' + weakest.rate + '%</div></div>' +
      '<button class="btn btn-amber" style="margin-top:14px;" onclick="reAsk(\'' + esc(state.level) + '\',\'' + esc(weakest.category).replace(/'/g, "\\'") + '\')">立即强化练习</button>' +
      '</div>';
  }

  html += '<div class="card" style="padding:0;">' +
    '<div class="row-item" onclick="go(\'learn\')"><span>📚 知识点学习</span><span class="arrow">' + cats.length + ' 个 ›</span></div>' +
    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="go(\'ai\')"><span>🤖 AI 天文助手</span><span class="arrow">›</span></div>' +
    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="go(\'wrong\')"><span>📕 错题归纳</span><span class="arrow">' + s.wrongCount + ' 道 ›</span></div>' +
    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="go(\'home\')"><span>🏠 返回首页</span><span class="arrow">›</span></div>' +
    '</div>';

  html += '<div class="card" style="padding:0;">' +
    '<div class="row-item" onclick="clearAIHistory()"><span style="color:var(--sub);">🧹 清除 AI 对话记录</span><span class="arrow">›</span></div>' +
    '<div style="height:1px;background:var(--line);margin:0 18px;"></div>' +
    '<div class="row-item" onclick="clearAllData()"><span style="color:var(--red);">🗑 清除所有数据</span><span class="arrow">›</span></div>' +
    '</div>';

  html += '<div class="version">星赛通 v3.0 · 网页版<br>' +
    '题库 ' + QUESTIONS.length + ' 题（小学 ' + QUESTIONS.filter(function(q){ return q.level === '小学'; }).length +
    ' · 初中 ' + QUESTIONS.filter(function(q){ return q.level === '初中'; }).length + '）<br>' +
    '知识卡 ' + KNOWLEDGE.length + ' 张 · 六种题型</div>';

  return html;
}

function clearAIHistory(){
  if (!confirm('清除所有 AI 对话记录？')) return;
  Store.clearAIHistory();
  state.aiMessages = [];
  render();
  alert('已清除');
}

function clearAllData(){
  if (!confirm('错题本、答题记录、学习统计、AI 对话都会被清空，不可恢复。确定吗？')) return;
  Store.clearAll();
  state.aiMessages = [];
  render();
  alert('已清除');
}

/* =========================================================
   21. 事件绑定
   ========================================================= */
backBtn.addEventListener('click', function(){
  if (state.page === 'result') return go('home');
  if (state.page === 'learnDetail') return go('learn');
  if (state.page === 'practice' || state.page === 'exam'){
    if (state.page === 'exam' && state.exam){
      if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
      clearTimers();
      state.exam = null;
    }
    return go('home');
  }
  go('home');
});

tabbar.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  var tab = btn.dataset.tab;
  if (!tab || tab === state.page) return;
  if (state.page === 'exam' && state.exam){
    if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
    clearTimers();
    state.exam = null;
  }
  go(tab);
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  var isInput = tag === 'input' || tag === 'textarea';

  if (state.page === 'practice'){
    var p = state.practice;
    if (!p) return;
    var q = p.list[p.index];
    if (!isInput && !p.showAnswer && q.type !== 'fill'){
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length){
        practiceChoose(n - 1);
        e.preventDefault();
      }
    }
    if (e.key === 'Enter'){
      if (!p.showAnswer && isAnswered(q, p.userAnswers[p.index])) { practiceSubmit(); e.preventDefault(); }
      else if (p.showAnswer && p.index < p.list.length - 1){ practiceNext(); e.preventDefault(); }
    }
  }

  if (state.page === 'exam'){
    var ex = state.exam;
    if (!ex) return;
    var q2 = ex.list[ex.index];
    if (!isInput && q2.type !== 'fill'){
      var n2 = parseInt(e.key, 10);
      if (n2 >= 1 && n2 <= q2.options.length){
        examChoose(n2 - 1);
        e.preventDefault();
      }
    }
    if (!isInput && e.key === 'ArrowLeft') examPrev();
    if (!isInput && e.key === 'ArrowRight') examNext();
  }
});

/* =========================================================
   22. 启动
   ========================================================= */
try {
  render();
} catch(err){
  console.error('初始化失败:', err);
  view.innerHTML = '<div class="card"><div class="title">加载出错了</div><div class="sub">' + esc(err.message) + '</div></div>';
}
</script>
