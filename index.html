<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星赛通 · 天文知识竞赛</title>
<style>
:root{
  --bg:#0B1026; --bg2:#141C36; --bg3:#0F1730;
  --line:#1F2A4A; --text:#E8ECF7; --sub:#8A93B8;
  --blue:#4FA8FF; --blue-d:#2F7BFF;
  --green:#2ED47A; --red:#FF5B5B; --purple:#7B4FE0;
  --amber:#FFB84D; --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5; overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out;}
@keyframes tw{0%,100%{opacity:.15;}50%{opacity:.9;}}

.app{
  position:relative; z-index:1;
  max-width:520px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column;
  background:rgba(11,16,38,.72);
}
.navbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:14px 18px;
  background:rgba(11,16,38,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.navbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;flex:1;}
.back-btn{background:none;border:none;color:var(--blue);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;}
.view{flex:1;padding:18px 18px 90px;}
.hidden{display:none !important;}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:520px; margin:0 auto; display:flex;
  background:rgba(18,26,51,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1; background:none; border:none; cursor:pointer;
  padding:10px 0 12px; color:var(--sub);
  font-size:12px; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:color .2s;
}
.tabbar button .ico{font-size:19px;line-height:1;}
.tabbar button.active{color:var(--blue);}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.title{font-size:22px;font-weight:800;margin:0 0 6px;}
.sub{color:var(--sub);font-size:13px;}
.sec-title{font-size:16px;font-weight:700;margin:24px 0 12px;}

.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s,opacity .2s;}
.btn:active{transform:scale(.97);}
.btn-main{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}
.btn-ghost{background:transparent;color:var(--blue);border:1px solid var(--blue-d);}
.btn-amber{background:linear-gradient(135deg,#E08A1E,#FFB84D);color:#fff;}
.btn-sm{padding:9px 16px;font-size:14px;width:auto;border-radius:999px;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:12px;}
.btn-row .btn{flex:1;}

.tag{display:inline-block;font-size:12px;color:var(--blue);background:rgba(79,168,255,.12);padding:2px 10px;border-radius:20px;margin-right:6px;}
.tag.err{color:var(--red);background:rgba(255,91,91,.12);}
.tag.ok{color:var(--green);background:rgba(46,212,122,.12);}
.tag.amber{color:var(--amber);background:rgba(255,184,77,.14);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}

.hero{padding:6px 0 18px;}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#8FB4FF,#4FA8FF 60%,#A78BFA);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.level-switch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;}
.level-switch button{flex:1;padding:11px 0;border:none;background:none;cursor:pointer;border-radius:999px;color:var(--sub);font-size:15px;font-family:inherit;font-weight:600;transition:.2s;}
.level-switch button.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;}

.entry-row{display:flex;gap:12px;margin-bottom:6px;}
.entry-card{flex:1;border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;transition:transform .15s;border:none;font-family:inherit;color:#fff;}
.entry-card:active{transform:scale(.97);}
.entry-card.blue{background:linear-gradient(135deg,#1E4FA8,#2F7BFF);}
.entry-card.purple{background:linear-gradient(135deg,#4A2D8F,#7B4FE0);}
.entry-card .ico{font-size:28px;display:block;margin-bottom:8px;}
.entry-card .t{font-size:16px;font-weight:700;}
.entry-card .s{font-size:12px;opacity:.8;margin-top:3px;}

.chip-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.chip{padding:8px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:#B8C2DC;font-size:14px;font-family:inherit;transition:.2s;}
.chip:active{background:#1D2745;}

.daily-stem{font-size:16px;line-height:1.6;margin:4px 0 12px;font-weight:500;}
.opt-line{color:#B8C2DC;font-size:14px;line-height:2;}
.answer-hint{margin-top:12px;color:var(--blue);font-size:14px;font-weight:600;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.counter{font-size:13px;color:var(--sub);}
.counter .ok{color:var(--green);}
.counter .no{color:var(--red);}
.progress{height:5px;background:#1A2340;border-radius:5px;overflow:hidden;margin-bottom:18px;}
.progress > i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#2F7BFF,#4FA8FF);transition:width .3s;}

.stem{font-size:17px;line-height:1.65;margin:4px 0 20px;font-weight:500;}

.option{display:flex;align-items:center;padding:14px 15px;margin-bottom:10px;background:var(--bg3);border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:all .18s;}
.option:active{transform:scale(.99);}
.option.selected{border-color:var(--blue);background:rgba(79,168,255,.12);}
.option.right{border-color:var(--green);background:rgba(46,212,122,.12);}
.option.wrong{border-color:var(--red);background:rgba(255,91,91,.12);}
.option.dim{opacity:.45;}
.opt-key{width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--line);font-size:13px;font-weight:700;margin-right:12px;flex-shrink:0;}
.option.selected .opt-key{background:var(--blue);color:#0B1026;}
.option.right .opt-key{background:var(--green);color:#0B1026;}
.option.wrong .opt-key{background:var(--red);color:#fff;}
.opt-text{flex:1;font-size:15px;line-height:1.5;}

.fill-input{
  width:100%;padding:15px 16px;border-radius:14px;
  background:var(--bg3);border:2px solid var(--line);
  color:var(--text);font-size:16px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.fill-input:focus{border-color:var(--blue);}
.fill-input:disabled{opacity:.7;}

.explain{background:var(--bg2);border-left:4px solid var(--blue);border-radius:12px;padding:16px;margin-top:16px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.explain .head{font-size:16px;font-weight:700;margin-bottom:8px;}
.explain .head.ok{color:var(--green);}
.explain .head.no{color:var(--red);}
.explain .line{font-size:14px;line-height:1.75;color:#B8C2DC;margin-bottom:5px;}

.footer{margin-top:22px;}

.timer{font-size:19px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;}
.card-btn{font-size:12px;color:var(--blue);border:1px solid var(--blue-d);padding:4px 12px;border-radius:999px;background:none;cursor:pointer;font-family:inherit;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px 36px;transform:translateY(110%);transition:transform .28s ease;max-height:70vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet h3{margin:0 0 16px;font-size:17px;}
.sheet-grid{display:flex;flex-wrap:wrap;gap:10px;}
.sheet-item{width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;background:var(--line);color:var(--sub);font-size:14px;cursor:pointer;transition:.15s;}
.sheet-item.done{background:rgba(79,168,255,.2);color:var(--blue);font-weight:700;}
.sheet-item.active{outline:2px solid var(--blue);color:#fff;}
.sheet-tip{margin-top:18px;font-size:12px;color:#5C6688;}

.score-card{background:linear-gradient(135deg,#1E4FA8,#2F7BFF 60%,#4FA8FF);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.score-card .lb{font-size:13px;opacity:.85;}
.score-card .num{font-size:60px;font-weight:900;line-height:1.15;}
.score-card .full{font-size:13px;opacity:.8;}
.score-card .rate{display:inline-block;margin-top:12px;font-size:13px;padding:5px 16px;background:rgba(255,255,255,.18);border-radius:999px;}
.stat-row{display:flex;background:var(--bg2);border-radius:var(--r);padding:18px 0;margin-bottom:22px;border:1px solid var(--line);}
.stat-row > div{flex:1;text-align:center;}
.stat-row .n{font-size:24px;font-weight:800;}
.stat-row .n.ok{color:var(--green);}
.stat-row .n.no{color:var(--red);}
.stat-row .n.gray{color:var(--sub);}
.stat-row .l{font-size:12px;color:var(--sub);margin-top:2px;}

.q-stem{font-size:15px;line-height:1.6;margin-bottom:12px;font-weight:500;}
.q-line{font-size:13.5px;line-height:1.95;color:#B8C2DC;}
.q-line .ok{color:var(--green);font-weight:700;}
.q-line .no{color:var(--red);text-decoration:line-through;}
.q-exp{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.75;}

.filter-bar{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-item{flex-shrink:0;padding:7px 16px;border-radius:999px;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:var(--sub);font-size:13.5px;font-family:inherit;transition:.2s;white-space:nowrap;}
.filter-item.active{background:linear-gradient(135deg,#2F7BFF,#4FA8FF);color:#fff;border-color:transparent;}
.k-title{font-size:16.5px;font-weight:700;margin-bottom:8px;}
.k-preview{font-size:13.5px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.k-content{font-size:15.5px;line-height:2;color:#C8D2E8;white-space:pre-wrap;}

/* 学习模块 */
.learn-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:.2s;}
.learn-card:active{transform:scale(.985);}
.learn-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.learn-ico{width:40px;height:40px;border-radius:12px;background:rgba(79,168,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.learn-name{font-size:16px;font-weight:700;flex:1;}
.learn-meta{font-size:12px;color:var(--sub);}
.mastery-bar{height:6px;background:#1A2340;border-radius:6px;overflow:hidden;margin:10px 0 6px;}
.mastery-bar > i{display:block;height:100%;border-radius:6px;transition:width .3s;}
.mastery-info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);}

.study-box{background:linear-gradient(135deg,rgba(47,123,255,.10),rgba(123,79,224,.10));border:1px solid rgba(79,168,255,.25);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.study-box .st{font-size:15px;font-weight:700;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* 错题分组 */
.group-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:10px;}
.group-head .gh-l{display:flex;align-items:center;gap:10px;}
.group-head .gn{font-size:15.5px;font-weight:700;}
.group-head .gc{font-size:12px;color:var(--sub);}
.group-body{margin:-4px 0 14px;padding:0 4px;}

.row-item{display:flex;justify-content:space-between;align-items:center;font-size:15px;cursor:pointer;}
.row-item .arrow{color:#5C6688;font-size:14px;}

.empty{text-align:center;padding:70px 0;}
.empty .ico{font-size:48px;margin-bottom:14px;}
.empty .txt{color:var(--sub);font-size:14px;}

.version{text-align:center;color:#3E4767;font-size:12px;margin:34px 0 10px;}

.grid2{display:flex;flex-wrap:wrap;background:var(--bg2);border-radius:var(--r);border:1px solid var(--line);padding:10px 0;margin-bottom:18px;}
.grid2 > div{width:50%;text-align:center;padding:14px 0;}
.grid2 .n{font-size:24px;font-weight:800;color:var(--blue);}
.grid2 .l{font-size:12px;color:var(--sub);margin-top:3px;}

.profile-card{background:linear-gradient(135deg,#1A2A5A,#2F4FA8);border-radius:22px;padding:32px 20px;text-align:center;margin-bottom:18px;}
.profile-card .av{font-size:52px;margin-bottom:10px;}
.profile-card .nk{font-size:20px;font-weight:800;}

.type-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,184,77,.16);color:var(--amber);margin-left:6px;font-weight:600;}

@media (max-width:360px){
  body{font-size:14px;}
  .stem{font-size:16px;}
}
</style>
</head>
<body>

<div id="stars"></div>

<div class="app">
  <header class="navbar">
    <button class="back-btn hidden" id="backBtn">←</button>
    <h1 id="navTitle">星赛通</h1>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><span class="ico">🏠</span>首页</button>
    <button data-tab="learn"><span class="ico">📚</span>学习</button>
    <button data-tab="wrong"><span class="ico">📕</span>错题</button>
    <button data-tab="profile"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<script>
/* =========================================================
   1. 星空背景
   ========================================================= */
(function(){
  const box = document.getElementById('stars');
  let html = '';
  for (let i = 0; i < 90; i++){
    const size = Math.random() * 2 + 0.6;
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const delay = (Math.random() * 3).toFixed(2);
    const dur = (2 + Math.random() * 3).toFixed(2);
    html += `<i class="star" style="width:${size}px;height:${size}px;left:${x}%;top:${y}%;animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  }
  box.innerHTML = html;
})();

/* =========================================================
   2. 工具
   ========================================================= */
const $ = s => document.querySelector(s);
const LETTERS = ['A','B','C','D','E','F'];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rate(a, b){ return b ? Math.round(a / b * 100) : 0; }
function fmtTime(sec){
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return m + ':' + s;
}
function normalizeText(s){
  return String(s == null ? '' : s)
    .trim().toLowerCase()
    .replace(/[\s，,。.、；;：:！!？?"'“”‘’（）()]/g, '')
    .replace(/[°º]/g, '度')
    .replace(/[′']/g, '分')
    .replace(/[″"]/g, '秒');
}

/* =========================================================
   3. 存储
   ========================================================= */
const KEY = {
  wrong:'astro_wrong2',
  record:'astro_record2',
  days:'astro_days2',
  qstats:'astro_qstats2'
};

const Store = {
  /* --- 错题 --- */
  getWrong(){
    try { return JSON.parse(localStorage.getItem(KEY.wrong)) || []; } catch(e){ return []; }
  },
  addWrong(id){
    const list = this.getWrong();
    const idx = list.findIndex(i => i.id === id);
    if (idx >= 0){
      list[idx].count += 1;
      list[idx].lastTime = Date.now();
    } else {
      list.push({ id, count: 1, lastTime: Date.now() });
    }
    localStorage.setItem(KEY.wrong, JSON.stringify(list));
  },
  removeWrong(id){
    const list = this.getWrong().filter(i => i.id !== id);
    localStorage.setItem(KEY.wrong, JSON.stringify(list));
  },
  clearWrong(){ localStorage.removeItem(KEY.wrong); },

  /* --- 单题作答统计 --- */
  getQStats(){
    try { return JSON.parse(localStorage.getItem(KEY.qstats)) || {}; } catch(e){ return {}; }
  },
  bumpQStat(id, correct){
    const s = this.getQStats();
    if (!s[id]) s[id] = { t: 0, c: 0 };
    s[id].t += 1;
    if (correct) s[id].c += 1;
    s[id].last = Date.now();
    localStorage.setItem(KEY.qstats, JSON.stringify(s));
  },

  /* --- 答题记录 --- */
  addRecord(rec){
    let list = [];
    try { list = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    list.push(Object.assign({}, rec, { time: Date.now() }));
    if (list.length > 400) list = list.slice(list.length - 400);
    localStorage.setItem(KEY.record, JSON.stringify(list));

    let days = [];
    try { days = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}
    const today = new Date().toDateString();
    if (!days.includes(today)){
      days.push(today);
      localStorage.setItem(KEY.days, JSON.stringify(days));
    }
  },

  getStats(){
    let records = [], days = [];
    try { records = JSON.parse(localStorage.getItem(KEY.record)) || []; } catch(e){}
    try { days = JSON.parse(localStorage.getItem(KEY.days)) || []; } catch(e){}

    let total = 0, correct = 0;
    records.forEach(r => { total += (r.total || 0); correct += (r.correct || 0); });

    return {
      total, correct,
      rate: rate(correct, total),
      sessions: records.length,
      days: days.length,
      wrongCount: this.getWrong().length
    };
  },

  clearAll(){
    localStorage.removeItem(KEY.wrong);
    localStorage.removeItem(KEY.record);
    localStorage.removeItem(KEY.days);
    localStorage.removeItem(KEY.qstats);
  }
};

/* =========================================================
   4. 题库（四种题型：single / multi / judge / fill）
   ========================================================= */
const QUESTIONS = [
/* ==================== 小学组 ==================== */
/* --- 太阳系 --- */
{ id:'p01', level:'小学', category:'太阳系', type:'single',
  stem:'太阳系中体积最大的行星是？',
  options:['地球','木星','土星','火星'], answer:1,
  explanation:'木星是太阳系中体积和质量最大的行星，质量约为其他七大行星总和的2.5倍。' },
{ id:'p02', level:'小学', category:'太阳系', type:'single',
  stem:'距离太阳最近的行星是？',
  options:['水星','金星','地球','火星'], answer:0,
  explanation:'水星是太阳系中距离太阳最近的行星，公转周期仅约88天。' },
{ id:'p03', level:'小学', category:'太阳系', type:'single',
  stem:'下列哪个不属于行星？',
  options:['月球','火星','土星','海王星'], answer:0,
  explanation:'月球是地球的天然卫星，不是行星。' },
{ id:'p04', level:'小学', category:'太阳系', type:'judge',
  stem:'土星拥有太阳系中最壮观的行星环系统。', answer:0,
  explanation:'正确。土星环由无数冰粒和岩石碎块组成，是太阳系中最壮观的行星环。' },
{ id:'p05', level:'小学', category:'太阳系', type:'multi',
  stem:'下列属于类地行星的有哪些？（多选）',
  options:['水星','金星','木星','地球'], answer:[0,1,3],
  explanation:'类地行星以岩石为主，包括水星、金星、地球、火星。木星是气态巨行星。' },
{ id:'p06', level:'小学', category:'太阳系', type:'fill',
  stem:'八大行星中体积和质量最大的是______。', answer:['木星'],

/* =========================================================
   6. 题型工具函数
   ========================================================= */
function isAnswerCorrect(q, ua){
  if (ua === undefined || ua === null) return false;
  if (q.type === 'single' || q.type === 'judge') return ua === q.answer;
  if (q.type === 'multi'){
    if (!Array.isArray(ua) || ua.length !== q.answer.length) return false;
    const a = ua.slice().sort((x, y) => x - y);
    const b = q.answer.slice().sort((x, y) => x - y);
    return a.every((v, i) => v === b[i]);
  }
  if (q.type === 'fill'){
    const u = normalizeText(ua);
    if (!u) return false;
    return q.answer.some(a => normalizeText(a) === u);
  }
  return false;
}

function isAnswered(q, ua){
  if (q.type === 'multi') return Array.isArray(ua) && ua.length > 0;
  if (q.type === 'fill') return String(ua == null ? '' : ua).trim() !== '';
  return ua !== undefined && ua !== null && ua !== -1;
}

function answerText(q){
  if (q.type === 'single') return LETTERS[q.answer];
  if (q.type === 'judge') return q.answer === 0 ? '正确' : '错误';
  if (q.type === 'multi') return q.answer.map(i => LETTERS[i]).join('、');
  if (q.type === 'fill') return q.answer[0];
  return '';
}

function typeLabel(t){
  return { single:'单选', multi:'多选', judge:'判断', fill:'填空' }[t] || '题目';
}

/* =========================================================
   7. 数据查询
   ========================================================= */
function getQuestions(level, category){
  return QUESTIONS.filter(q =>
    (!level || q.level === level) &&
    (!category || q.category === category)
  );
}
function getCategories(level){
  return [...new Set(QUESTIONS.filter(q => q.level === level).map(q => q.category))];
}
function getKnowledge(level, category){
  return KNOWLEDGE.find(k => k.level === level && k.category === category) || null;
}
function getDaily(level){
  const pool = getQuestions(level);
  if (!pool.length) return null;
  const day = Math.floor(Date.now() / 86400000);
  return pool[day % pool.length];
}

/* 知识点掌握度 */
function getCategoryMastery(level, category){
  const qs = getQuestions(level, category);
  const stats = Store.getQStats();
  let t = 0, c = 0;
  qs.forEach(q => {
    const s = stats[q.id];
    if (s){ t += s.t; c += s.c; }
  });
  const wrongIds = Store.getWrong().map(w => w.id);
  const wrongCount = qs.filter(q => wrongIds.includes(q.id)).length;
  return {
    total: qs.length,
    answered: t,
    correct: c,
    rate: t ? Math.round(c / t * 100) : 0,
    wrongCount
  };
}

      b.classList.toggle('active', b.dataset.tab === state.page);

    backBtn.classList.remove('hidden');

  const map = {
    home: renderHome,
    practice: renderPractice,
    exam: renderExam,
    result: renderResult,
    wrong: renderWrong,
    learn: renderLearn,
    learnDetail: renderLearnDetail,
    profile: renderProfile

  view.innerHTML = (map[state.page] || renderHome)();

  if (state.page === 'exam' && state.exam && state.exam.running){

/* =========================================================
   12. 练习模式
   ========================================================= */
function startPractice(level, category){
  const list = shuffle(getQuestions(level, category));
  if (!list.length){ alert('该知识点暂无题目'); return; }
  startPracticeWithList(list, level, category || '综合练习');
}

function startPracticeWithList(list, level, label){
  state.practice = {
    list,
    index: 0,
    userAnswers: new Array(list.length).fill(null),
    showAnswer: false,
    correct: 0,
    wrong: 0,
    level,
    label
  };
  go('practice');
}

function renderPractice(){
  const p = state.practice;
  if (!p) return `<div class="empty"><div class="ico">😕</div><div class="txt">数据丢失</div></div>`;

  const q = p.list[p.index];
  const ua = p.userAnswers[p.index];
  const total = p.list.length;
  const answered = isAnswered(q, ua);

  return `
    <div class="topbar">
      <div class="counter">第 ${p.index + 1} / ${total} 题</div>
      <div class="counter"><span class="ok">✓ ${p.correct}</span>　<span class="no">✗ ${p.wrong}</span></div>
    </div>
    <div class="progress"><i style="width:${rate(p.index, total)}%"></i></div>

    <div class="card">
      <div class="tags">
        <span class="tag">${esc(q.level)}</span>
        <span class="tag">${esc(q.category)}</span>
        <span class="tag amber">${typeLabel(q.type)}</span>
      </div>
      <div class="stem">${esc(q.stem)}</div>
      ${renderQuestionInput(q, ua, p.showAnswer, 'practiceChoose')}
    </div>

    ${p.showAnswer ? `
      <div class="explain">
        <div class="head ${isAnswerCorrect(q, ua) ? 'ok' : 'no'}">
          ${isAnswerCorrect(q, ua) ? '✓ 回答正确' : '✗ 回答错误'}
        </div>
        <div class="line">正确答案：${esc(answerText(q))}</div>
        <div class="line">${esc(q.explanation)}</div>
      </div>` : ''}

    <div class="footer">
      ${!p.showAnswer
        ? `<button class="btn btn-main" ${!answered ? 'disabled' : ''} onclick="practiceSubmit()">提交答案</button>`
        : (p.index < total - 1
            ? `<button class="btn btn-main" onclick="practiceNext()">下一题</button>`
            : `<button class="btn btn-main" onclick="practiceFinish()">完成练习</button>`)
      }
    </div>
  `;
}

/* 渲染答题区域（按题型） */
function renderQuestionInput(q, ua, showAnswer, clickFn){
  if (q.type === 'fill'){
    const val = esc(ua == null ? '' : ua);
    return `
      <input class="fill-input" id="fillInput"
        type="text"
        value="${val}"
        placeholder="请输入答案"
        ${showAnswer ? 'disabled' : ''}
        oninput="onFillInput(this.value)"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      ${showAnswer ? `<div class="line" style="margin-top:12px;font-size:13px;color:var(--sub);">
        你填写的是：<b style="color:${isAnswerCorrect(q, ua) ? 'var(--green)' : 'var(--red)'};">${esc(ua || '（空）')}</b>
      </div>` : ''}
    `;
  }

  const isMulti = q.type === 'multi';
  const arr = Array.isArray(ua) ? ua : [];

  return q.options.map((text, i) => {
    let cls = 'option';
    const isSelected = isMulti ? arr.includes(i) : (ua === i);
    const isRight = isMulti ? q.answer.includes(i) : q.answer === i;

    if (showAnswer){
      if (isRight) cls += ' right';
      else if (isSelected) cls += ' wrong';
      else cls += ' dim';
    } else if (isSelected){
      cls += ' selected';
    }

    const key = q.type === 'judge' ? (i === 0 ? '✓' : '✗') : LETTERS[i];

    return `<div class="${cls}" onclick="${clickFn}(${i})">
      <span class="opt-key">${key}</span>
      <span class="opt-text">${esc(text)}</span>
    </div>`;
  }).join('');
}

function onFillInput(v){
  const p = state.practice;
  if (!p) return;
  p.userAnswers[p.index] = v;
  // 实时启用/禁用提交按钮
  const btn = document.querySelector('.footer .btn-main');
  if (btn && !p.showAnswer){
    btn.disabled = !v.trim();
  }
}

function practiceChoose(i){
  const p = state.practice;
  if (!p || p.showAnswer) return;

  const q = p.list[p.index];

  if (q.type === 'multi'){
    let arr = Array.isArray(p.userAnswers[p.index]) ? p.userAnswers[p.index].slice() : [];
    const idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(i);
    p.userAnswers[p.index] = arr;
    // 局部更新，不重渲染（避免滚动跳动）
    const nodes = document.querySelectorAll('.option');
    nodes.forEach((n, k) => {
      n.className = 'option' + (arr.includes(k) ? ' selected' : '');
    });
    const btn = document.querySelector('.footer .btn-main');
    if (btn) btn.disabled = arr.length === 0;
    return;
  }

  p.userAnswers[p.index] = i;
  const nodes = document.querySelectorAll('.option');
  nodes.forEach((n, k) => {
    n.className = 'option' + (k === i ? ' selected' : '');
  });
  const btn = document.querySelector('.footer .btn-main');
  if (btn) btn.disabled = false;
}

function practiceSubmit(){
  const p = state.practice;
  if (!p) return;

  const q = p.list[p.index];
  const ua = p.userAnswers[p.index];
  if (!isAnswered(q, ua)) return;

  const ok = isAnswerCorrect(q, ua);
  if (ok){
    p.correct++;
  } else {
    p.wrong++;
    Store.addWrong(q.id);
  }
  Store.bumpQStat(q.id, ok);

  p.showAnswer = true;
  render();
}

function practiceNext(){
  const p = state.practice;
  p.index++;
  p.showAnswer = false;
  render();
}

function practiceFinish(){
  const p = state.practice;
  const total = p.list.length;
  const correct = p.correct;

  Store.addRecord({ mode:'practice', total, correct });

  const msg = `共 ${total} 题\n答对 ${correct} 题\n正确率 ${rate(correct, total)}%\n\n点击「确定」再来一组，点击「取消」返回`;
  if (confirm(msg)){
    const list = shuffle(p.list);
    state.practice = {
      list,
      index: 0,
      userAnswers: new Array(list.length).fill(null),
      showAnswer: false,
      correct: 0,
      wrong: 0,
      level: p.level,
      label: p.label
    };
    render();
  } else {
    go('home');
  }
}

/* =========================================================
   13. 模拟竞赛
   ========================================================= */
const EXAM_COUNT = 20;
const EXAM_MINUTES = 20;

function startExam(level){
  const pool = getQuestions(level);
  if (!pool.length){ alert('题库为空'); return; }

  const list = shuffle(pool).slice(0, Math.min(EXAM_COUNT, pool.length));

  state.exam = {
    list,
    index: 0,
    answers: new Array(list.length).fill(null),
    remain: EXAM_MINUTES * 60,
    total: EXAM_MINUTES * 60,
    showCard: false,
    running: true
  };
  go('exam');
}

function renderExam(){
  const e = state.exam;
  if (!e) return `<div class="empty"><div class="ico">😕</div><div class="txt">数据丢失</div></div>`;

  const q = e.list[e.index];
  const ua = e.answers[e.index];
  const answered = e.answers.filter((a, i) => isAnswered(e.list[i], a)).length;

  return `
    <div class="topbar">
      <div class="timer" id="timerText">${fmtTime(e.remain)}</div>
      <div class="counter">已答 ${answered} / ${e.list.length}</div>
      <button class="card-btn" onclick="toggleCard()">答题卡</button>
    </div>
    <div class="progress"><i style="width:${rate(e.index + 1, e.list.length)}%"></i></div>

    <div class="card">
      <div class="tags">
        <span class="tag">${esc(q.level)}</span>
        <span class="tag">${esc(q.category)}</span>
        <span class="tag amber">${typeLabel(q.type)}</span>
        <span class="tag">第 ${e.index + 1} 题</span>
      </div>
      <div class="stem">${esc(q.stem)}</div>
      ${renderQuestionInput(q, ua, false, 'examChoose')}
    </div>

    <div class="btn-row" style="margin-top:6px;">
      <button class="btn btn-ghost" ${e.index === 0 ? 'disabled' : ''} onclick="examPrev()">上一题</button>
      <button class="btn btn-ghost" ${e.index === e.list.length - 1 ? 'disabled' : ''} onclick="examNext()">下一题</button>
    </div>

    <button class="btn btn-main" style="margin-top:16px;" onclick="examConfirmSubmit()">交卷</button>

    ${e.showCard ? `
      <div class="mask" onclick="toggleCard()"></div>
      <div class="sheet show">
        <h3>答题卡</h3>
        <div class="sheet-grid">
          ${e.list.map((qq, i) => `
            <div class="sheet-item ${isAnswered(qq, e.answers[i]) ? 'done' : ''} ${i === e.index ? 'active' : ''}"
                 onclick="examJump(${i})">${i + 1}</div>
          `).join('')}
        </div>
        <div class="sheet-tip">蓝色 = 已作答　灰色 = 未作答</div>
      </div>
    ` : ''}
  `;
}

function startExamTimer(){
  const t = setInterval(() => {
    if (!state.exam || state.page !== 'exam'){
      clearInterval(t);
      return;
    }
    state.exam.remain--;

    if (state.exam.remain <= 0){
      state.exam.remain = 0;
      updateTimerText();
      clearInterval(t);
      state.exam.running = false;
      alert('时间到，自动交卷！');
      submitExam();
      return;
    }
    updateTimerText();
  }, 1000);
  timers.push(t);
}

function updateTimerText(){
  const el = document.getElementById('timerText');
  if (el && state.exam){
    el.textContent = fmtTime(state.exam.remain);
    el.style.color = state.exam.remain <= 60 ? 'var(--red)' : 'var(--blue)';
  }
}

function examChoose(i){
  const e = state.exam;
  if (!e) return;

  const q = e.list[e.index];

  if (q.type === 'multi'){
    let arr = Array.isArray(e.answers[e.index]) ? e.answers[e.index].slice() : [];
    const idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(i);
    e.answers[e.index] = arr;
    const nodes = document.querySelectorAll('.option');
    nodes.forEach((n, k) => {
      n.className = 'option' + (arr.includes(k) ? ' selected' : '');
    });
  } else {
    e.answers[e.index] = i;
    const nodes = document.querySelectorAll('.option');
    nodes.forEach((n, k) => {
      n.className = 'option' + (k === i ? ' selected' : '');
    });
  }

  // 更新已答计数
  const counter = document.querySelector('.topbar .counter');
  if (counter){
    const answered = e.answers.filter((a, i) => isAnswered(e.list[i], a)).length;
    counter.textContent = `已答 ${answered} / ${e.list.length}`;
  }
}

function onFillInputExam(v){
  const e = state.exam;
  if (!e) return;
  e.answers[e.index] = v;
  const counter = document.querySelector('.topbar .counter');
  if (counter){
    const answered = e.answers.filter((a, i) => isAnswered(e.list[i], a)).length;
    counter.textContent = `已答 ${answered} / ${e.list.length}`;
  }
}

function examPrev(){ const e = state.exam; if (e.index === 0) return; e.index--; render(); }
function examNext(){ const e = state.exam; if (e.index >= e.list.length - 1) return; e.index++; render(); }
function examJump(i){ state.exam.index = i; state.exam.showCard = false; render(); }
function toggleCard(){ state.exam.showCard = !state.exam.showCard; render(); }

function examConfirmSubmit(){
  const e = state.exam;
  const unanswered = e.list.filter((q, i) => !isAnswered(q, e.answers[i])).length;
  const msg = unanswered > 0 ? `还有 ${unanswered} 题未作答，确定交卷吗？` : '确定交卷吗？';
  if (confirm(msg)) submitExam();
}

function submitExam(){
  const e = state.exam;
  if (!e) return;

  clearTimers();
  e.running = false;

  let score = 0, right = 0, wrong = 0, blank = 0;
  const details = [];

  e.list.forEach((q, i) => {
    const ua = e.answers[i];
    const ok = isAnswerCorrect(q, ua);
    const done = isAnswered(q, ua);

    if (!done){
      blank++;
    } else if (ok){
      right++;
      score += 2;
    } else {
      wrong++;
      score -= 1;
      Store.addWrong(q.id);
    }
    Store.bumpQStat(q.id, ok && done);

    details.push({
      id: q.id,
      type: q.type,
      stem: q.stem,
      options: q.options || null,
      your: ua,
      correct: q.answer,
      explanation: q.explanation,
      isCorrect: ok,
      isBlank: !done
    });
  });

  const result = {
    level: e.list[0].level,
    total: e.list.length,
    score,
    fullScore: e.list.length * 2,
    right, wrong, blank,
    rate: rate(right, e.list.length),
    used: e.total - e.remain,
    details
  };

  Store.addRecord({ mode:'exam', total: e.list.length, correct: right });

  state.result = result;
  state.exam = null;
  go('result');
}

            <span class="tag amber">${typeLabel(d.type)}</span>
          </div>
          <div class="q-stem">${esc(d.stem)}</div>
          <div class="q-line">
            ${d.options
              ? d.options.map((t, i) => {
                  const isRight = Array.isArray(d.correct) ? d.correct.includes(i) : d.correct === i;
                  const isYours = Array.isArray(d.your) ? d.your.includes(i) : d.your === i;
                  let cls = '';
                  if (isRight) cls = 'ok';
                  else if (isYours) cls = 'no';
                  return `<span class="${cls}">${LETTERS[i]}. ${esc(t)}</span>`;
                }).join('<br>')
              : `<span style="color:var(--sub);">你的答案：</span>
                 <span class="no">${esc(d.your || '（空）')}</span>`}
          </div>
          <div class="q-exp">
            ${d.isBlank ? '⚠️ 本题未作答<br>' : ''}
            正确答案：<b style="color:var(--green);">${esc(answerText({ type:d.type, answer:d.correct, options:d.options }))}</b><br>
            ${esc(d.explanation)}
          </div>
        </div>
      `).join('')}
    ` : `
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div style="font-size:40px;margin-bottom:10px;">🎉</div>
        <div style="font-size:16px;font-weight:700;">全部答对，太棒了！</div>
      </div>
    `}

    <div class="btn-row" style="margin:24px 0 40px;">
      <button class="btn btn-ghost" onclick="go('wrong')">查看错题归纳</button>
      <button class="btn btn-main" onclick="go('home')">返回首页</button>
    </div>
  `;
}

/* =========================================================
   15. 错题归纳再提问
   ========================================================= */
function renderWrong(){
  const wrongIds = Store.getWrong();
  if (!wrongIds.length){
    return `
      <div class="title">错题归纳</div>
      <div class="sub" style="margin-bottom:20px;">按知识点归纳，支持再提问</div>
      <div class="empty">
        <div class="ico">✨</div>
        <div class="txt">还没有错题，继续保持！</div>
      </div>
    `;
  }

  // 按 level + category 分组
  const groups = {};
  wrongIds.forEach(w => {
    const q = QUESTIONS.find(x => x.id === w.id);
    if (!q) return;
    const key = q.level + '|' + q.category;
    if (!groups[key]) groups[key] = { level: q.level, category: q.category, items: [] };
    groups[key].items.push({ q, count: w.count, lastTime: w.lastTime });
  });

  const groupList = Object.values(groups).sort((a, b) => b.items.length - a.items.length);
  const totalWrong = wrongIds.length;

  return `
    <div class="title">错题归纳</div>
    <div class="sub" style="margin-bottom:16px;">
      共 ${totalWrong} 道错题，分布在 ${groupList.length} 个知识点
    </div>

    <div class="card" style="background:linear-gradient(135deg,rgba(255,184,77,.10),rgba(255,91,91,.08));border-color:rgba(255,184,77,.25);">
      <div style="font-size:13px;line-height:1.8;color:#C8D2E8;">
        💡 <b style="color:var(--amber);">再提问</b>：点开知识点，点击「再提问」按钮，
        系统会从该知识点重新抽题，帮你巩固薄弱环节。
      </div>
    </div>

    ${groupList.map(g => {
      const key = g.level + '|' + g.category;
      const expanded = !!state.expandedGroups[key];
      const k = getKnowledge(g.level, g.category);
      const icon = k ? k.icon : '📖';

      return `
        <div class="group-head" onclick="toggleGroup('${esc(key)}')">
          <div class="gh-l">
            <div class="learn-ico" style="width:36px;height:36px;font-size:18px;">${icon}</div>
            <div>
              <div class="gn">${esc(g.category)}</div>
              <div class="gc">${esc(g.level)} · ${g.items.length} 道错题</div>
            </div>
          </div>
          <div style="color:var(--sub);font-size:18px;">${expanded ? '▾' : '▸'}</div>
        </div>

        ${expanded ? `
          <div class="group-body">
            ${g.items.map(it => `
              <div class="card" style="padding:15px;">
                <div class="tags">
                  <span class="tag amber">${typeLabel(it.q.type)}</span>
                  <span class="tag err">错 ${it.count} 次</span>
                </div>
                <div class="q-stem" style="font-size:14.5px;">${esc(it.q.stem)}</div>
                <div class="q-line">
                  ${it.q.options
                    ? it.q.options.map((t, i) => {
                        const isRight = Array.isArray(it.q.answer) ? it.q.answer.includes(i) : it.q.answer === i;
                        return `<span class="${isRight ? 'ok' : ''}">${LETTERS[i]}. ${esc(t)}</span>`;
                      }).join('<br>')
                    : `<span class="ok">正确答案：${esc(answerText(it.q))}</span>`}
                </div>
                <div class="q-exp">${esc(it.q.explanation)}</div>
                <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">
                  <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();removeWrong('${it.q.id}')">移除</button>
                </div>
              </div>
            `).join('')}

            <button class="btn btn-amber" style="margin-bottom:16px;"
              onclick="reAsk('${esc(g.level)}','${esc(g.category)}')">
              🔁 针对「${esc(g.category)}」再提问
            </button>
          </div>
        ` : ''}
      `;
    }).join('')}

    <button class="btn btn-ghost" style="margin:10px 0 40px;" onclick="clearWrong()">清空错题本</button>
  `;
}

function toggleGroup(key){
  state.expandedGroups[key] = !state.expandedGroups[key];
  render();
}

/* 再提问：从指定知识点重新抽题 */
function reAsk(level, category){
  const pool = getQuestions(level, category);
  if (!pool.length){ alert('该知识点暂无题目'); return; }

  // 优先抽错题，再补充其它题
  const wrongIds = Store.getWrong().map(w => w.id);
  const wrongOnes = pool.filter(q => wrongIds.includes(q.id));
  const others = pool.filter(q => !wrongIds.includes(q.id));

  let picked = shuffle(wrongOnes);
  if (picked.length < 5){
    picked = picked.concat(shuffle(others).slice(0, 5 - picked.length));
  }
  picked = shuffle(picked).slice(0, Math.min(6, pool.length));

  const ok = confirm(
    `针对「${category}」再提问\n\n` +
    `本次共 ${picked.length} 题\n` +
    `（优先抽取你答错过的题目）\n\n` +
    `点击「确定」开始练习`
  );
  if (!ok) return;

  startPracticeWithList(picked, level, category + ' · 强化练习');
}

function removeWrong(id){
  if (!confirm('确定从错题本移除这道题吗？')) return;
  Store.removeWrong(id);
  render();
}
function clearWrong(){
  if (!confirm('所有错题记录将被删除，不可恢复。确定吗？')) return;
  Store.clearWrong();
  render();
}

/* =========================================================
   16. 我的
   ========================================================= */

  const s = Store.getStats();
  const cats = getCategories(state.level);

  // 最薄弱知识点
  let weakest = null;
  cats.forEach(c => {
    const m = getCategoryMastery(state.level, c);
    if (m.answered >= 3){

  return `
    <div class="profile-card">
      <div class="av">🔭</div>

    </div>

    <div class="grid2">

      <div><div class="n">${s.rate}%</div><div class="l">正确率</div></div>
      <div><div class="n">${s.days}</div><div class="l">学习天数</div></div>
      <div><div class="n">${s.wrongCount}</div><div class="l">错题数</div></div>
    </div>

    ${weakest ? `

      <div style="font-size:13px;color:var(--sub);margin-bottom:6px;">📌 薄弱知识点</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:17px;font-weight:700;">${esc(weakest.category)}</div>
        <div style="font-size:20px;font-weight:800;color:var(--red);">${weakest.rate}%</div>
      </div>
      <button class="btn btn-amber" style="margin-top:14px;" onclick="reAsk('${esc(state.level)}','${esc(weakest.category)}')">

      </button>
    </div>` : ''}

    <div class="card" style="padding:0;">
      <div class="row-item" style="padding:16px 18px;" onclick="go('learn')">
        <span>📚 知识点学习</span><span class="arrow">${getCategories(state.level).length} 个 ›</span>
      </div>
      <div style="height:1px;background:var(--line);margin:0 18px;"></div>
      <div class="row-item" style="padding:16px 18px;" onclick="go('wrong')">
        <span>📕 错题归纳</span><span class="arrow">${s.wrongCount} 道 ›</span>
      </div>
      <div style="height:1px;background:var(--line);margin:0 18px;"></div>
      <div class="row-item" style="padding:16px 18px;" onclick="go('home')">
        <span>🏠 返回首页</span><span class="arrow">›</span>
      </div>
    </div>

    <div class="card" style="padding:0;">
      <div class="row-item" style="padding:16px 18px;" onclick="clearAllData()">
        <span style="color:var(--red);">🗑 清除所有数据</span>
        <span class="arrow">›</span>
      </div>
    </div>

    <div class="version">
      星赛通 v2.0 · 网页版<br>
      题库 ${QUESTIONS.length} 题（小学 ${QUESTIONS.filter(q=>q.level==='小学').length} · 初中 ${QUESTIONS.filter(q=>q.level==='初中').length}）<br>
      知识卡 ${KNOWLEDGE.length} 张
    </div>
  `;
}

function clearAllData(){
  if (!confirm('错题本、答题记录、学习统计都会被清空，不可恢复。确定吗？')) return;
  Store.clearAll();
  render();
  alert('已清除');
}

/* =========================================================
   17. 事件绑定
   ========================================================= */
backBtn.addEventListener('click', () => {
  if (state.page === 'result') return go('home');
  if (state.page === 'learnDetail') return go('learn');
  if (state.page === 'practice' || state.page === 'exam'){
    if (state.page === 'exam' && state.exam){
      if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
      clearTimers();
      state.exam = null;
    }
    return go('home');
  }
  go('home');
});

tabbar.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const tab = btn.dataset.tab;
  if (!tab || tab === state.page) return;
  if (state.page === 'exam' && state.exam){
    if (!confirm('退出后本次答题记录不会保存，确定退出吗？')) return;
    clearTimers();
    state.exam = null;
  }
  go(tab);
});

// 键盘快捷键：1-4 选项 / Enter 提交 / ←→ 翻页
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const isInput = tag === 'input' || tag === 'textarea';

  if (state.page === 'practice'){
    const p = state.practice;
    if (!p) return;
    const q = p.list[p.index];

    if (!isInput && !p.showAnswer && q.type !== 'fill'){
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length){
        practiceChoose(n - 1);
        e.preventDefault();
      }
    }
    if (e.key === 'Enter'){
      e.preventDefault();
      if (!p.showAnswer && isAnswered(q, p.userAnswers[p.index])) practiceSubmit();
      else if (p.showAnswer && p.index < p.list.length - 1) practiceNext();
    }
  }

  if (state.page === 'exam'){
    const ex = state.exam;
    if (!ex) return;
    const q = ex.list[ex.index];

    if (!isInput && q.type !== 'fill'){
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length){
        examChoose(n - 1);
        e.preventDefault();
      }
    }
    if (!isInput && e.key === 'ArrowLeft') examPrev();
    if (!isInput && e.key === 'ArrowRight') examNext();
  }
});

/* 竞赛页的填空输入需要单独绑定（因为 renderQuestionInput 里写死了 onFillInput） */
const origRenderExam = renderExam;
renderExam = function(){
  const html = origRenderExam();
  return html;
};

/* =========================================================
   18. 启动

render();
