name: Reference UI and domain regression

on:
  push:
    branches: [main, rebuild/platform-v2]
  pull_request:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-domain-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run JavaScript syntax and static checks
        run: npm run check
      - name: Validate readable typography and focus states
        run: node scripts/validate-readability.cjs
      - name: Parse embedded JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8') + '<script>' + fs.readFileSync('assets/js/question-grading.js', 'utf8') + String.fromCharCode(60,47,115,99,114,105,112,116,62) + '<script>' + fs.readFileSync('assets/js/legacy-app.js', 'utf8') + String.fromCharCode(60,47,115,99,114,105,112,116,62);
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          const executable = scripts.filter(([, attrs]) => {
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            return !type || /^(module|text\/javascript|application\/javascript)$/i.test(type);
          });
          if (!executable.length) throw new Error('No inline executable JavaScript found');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'inline-js-'));
          executable.forEach(([, , source], index) => {
            const file = path.join(dir, `script-${index + 1}.js`);
            fs.writeFileSync(file, source);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Syntax OK: ${executable.length} inline script(s)`);
          NODE
      - name: Validate astronomy question bank
        run: node .github/scripts/validate-question-bank.cjs
      - name: Validate question grading rules
        run: node scripts/validate-question-grading.cjs
      - name: Validate study storage recovery
        run: node scripts/validate-storage-recovery.cjs
      - name: Validate offline app shell
        run: node scripts/validate-pwa.cjs
      - name: Run domain regression tests
        run: npm test
      - name: Start local application server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/reference-ui-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reference-ui-http.log
          exit 1
      - name: Verify reference layout, interactions, and product flows
        run: node scripts/browser-pwa-smoke.cjs
      - name: Upload desktop and mobile topic mastery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penny-topic-mastery-ui-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser-and-domain-regression
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified web application
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy the verified interface
        id: deployment
        uses: actions/deploy-pages@v4
