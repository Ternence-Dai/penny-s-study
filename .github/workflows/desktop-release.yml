name: StarRace Desktop Windows desktop validation and release
run-name: "starrace desktop ${{ github.event_name }} · ${{ github.run_number }}"

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'docs/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/desktop-release.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'docs/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the versioned Windows desktop release"
        required: true
        type: boolean
        default: false

concurrency:
  group: starrace-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run domain tests and static integrity checks
        run: |
          npm test
          npm run check

      - name: Read pinned Electron version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').devDependencies.electron"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "desktop/package.json must pin Electron to an exact version; found: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable Windows application
        run: node desktop/build-windows.cjs

      - name: Inspect portable package contents
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'StarRace-Windows-x64.zip'
          if (!(Test-Path $archive)) { throw 'Windows ZIP was not produced' }
          if ((Get-Item $archive).Length -lt 10000000) { throw 'Windows ZIP is unexpectedly small' }
          $stage = Join-Path $env:RUNNER_TEMP 'starrace-package-inspect'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $required = @(
            (Join-Path $stage 'StarRace.exe'),
            (Join-Path $stage 'resources\app\app.json'),
            (Join-Path $stage 'resources\app\main.cjs'),
            (Join-Path $stage 'resources\app\web\index.html')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required packaged file missing: $file" }
          }
          $webAssets = Join-Path $stage 'resources\app\web\assets'
          if (!(Test-Path $webAssets)) { throw 'Packaged web assets directory missing' }
          "Portable package structure verified for StarRace.exe."

      - name: Launch the packaged EXE and capture its rendered UI
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'starrace-package-inspect'
          $exe = Join-Path $stage 'StarRace.exe'
          $shot = Join-Path $env:RUNNER_TEMP 'starrace-windows-smoke.png'
          $env:STARRACE_SMOKE = $shot
          $process = Start-Process -FilePath $exe -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged application exited with code $($process.ExitCode)" }
          if (!(Test-Path $shot) -or (Get-Item $shot).Length -lt 10000) {
            throw 'Packaged application did not produce a valid screenshot'
          }
          Remove-Item Env:STARRACE_SMOKE -ErrorAction SilentlyContinue
          "Packaged desktop launch smoke passed; screenshot bytes: $((Get-Item $shot).Length)"

      - name: Upload validated Windows package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: starrace-windows-desktop-package
          path: StarRace-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: starrace-windows-desktop-smoke-evidence
          path: ${{ runner.temp }}/starrace-windows-smoke.png
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    # Publishing a versioned desktop release is an explicit operator action.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate-package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: starrace-windows-desktop-package
          path: release

      - name: Publish versioned desktop release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: desktop-v${{ needs.validate-package.outputs.app-version }}
          name: StarRace Desktop v${{ needs.validate-package.outputs.app-version }}
          files: release/StarRace-Windows-x64.zip
          fail_on_unmatched_files: true
